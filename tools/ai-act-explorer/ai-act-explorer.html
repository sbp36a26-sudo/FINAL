<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU AI Act Explorer</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede7; --ink:#1c1c1a; --muted:#5b5953; --line:#d8d4cb; --line-strong:#8e897e;
  --link:#1f4f7c; --focus:#1a5fd0;
  --t-pro-bg:#f4e1dd; --t-pro-bd:#9c4a3e;
  --t-high-bg:#f6ebd2; --t-high-bd:#946820;
  --t-tra-bg:#dfeaef; --t-tra-bd:#3a6879;
  --t-min-bg:#ebe9e4; --t-min-bd:#85827a;
  --amend:#6e5212; --amend-bg:#fbf3df;
  --new:#2a5a37; --new-bg:#e6f0e8;
  --gdpr:#4f4178; --gdpr-bg:#eeebf5;
  --todo:#7a2f6b;
  --radius:10px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --surface:#1d1d1b; --surface2:#262623; --ink:#ecebe6; --muted:#aba89f; --line:#3a3934; --line-strong:#7d7a71;
    --link:#93bfe8; --focus:#71aaff;
    --t-pro-bg:#3a2522; --t-pro-bd:#d48a7b;
    --t-high-bg:#372c17; --t-high-bd:#d6ad60;
    --t-tra-bg:#1c3038; --t-tra-bd:#80b4c6;
    --t-min-bg:#2a2a27; --t-min-bd:#a3a097;
    --amend:#e6c57d; --amend-bg:#33291a;
    --new:#a3d3ad; --new-bg:#1c3022;
    --gdpr:#c2b4e6; --gdpr-bg:#27223a;
    --todo:#e9a2d8;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--link)}
[id]{scroll-margin-top:88px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.875rem}.muted{color:var(--muted)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5rem}
h2{font-size:1.45rem;letter-spacing:-.01em}
h3{font-size:1.1rem}
h4{font-size:1rem}
p{margin:.4rem 0 .7rem}
ul{margin:.3rem 0 .8rem;padding-left:1.25rem}
li{margin:.2rem 0}
blockquote{margin:.5rem 0;padding:.6rem .9rem;border-left:3px solid var(--line-strong);background:var(--surface2);border-radius:0 6px 6px 0;font-family:Georgia,"Times New Roman",serif;font-size:.98rem}
code{font-size:.85em;background:var(--surface2);padding:.05rem .3rem;border-radius:4px;word-break:break-word}
button{font:inherit;color:inherit}
.linkish{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;text-align:left}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 .25rem;font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.6rem 16px;max-width:1180px;margin:0 auto}
.brand{font-weight:700;font-size:1rem;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.modes,.tools{display:flex;gap:.35rem;flex-wrap:wrap}
.mode-btn,.tool-btn{border:1.5px solid var(--line-strong);background:var(--surface);padding:.35rem .8rem;border-radius:999px;cursor:pointer;font-size:.9rem}
.mode-btn[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.tool-btn{border-style:solid;font-size:.85rem}
.tool-btn .count{font-weight:700}

/* ---------- footer ---------- */
.foot{background:var(--surface);border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);padding:.45rem 16px;line-height:1.45}
.foot b{color:var(--ink)}
@media (min-width:721px){.foot{position:fixed;left:0;right:0;bottom:0;z-index:25}body{padding-bottom:70px}}

/* ---------- sections ---------- */
main{padding:1.25rem 0 2rem}
.view[hidden]{display:none}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.25rem 1rem;margin:0 0 1.25rem}
.sec-sub{color:var(--muted);margin-top:-.2rem}
.toc{display:flex;flex-wrap:wrap;gap:.35rem .9rem;align-items:center;font-size:.9rem;margin:0 0 1rem}
.toc .linkish{font-size:.9rem}
.hero{background:transparent;border:0;padding:.5rem 0 0}
.headline{font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.35;font-weight:600;margin:.2rem 0 1rem;max-width:62rem;font-family:Georgia,"Times New Roman",serif}
.scope{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline}
.scope p{margin:0;flex:1 1 30rem}
.h-small{font-size:1.05rem}.h-tiny{font-size:.9rem;margin-bottom:.35rem}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.legend-list{list-style:none;padding:0;margin:0}
.legend-list li{display:flex;gap:.5rem;align-items:baseline;font-size:.86rem;margin:.35rem 0}
.legend-list li>:first-child{flex:0 0 auto}

/* ---------- confidence badges (shape + icon + label; colour never alone) ---------- */
.conf{display:inline-flex;align-items:center;gap:.3em;font-size:.76rem;font-weight:600;padding:.08rem .55rem;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);white-space:nowrap;vertical-align:middle;line-height:1.5}
.conf-i{font-size:.85em}
.conf-settled{border-style:solid}
.conf-scheduled{border-style:double;border-width:3px;padding:.02rem .5rem}
.conf-judgement{border-style:dashed}
.conf-draft-guidance{border-style:dotted;border-width:2px}
.conf-contested{border-style:dashed;border-width:2.5px;font-style:italic}
.co-judgement,.co-contested{border-style:dashed!important}
.co-contested{border-width:2px!important}
.co-draft-guidance{border-style:dotted!important;border-width:2px!important}

/* ---------- tier tags ---------- */
.tier-tag{display:inline-flex;align-items:center;gap:.3em;font-size:.78rem;font-weight:700;padding:.05rem .55rem;border-radius:6px;border:1.5px solid;white-space:nowrap;vertical-align:middle}
.tt-prohibited{background:var(--t-pro-bg);border-color:var(--t-pro-bd)}
.tt-high{background:var(--t-high-bg);border-color:var(--t-high-bd)}
.tt-transparency{background:var(--t-tra-bg);border-color:var(--t-tra-bd)}
.tt-minimal{background:var(--t-min-bg);border-color:var(--t-min-bd)}
.tt-out-of-scope{background:var(--surface);border-color:var(--line-strong);border-style:dashed}
.role-tag{display:inline-flex;font-size:.78rem;font-weight:600;padding:.05rem .5rem;border-radius:6px;border:1.5px solid var(--line-strong);vertical-align:middle}

/* ---------- citations ---------- */
.cites{display:flex;flex-wrap:wrap;gap:.3rem .4rem;align-items:center;margin:.5rem 0 .3rem}
.cites-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-right:.1rem}
.chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.3rem;border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;background:var(--surface);font-size:.82rem}
.chip-amended{border-color:var(--amend)}
.chip-new{border-color:var(--new)}
.cite{font-weight:600}
.cite-text{font-weight:500;color:var(--ink)}
.cite-int{background:none;border:0;padding:0;color:var(--link);text-decoration:underline dotted;cursor:pointer;font-size:.82rem}
.cite-pg{color:var(--muted);font-size:.75rem}
.amend-tag,.new-tag{font-size:.7rem;font-weight:700;padding:0 .35rem;border-radius:4px;border:1px solid;white-space:nowrap}
.amend-tag{color:var(--amend);background:var(--amend-bg);border-color:var(--amend)}
.new-tag{color:var(--new);background:var(--new-bg);border-color:var(--new)}
.omni-link{font-size:.75rem;font-weight:600}
.amend-btn{font-family:inherit;cursor:pointer;line-height:1.5}
.amend-btn:hover{text-decoration:underline}
#gl-pop{max-width:min(460px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto}
.todo{font-size:.72rem;font-weight:700;color:var(--todo);border:1px dashed var(--todo);padding:0 .3rem;border-radius:4px}
.amend-notes{list-style:none;padding:0;margin:.3rem 0 .6rem}
.amend-note{font-size:.82rem;line-height:1.5;padding:.35rem .55rem;margin:.25rem 0;border-left:3px solid var(--amend);background:var(--amend-bg);border-radius:0 6px 6px 0}
.amend-note.is-new{border-left-color:var(--new);background:var(--new-bg)}

/* ---------- corrections, flags, notes, open items ---------- */
.corr{font-size:.85rem;padding:.45rem .65rem;margin:.5rem 0;border:1.5px solid var(--amend);border-radius:8px;background:var(--amend-bg)}
.corr-h{font-weight:700;margin-right:.25rem}
.corr-h::before{content:"Δ ";}
.flag{font-weight:700;margin:.2rem 0 .5rem;padding:.3rem .55rem;border:2px solid var(--ink);border-radius:6px;display:inline-block;font-size:.88rem}
.note{font-size:.9rem;padding:.4rem .6rem;border-left:3px solid var(--line-strong);background:var(--surface2);border-radius:0 6px 6px 0;margin:.4rem 0}
.note::before{content:"Note · ";font-weight:700}
.oi-strip{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.5rem 0}
.oi-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.oi-chip{font-size:.78rem;text-align:left;border:1.5px dashed var(--line-strong);background:var(--surface);border-radius:6px;padding:.1rem .5rem;cursor:pointer;max-width:100%}
.gap{font-size:.86rem;border:1px dashed var(--line-strong);padding:.35rem .6rem;border-radius:6px}
.gap::before{content:"Gap in research · ";font-weight:700}

/* ---------- regime map ---------- */
.regime{display:grid;grid-template-columns:1fr minmax(220px,280px);gap:1.25rem;align-items:start;margin-top:.75rem}
.lp{display:grid;grid-template-columns:minmax(150px,190px) 1fr;gap:1.25rem;align-items:stretch}
.literacy{border:2.5px solid var(--ink);border-right:0;border-radius:12px 0 0 12px;padding:.9rem;display:flex;flex-direction:column;justify-content:center;gap:.3rem;position:relative}
.literacy::after{content:"";position:absolute;right:-1px;top:-2.5px;bottom:-2.5px;width:10px;border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink)}
.literacy h3{margin:0}
.literacy p{margin:.2rem 0;font-size:.88rem}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.tier-btn{width:var(--w);display:grid;grid-template-columns:auto 1fr;gap:.1rem .7rem;text-align:left;cursor:pointer;border:2px solid;border-radius:10px;padding:.65rem .85rem;font-size:.9rem;line-height:1.4}
.tier-btn[aria-expanded="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.tb-step{grid-row:span 3;font-size:1.4rem;font-weight:700;opacity:.65;align-self:center}
.tb-name{font-weight:700;font-size:1.02rem}
.tb-meta{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:center;font-size:.8rem}
.tb-prohibited{--w:58%;background:var(--t-pro-bg);border-color:var(--t-pro-bd)}
.tb-high{--w:72%;background:var(--t-high-bg);border-color:var(--t-high-bd)}
.tb-transparency{--w:86%;background:var(--t-tra-bg);border-color:var(--t-tra-bd)}
.tb-minimal{--w:100%;background:var(--t-min-bg);border-color:var(--t-min-bd)}
.pyr-hint{font-size:.8rem;color:var(--muted);margin:.2rem 0 0;text-align:center}
.gpai{border:4px double var(--line-strong);border-radius:12px;padding:.9rem;font-size:.88rem}
.gpai h3{font-size:1rem}
.gpai .pos{font-weight:600}
@media (max-width:900px){
  .regime,.lp{grid-template-columns:1fr}
  .literacy{border-right:2.5px solid var(--ink);border-radius:12px}
  .literacy::after{display:none}
  .tier-btn{--w:100%!important}
}
#tier-detail:empty{display:none}
.td{margin-top:1rem;border:2px solid var(--line-strong);border-radius:12px;padding:1rem 1.1rem;background:var(--surface)}
.td-prohibited{border-color:var(--t-pro-bd)}.td-high{border-color:var(--t-high-bd)}.td-transparency{border-color:var(--t-tra-bd)}.td-minimal{border-color:var(--t-min-bd)}
.td-head{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.panel-box{border:1px solid var(--line);border-radius:8px;padding:.75rem .9rem;background:var(--surface)}
.routes{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem;margin:.8rem 0}
@media (max-width:760px){.routes{grid-template-columns:1fr}}
.route{border:1.5px solid var(--line-strong);border-radius:10px;padding:.8rem .9rem}
.route2{border-width:2.5px;border-color:var(--t-high-bd)}
.carveout{border:2px solid var(--ink);border-radius:8px;padding:.6rem .75rem;margin:.6rem 0;background:var(--surface2)}
.carveout .carve-h{font-weight:700;margin:0 0 .3rem}
.req-row{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:.25rem 1rem;padding:.55rem 0;border-top:1px solid var(--line)}
@media (max-width:600px){.req-row{grid-template-columns:1fr}}
.req-row:first-of-type{border-top:0}

/* ---------- timeline ---------- */
.rail{list-style:none;display:flex;padding:0;margin:1rem 0 .5rem;position:relative}
.rail::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line-strong)}
.rail-i{flex:1 1 0;min-width:0;position:relative;margin:0}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:.25rem;width:100%;background:none;border:0;cursor:pointer;padding:.25rem .1rem;font-size:.76rem;text-align:center}
.dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:var(--surface);position:relative;z-index:1;margin-top:0}
.past .dot{background:var(--ink)}
.rail-date{font-weight:600;line-height:1.25}
.rail-glyphs{color:var(--muted);font-size:.72rem;line-height:1.2}
.rail-today{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:0 .3rem}
.today-line{width:0;height:32px;border-left:3px solid var(--ink)}
.today-lbl{font-size:.72rem;font-weight:700;background:var(--ink);color:var(--bg);padding:0 .45rem;border-radius:999px;white-space:nowrap}
@media (max-width:760px){.rail{display:none}}
.tl{list-style:none;padding:0;margin:.5rem 0 0}
.tl-i{display:grid;grid-template-columns:22px 110px 1fr;gap:.2rem .8rem;padding:.6rem 0;border-top:1px solid var(--line)}
.tl-i .dot{margin-top:.25rem}
.tl-date{font-weight:700}
.tl-today{display:grid;grid-template-columns:22px 1fr;gap:.8rem;align-items:center;padding:.4rem 0;border-top:3px solid var(--ink)}
@media (max-width:600px){.tl-i{grid-template-columns:22px 1fr}.tl-i .tl-body{grid-column:2}}
.tl-links{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.mini-btn{font-size:.78rem;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:.05rem .55rem;cursor:pointer}

/* ---------- roles / routes ---------- */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:760px){.roles{grid-template-columns:1fr}}
.role-card{border:1.5px solid var(--line-strong);border-radius:10px;padding:.85rem 1rem}
.role-card h3{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.shorthand{font-family:Georgia,serif;font-style:italic;font-weight:400;color:var(--muted)}
.routes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.8rem;margin:.6rem 0}
.route-card{border:1.5px solid var(--line-strong);border-radius:10px;padding:.8rem .9rem;font-size:.92rem}
.route-card.flagged{border:3px solid var(--ink)}
.route-id{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--ink);font-weight:700;margin-right:.3rem}
.ex{font-size:.9rem}

/* ---------- GDPR layer ---------- */
.toggle{display:inline-flex;align-items:center;gap:.5rem;border:1.5px solid var(--gdpr);border-radius:999px;padding:.25rem .75rem;background:var(--surface);cursor:pointer;font-size:.88rem;font-weight:600}
.toggle .sw{width:2rem;height:1.1rem;border-radius:999px;border:2px solid var(--gdpr);position:relative}
.toggle .sw::after{content:"";position:absolute;top:1px;left:1px;width:.75rem;height:.75rem;border-radius:50%;background:var(--gdpr);transition:left .15s}
.toggle[aria-pressed="true"] .sw::after{left:calc(100% - .8rem)}
.seam{border:2.5px solid var(--gdpr);background:var(--gdpr-bg);border-radius:12px;padding:1rem 1.1rem;margin:.8rem 0 1rem}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:860px){.tracks{grid-template-columns:1fr}}
.track{border-radius:10px;padding:.8rem .9rem;border:1.5px solid var(--line-strong)}
.track-gdpr{border-color:var(--gdpr)}
.track h3{display:flex;gap:.5rem;align-items:center}
.reg-tag{font-size:.7rem;font-weight:700;border:1.5px solid;border-radius:4px;padding:0 .35rem;text-transform:uppercase;letter-spacing:.05em}
.reg-ai{border-color:var(--line-strong)}
.reg-gdpr{border-color:var(--gdpr);color:var(--gdpr)}
.entry{border-top:1px solid var(--line);padding:.7rem 0}
.entry:first-of-type{border-top:0}
.entry h4{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
#gdpr-body[hidden]{display:none}

/* ---------- penalties ---------- */
.pen{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:860px){.pen{grid-template-columns:1fr}}
.pen-row{display:grid;grid-template-columns:110px 1fr;gap:.2rem .8rem;padding:.55rem 0;border-top:1px solid var(--line);font-size:.9rem}
.pen-row:first-of-type{border-top:0}
.pen-row.relief{border:2px solid var(--ink);border-radius:8px;padding:.5rem .6rem;margin:.4rem 0}
.pen-row .lbl{font-weight:700}
.cap{font-weight:700}

/* ---------- nuance / annex ---------- */
details.nuance{border:1.5px solid var(--line-strong);border-radius:10px;padding:.2rem .9rem;margin:.6rem 0;background:var(--surface)}
details.nuance>summary{cursor:pointer;padding:.55rem 0;font-weight:700;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
details>summary{cursor:pointer}
details[open].nuance>summary{border-bottom:1px solid var(--line);margin-bottom:.5rem}
.area{border:1.5px solid var(--line-strong);border-radius:10px;padding:.8rem .95rem;margin:.6rem 0}
.area h3{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.area-n{display:inline-grid;place-items:center;min-width:1.8rem;height:1.8rem;border-radius:6px;border:2px solid var(--ink);font-weight:700}
.area.recessed{border:1px solid var(--line);background:var(--surface2);color:var(--muted);padding:.45rem .8rem;font-size:.86rem}
.area.recessed h3{font-size:.92rem;font-weight:600;margin:0}
.area.recessed .area-n{border-width:1px;border-color:var(--line-strong);min-width:1.5rem;height:1.5rem}
.subpt{border-top:1px solid var(--line);padding:.6rem 0}
.subpt .ref{font-weight:700;font-size:.95rem}
.hotel{font-size:.9rem}
.hotel b{font-weight:700}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- glossary ---------- */
.gl-search{width:100%;max-width:28rem;padding:.5rem .7rem;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.gl-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.2rem 1.5rem;margin:.8rem 0 0}
.gl-item{padding:.5rem 0;border-top:1px solid var(--line)}
.gl-item dt{font-weight:700}
.gl-item dd{margin:0;font-size:.92rem}
.gl-term{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline dotted 1.5px;text-underline-offset:3px;cursor:help}
#gl-pop{position:fixed;z-index:60;max-width:min(380px,calc(100vw - 32px));background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:.7rem .85rem;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:.9rem}
#gl-pop[hidden]{display:none}
.pop-h{display:flex;justify-content:space-between;gap:1rem;align-items:start}
.x{background:none;border:1px solid var(--line-strong);border-radius:6px;cursor:pointer;line-height:1;padding:.15rem .45rem;font-size:1rem}

/* ---------- scenarios ---------- */
.timing{border:2.5px solid var(--ink);border-radius:12px;padding:.9rem 1.1rem;margin:0 0 1rem;background:var(--surface)}
.timing p{margin:.2rem 0}
.filters{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:end;margin:.5rem 0 1rem}
.filters label{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;gap:.2rem}
.filters select{font:inherit;font-size:.9rem;padding:.3rem .4rem;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);min-width:9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:1rem}
.card{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:1rem 1.05rem;font-size:.93rem;min-width:0}
.card[hidden]{display:none}
.card-head{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.4rem}
.sc-id{font-weight:800;font-size:1rem;margin-right:.2rem}
.card h3{font-size:1.05rem}
.kv{margin:.45rem 0}
.kv>b:first-child{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cls{font-weight:600}
.ax-inline{margin:.4rem 0;border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem}
.ax-inline summary{font-size:.86rem;font-weight:600}

/* ---------- wizard ---------- */
.wz{display:grid;grid-template-columns:1fr 300px;gap:1.25rem;align-items:start}
@media (max-width:900px){.wz{grid-template-columns:1fr}}
.wz-main{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.25rem;min-width:0}
.wz-side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;position:sticky;top:80px}
@media (max-width:900px){.wz-side{position:static}}
.qnum{font-size:.78rem;color:var(--muted);font-weight:600;margin:0}
.choices{display:flex;flex-direction:column;gap:.55rem;margin:.9rem 0}
.choice{border:1.5px solid var(--line-strong);border-radius:10px;padding:.15rem;background:var(--surface)}
.choice.sel{border:3px solid var(--ink);padding:0}
.choice-btn{display:flex;gap:.65rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:.6rem .75rem;cursor:pointer;font-size:.95rem;border-radius:8px}
.ck{font-size:1.1rem;line-height:1.3;flex:0 0 auto}
.choice-ann{padding:0 .75rem .5rem 2.4rem;font-size:.88rem}
.choice-ann:empty{display:none}
.term{display:inline-block;font-size:.75rem;font-weight:700;border:1px solid var(--line-strong);border-radius:4px;padding:0 .35rem;margin:.2rem 0}
.wz-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;padding:.45rem 1rem;border-radius:8px;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--surface);color:var(--ink)}
.path{list-style:none;padding:0;margin:.5rem 0 1rem;font-size:.86rem}
.path li{border-left:3px solid var(--line-strong);padding:.3rem 0 .45rem .6rem;margin:0}
.path li.cur{border-left-color:var(--ink);font-weight:600}
.path .ans{display:block;color:var(--muted);font-weight:400}
.path .ans::before{content:"→ "}
.deep{margin-top:1rem;border:1px dashed var(--line-strong);border-radius:10px;padding:.35rem .8rem}
.deep>summary{font-weight:600;padding:.3rem 0}
.out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem;margin:.8rem 0 1rem}
.out-cell{border:1.5px solid var(--line-strong);border-radius:10px;padding:.6rem .75rem;font-size:.9rem}
.out-cell>b:first-child{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.out-sec{border-top:1px solid var(--line);padding:.8rem 0 .3rem}
.out-sec>h3{font-size:1rem}
.holder{font-size:.75rem;font-weight:700;border:1px solid var(--line-strong);border-radius:4px;padding:0 .3rem;margin-right:.3rem;white-space:nowrap}
.mini-sc{border:1.5px solid var(--line-strong);border-radius:8px;padding:.5rem .7rem;margin:.4rem 0;font-size:.9rem}

/* ---------- drawer ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.backdrop[hidden],.drawer[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:45;overflow:auto;border-left:2px solid var(--ink);padding:1rem 16px 2rem}
.drawer-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;position:sticky;top:-1rem;background:var(--bg);padding:.6rem 0;border-bottom:1px solid var(--line);margin:-1rem 0 .8rem}
.oi{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;padding:.8rem .9rem;margin:.6rem 0}
.corr-item{background:var(--surface);border:1.5px solid var(--amend);border-radius:10px;padding:.7rem .9rem;margin:.55rem 0;font-size:.9rem}
.pt-row{display:grid;grid-template-columns:3rem 1fr;gap:.2rem .7rem;padding:.5rem 0;border-top:1px solid var(--line);font-size:.86rem}
.pt-row[hidden]{display:none}
/* ---------- research-update layers ---------- */
.answer{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.25rem,2.2vw,1.6rem);font-weight:700;margin:.2rem 0 .5rem}
.caveat{border:2px solid var(--ink);background:var(--surface2);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0 1rem}
.hot-summary{border:3px solid var(--ink);border-radius:10px;padding:.6rem .9rem;margin:.6rem 0 1rem}
.findings{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:.8rem;margin:.5rem 0 1rem}
.finding{border:1.5px solid var(--line-strong);border-radius:10px;padding:.8rem .9rem;font-size:.92rem;min-width:0}
.finding.hot{border:3.5px solid var(--ink)!important;background:var(--surface2)}
.hot-rel{border-left:5px solid var(--ink);padding:.3rem .6rem;background:var(--surface)}
.dcg-chip{font-size:.78rem;text-align:left;border:2px dotted var(--line-strong);background:var(--surface);border-radius:6px;padding:.1rem .5rem;cursor:pointer;max-width:100%}
.dcg-chip.dcg-hot{border:2.5px solid var(--ink);font-weight:600}
.posture{border:1.5px solid var(--line-strong);border-radius:12px;padding:.9rem 1rem;margin:.8rem 0}
.posture-line{font-size:1.02rem;border-left:4px solid var(--ink);padding-left:.7rem}
.adopt,.nobank{border-radius:10px;padding:.6rem .8rem}
.adopt{border:3px solid var(--ink)}
.nobank{border:2px dashed var(--line-strong);background:var(--surface2)}
.adopt ul,.nobank ul{list-style:none;padding-left:0}
.adopt li::before{content:"✓ ";font-weight:700}
.nobank li::before{content:"✗ ";font-weight:700}
.nobank li{font-style:italic}
.rules{display:flex;flex-direction:column;gap:.5rem;margin:.7rem 0}
.rule{display:grid;grid-template-columns:1fr 1.6fr;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden;font-size:.9rem}
@media (max-width:700px){.rule{grid-template-columns:1fr}}
.rule .if{padding:.5rem .7rem;background:var(--surface2);border-right:1.5px solid var(--line-strong)}
.rule .then{padding:.5rem .7rem}
.rule b{font-size:.75rem;letter-spacing:.08em;margin-right:.3rem}
.resolved{background:var(--surface);border:2px solid var(--new);border-radius:10px;padding:.8rem .9rem;margin:.6rem 0}
.resolved-tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--new);background:var(--new-bg);border:1.5px solid var(--new);border-radius:4px;padding:0 .4rem}
.outcome-tag{display:inline-block;font-size:.78rem;font-weight:700;border:2px solid var(--ink);border-radius:4px;padding:0 .4rem}
.checked-tag{display:inline-block;font-size:.72rem;font-weight:700;border:1.5px solid var(--new);color:var(--new);border-radius:4px;padding:0 .35rem}
.secA{display:grid;grid-template-columns:minmax(180px,1fr) 1.4fr;gap:.2rem 1rem;padding:.45rem 0;border-top:1px solid var(--line);font-size:.9rem}
@media (max-width:600px){.secA{grid-template-columns:1fr}}
/* ---------- overview story ---------- */
.story{max-width:960px;margin:0 auto}
.ov-hero{padding:1.5rem 0 1rem}
.ov-hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;letter-spacing:-.01em;margin:0 0 .4rem}
.ov-lede{font-size:clamp(1.05rem,2vw,1.25rem);color:var(--muted);margin:0 0 1rem;max-width:44rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem}
.fact{border:1.5px solid var(--line-strong);border-radius:10px;padding:.6rem .8rem;background:var(--surface)}
.fact b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.step{border-top:1px solid var(--line);padding:2.2rem 0 1rem}
.step-h{display:flex;gap:.9rem;align-items:baseline;margin-bottom:.4rem}
.step-n{font-family:Georgia,serif;font-size:2rem;font-weight:700;color:var(--muted);line-height:1}
.step h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.3rem,2.6vw,1.7rem);margin:0}
.step-sub{color:var(--muted);margin:.1rem 0 1.1rem;max-width:46rem}
.ov-pyr{display:flex;flex-direction:column;align-items:center;gap:.45rem}
.ov-tier{width:var(--w);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:.3rem 1rem;align-items:center;text-align:left;border:2px solid;border-radius:10px;padding:.7rem .95rem;cursor:pointer;font-size:.92rem}
.ov-tier:hover{filter:brightness(.97)}
.ov-tier .nm{font-weight:700;font-size:1.02rem}
.ov-tier .ex{font-size:.85rem}
.ov-tier .dt{font-size:.8rem;white-space:nowrap;text-align:right}
@media (max-width:760px){.ov-tier{--w:100%!important;grid-template-columns:1fr}.ov-tier .dt{text-align:left}}
.ov-aside{display:flex;gap:.7rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:.8rem;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:.8rem}
.tiles3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.tile{display:flex;flex-direction:column;gap:.35rem;text-align:left;border:1.5px solid var(--line-strong);border-radius:12px;padding:.9rem 1rem;background:var(--surface);cursor:pointer;font-size:.92rem;line-height:1.5}
.tile:hover{border-color:var(--ink)}
.tile .ti-h{font-weight:700;font-size:1rem;display:flex;gap:.5rem;align-items:center}
.tile .ic{font-size:1.3rem;line-height:1}
.tile .more{margin-top:auto;font-size:.8rem;color:var(--link);font-weight:600}
.tile.warn{border-width:2.5px;border-color:var(--ink)}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:stretch}
@media (max-width:700px){.duo{grid-template-columns:1fr}.duo .arrow{transform:rotate(90deg)}}
.duo .arrow{align-self:center;font-size:1.6rem;color:var(--muted);text-align:center}
.role-big{border:2px solid var(--line-strong);border-radius:14px;padding:1rem 1.1rem;background:var(--surface)}
.role-big .who{font-family:Georgia,serif;font-size:1.5rem;font-weight:700}
.trap{margin-top:1rem;border:2.5px solid var(--ink);border-radius:12px;padding:.8rem 1rem;display:flex;gap:.8rem;align-items:flex-start;background:var(--surface)}
.fines{display:flex;flex-direction:column;gap:.6rem}
.fine{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:.2rem 1rem;align-items:center;font-size:.92rem}
@media (max-width:640px){.fine{grid-template-columns:1fr}}
.bar{height:2rem;border-radius:6px;background:var(--ink);color:var(--bg);display:flex;align-items:center;padding:0 .6rem;font-weight:700;font-size:.85rem;white-space:nowrap;min-width:max-content}
.bar.light{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line-strong)}
.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:.6rem}
.cty{border:1.5px solid var(--line-strong);border-radius:10px;padding:.6rem .75rem;font-size:.86rem;text-align:left;background:var(--surface);cursor:pointer}
.cty.non{border-style:dashed;background:var(--surface2)}
.cty b{display:block;font-size:.95rem}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.6rem}
.links a{display:block;border:1.5px solid var(--line-strong);border-radius:10px;padding:.7rem .9rem;text-decoration:none;color:var(--ink);background:var(--surface)}
.links a b{display:block;color:var(--link)}
.links a span{font-size:.85rem;color:var(--muted)}
.callout{font-family:Georgia,serif;font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.45;border-left:5px solid var(--ink);padding:.2rem 0 .2rem 1rem;margin:0 0 1.2rem;max-width:48rem}
.deeper{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}
.rail.ov-rail{display:flex}
@media (max-width:760px){
  .rail.ov-rail{flex-direction:column;gap:.35rem}
  .ov-rail::before{display:none}
  .ov-rail .rail-btn{flex-direction:row;align-items:center;text-align:left;gap:.7rem}
  .ov-rail .rail-date{min-width:5.5rem}
  .ov-rail .rail-today{flex-direction:row;gap:.5rem;padding:.2rem 0}
  .ov-rail .today-line{height:0;width:22px;border-left:0;border-top:3px solid var(--ink)}
}
@media (max-width:720px){header.top{position:static}[id]{scroll-margin-top:12px}}
.drawer .routes,.drawer .two,.drawer .tracks,.drawer .pen,.drawer .roles{grid-template-columns:1fr}
/* ---------- topics ---------- */
.topics{display:grid;grid-template-columns:210px minmax(0,1fr);gap:1.25rem;align-items:start}
.tnav{position:sticky;top:80px;display:flex;flex-direction:column;gap:.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem}
.tnav button{text-align:left;background:none;border:0;padding:.4rem .6rem;border-radius:6px;cursor:pointer;font-size:.9rem}
.tnav button[aria-current="true"]{background:var(--ink);color:var(--bg);font-weight:600}
@media (max-width:860px){.topics{grid-template-columns:1fr}.tnav{position:static;flex-direction:row;flex-wrap:wrap}}
.topic[hidden]{display:none}
/* ---------- quiet signals ---------- */
details.srcs,details.sig{font-size:.8rem;margin:.35rem .4rem .35rem 0}
details.sig{display:inline-block;vertical-align:top}
details.srcs>summary,details.sig>summary{color:var(--muted);cursor:pointer}
details.srcs[open],details.sig[open]{display:block}
.src-list{color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{background:none;border:0;padding:0;color:var(--link);font-size:.82rem;font-weight:600;cursor:pointer;margin:-.4rem 0 .6rem}
details.more{margin-top:.6rem;border-top:1px solid var(--line);padding-top:.4rem}
details.more>summary{font-size:.85rem;font-weight:600;color:var(--link)}
.err{background:var(--t-pro-bg);border:2px solid var(--t-pro-bd);padding:1rem;margin:1rem;border-radius:8px}
</style>
</head>

  "enforcementStructure": {
    "question": "Do the new AI Office powers in Arts. 75a-75d reach hotels?",
    "answer": "No, not directly. Art. 75(1) as replaced by the Omnibus gives the AI Office EXCLUSIVE competence over (a) AI systems based on general-purpose AI models where the model and the system are developed by the same provider, or by providers in the same undertaking, and (b) AI systems constituting or integrated into a VLOP or VLOSE under Regulation (EU) 2022/2065. That exclusive competence applies to the PROVIDERS of those systems, and to deployers only where the deployer is also the provider or part of the same undertaking as the provider.",
    "whyHotelsAreOutside": "A hotel deploying a vendor's AI is neither the provider nor part of the provider's undertaking. Even a chain that builds its own assistant on a third-party LLM API (scenario P1) is provider of the SYSTEM while the LLM company remains provider of the MODEL - different providers, different undertakings - so Art. 75(1)(a) is not met. Hotels remain supervised by national market surveillance authorities.",
    "sectoralExclusions": "Art. 75(1)(a) itself carves out: AI related to Annex I products; Annex III point 2 (critical infrastructure); systems provided by law enforcement, border management and financial institutions under Art. 74(6); and Annex III point 8 as regards administration of justice.",
    "twoIndirectChannels": [
      {
        "channel": "As the regime facing your vendors",
        "detail": "The AI Office's new powers - investigations, remote and on-site inspections, document and data access, sealing of premises, orders to provide access and explanations, retention obligations, appointment of external auditors, and full cost recovery from non-compliant operators - apply to the GPAI-based system providers hotels buy from. Art. 75b lets the AI Office make an operator's commitments binding; Art. 75c allows non-compliance decisions, fines under Art. 99(3)-(7) applied mutatis mutandis, and periodic penalty payments. A vendor under AI Office proceedings is a continuity risk to its hotel customers."
      },
      {
        "channel": "Referral by a national authority",
        "detail": "New Art. 75(2a) lets a market surveillance authority with well-founded and sufficient reasons to suspect an infringement ask the AI Office, through the Art. 70(2) single point of contact, to assess the matter. The AI Office must respond within four months stating whether it will exercise its Art. 75a powers. This is the route by which a hotel matter could reach the AI Office indirectly."
      }
    ],

<script>
(function(){
'use strict';

/* =========================== data loader =========================== */
let DATA;
try { DATA = JSON.parse(document.getElementById('ai-act-data').textContent); }
catch (err) {
  const e = document.getElementById('app-error'); e.hidden = false;
  e.textContent = 'Could not parse the embedded data block (ai-act-data): ' + err.message;
  return;
}

/* =========================== helpers =========================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){ if(!iso) return ''; const p = iso.split('-').map(Number); return p[2] + ' ' + MONTHS[p[1]-1] + ' ' + p[0]; }
function isoToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
const NO_SPLIT = /\b(Art|Arts|e\.g|i\.e|v|pts|pt|No|para|Reg)$/;
function firstSentence(s){
  s = String(s || ''); const re = /\.\s+(?=[A-Z0-9(])/g; let m;
  while ((m = re.exec(s))) { if (!NO_SPLIT.test(s.slice(0, m.index))) return s.slice(0, m.index + 1); }
  return s;
}
const uniq = a => Array.from(new Set(a));

const M = DATA.meta;
const ART = DATA.articles.byNumber;
const OA = DATA.omnibusAmended;
const AX = DATA.annexIIIReference;
const TIERS = {}; DATA.tiers.forEach(t => TIERS[t.id] = t);
const SEVERITY = ['minimal','transparency','high','prohibited'];
const TIER_GLYPH = {prohibited:'⊘', high:'▲', transparency:'◐', minimal:'○', 'out-of-scope':'–'};
const SUPERSEDED = new Set(OA.supersededActArticles.map(String));
const NEWARTS = new Set(OA.newArticles.map(String));
const SUBPOINTS = {};
AX.areas.forEach(a => (a.subPoints || []).forEach(sp => SUBPOINTS[sp.ref] = Object.assign({ area: a }, sp)));

/* Omnibus amendment points indexed by the article (or annex) they target */
const POINTS_BY = {};
OA.points.forEach(p => {
  const add = k => { (POINTS_BY[k] = POINTS_BY[k] || []); if (POINTS_BY[k].indexOf(p) < 0) POINTS_BY[k].push(p); };
  if (/^Annex/.test(p.targets)) { add(p.targets.trim()); return; }
  p.targets.replace(/^Arts?\.\s*/, '').split(/,\s*/).forEach(t => { const m = t.match(/^\d+[a-z]?/); if (m) add(m[0]); });
});
const POINT = {}; OA.points.forEach(p => POINT[p.point] = p);

/* =====================================================================
   LINK TARGETS — every citation URL in this tool is computed here and
   nowhere else. To swap the local PDFs for hosted URLs later, change the
   pattern on ONE line below (or the patterns in the data block).
   ===================================================================== */
const ACT_PATTERN = M.links.localActPageLinkPattern;          // June 2024 Official Journal text
const OMNIBUS_PATTERN = OA.localPdfPageLinkPattern;           // Regulation (EU) 2026/1744
const EXPLORER_HREF = M.links.commissionExplorer;              // secondary "consolidated text" link
function fillPattern(pattern, page){
  const i = pattern.indexOf('#');
  const file = i < 0 ? pattern : pattern.slice(0, i);
  const frag = i < 0 ? '' : pattern.slice(i);
  return encodeURI(file) + frag.replace('{page}', encodeURIComponent(page));   // spaces in filenames -> %20
}
const actHref = p => fillPattern(ACT_PATTERN, p);
const omniHref = p => fillPattern(OMNIBUS_PATTERN, p);
const ext = (href, html, cls, title) => '<a' + (cls ? ' class="' + cls + '"' : '') + ' href="' + esc(href) + '" target="_blank" rel="noopener"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + html + '</a>';

/* =========================== confidence badge =========================== */
const CONF_ORDER = Object.keys(M.confidenceLegend);   // settled -> contested, most to least certain
const CONF_META = {
  'settled':        { icon: '●', label: 'Settled' },
  'scheduled':      { icon: '◷', label: 'Scheduled' },
  'judgement':      { icon: '◇', label: 'Judgement' },
  'draft-guidance': { icon: '✎', label: 'Draft guidance' },
  'contested':      { icon: '⇄', label: 'Contested' }
};
function badge(level){
  if (!level) return '';
  const m = CONF_META[level] || { icon: '?', label: level };
  return '<span class="conf conf-' + esc(level) + '" title="' + esc(M.confidenceLegend[level] || '') + '"><span class="conf-i" aria-hidden="true">' + m.icon + '</span><span class="sr">Confidence: </span>' + esc(m.label) + '</span>';
}
function lowestConf(list){
  let worst = null;
  list.forEach(c => { if (c.level && (worst === null || CONF_ORDER.indexOf(c.level) > CONF_ORDER.indexOf(worst))) worst = c.level; });
  return worst;
}
function tierTag(id){
  const t = TIERS[id]; const name = t ? t.shortName : (id === 'out-of-scope' ? 'Out of scope' : id);
  return '<span class="tier-tag tt-' + esc(id) + '"><span aria-hidden="true">' + (TIER_GLYPH[id] || '') + '</span> ' + esc(name) + '</span>';
}
function roleTag(role){ const r = DATA.roles[role]; return r ? '<span class="role-tag">' + esc(r.name) + ' · ' + esc(r.hotelShorthand.toLowerCase()) + '</span>' : ''; }

/* =========================== article-reference component ===========================
   Rule 1: article not superseded  -> June 2024 PDF page, no note.
   Rule 2: article superseded      -> June 2024 PDF page + visible amendment note (change text) + Omnibus page link.
   Rule 3: new article             -> Omnibus PDF page only; never the June 2024 PDF.
   GDPR / EDPB / Service Desk refs -> plain text. Annex III point refs -> in-page jump to verbatim text. */
function parseRef(ref){
  const s = String(ref).trim();
  if (/^(GDPR|EDPB|AI Act Service Desk)/.test(s)) return { kind: 'text', label: s };
  let m = s.match(/^Annex III(?:,\s*(\d)(?:\(([a-z])\))?)?$/);
  if (m) return m[1] ? { kind: 'annexIIIpoint', label: s, point: +m[1], sub: m[2] ? m[1] + '(' + m[2] + ')' : null } : { kind: 'annexIII', label: s };
  if (/^Annex [IVXL]+$/.test(s)) return { kind: 'annex', label: s, name: s };
  m = s.match(/^Arts?\.\s*(\d+[a-z]?)(?:\s*-\s*(\d+))?/);
  if (m) return m[2] ? { kind: 'range', label: s, from: +m[1], to: +m[2] } : { kind: 'article', label: s, num: m[1] };
  return { kind: 'text', label: s };
}
/* Amendment flags are buttons; the change text opens in a popover (like glossary definitions). */
const amendBtn = key => '<button type="button" class="amend-tag amend-btn" data-amend="' + esc(key) + '" aria-haspopup="dialog" title="Superseded in part by the Digital Omnibus — show what changed">Δ amended</button>';
const newBtn = key => '<button type="button" class="new-tag amend-btn" data-amend="' + esc(key) + '" aria-haspopup="dialog" title="New article — show what it says">+ new · Omnibus only</button>';
function omniLinks(pts){ return uniq(pts.map(p => p.omnibusPage)).map(pg => ext(omniHref(pg), 'Omnibus p.' + pg, 'omni-link', 'Regulation (EU) 2026/1744, page ' + pg)).join(''); }
function citeChip(ref){
  const r = parseRef(ref); const L = esc(r.label);
  if (r.kind === 'text') return { html: '<span class="chip"><span class="cite cite-text" title="No local PDF for this reference">' + L + '</span></span>' };
  if (r.kind === 'annexIII') return { html: '<span class="chip">' + ext(actHref(AX.annexIIIPdfPage), L, 'cite', 'Annex III — June 2024 text, p. ' + AX.annexIIIPdfPage + ' (not amended by the Omnibus)') + '<span class="cite-pg">p.' + AX.annexIIIPdfPage + '</span></span>' };
  if (r.kind === 'annexIIIpoint') {
    const anchor = r.sub ? 'ax-' + r.sub.replace(/[()]/g, '') : 'ax-area-' + r.point;
    return { html: '<span class="chip"><button type="button" class="cite-int" data-go="map#' + anchor + '" title="Jump to the verbatim text in the Annex III reference layer">' + L + '</button></span>' };
  }
  if (r.kind === 'annex') {
    const pts = POINTS_BY[r.name] || [];
    if (!pts.length) return { html: '<span class="chip"><span class="cite cite-text">' + L + '</span></span>' };
    return { html: '<span class="chip chip-amended"><span class="cite cite-text">' + L + '</span>' + amendBtn(r.name) + omniLinks(pts) + '<span class="todo" title="The data file gives no June 2024 page for this annex">TODO: June 2024 page not in data</span></span>',
             notes: pts.map(p => ({ p: p, art: r.name })) };
  }
  if (r.kind === 'range') {
    const a = ART[String(r.from)];
    if (!a) return { html: '<span class="chip"><span class="cite">' + L + '</span><span class="todo">TODO: page not in data</span></span>' };
    const amended = []; for (let n = r.from; n <= r.to; n++) if (SUPERSEDED.has(String(n))) amended.push(n);
    const html = '<span class="chip' + (amended.length ? ' chip-amended' : '') + '">' + ext(actHref(a.page), L, 'cite', 'Opens at Art. ' + r.from + ' — June 2024 text, p. ' + a.page) + '<span class="cite-pg">p.' + a.page + '</span>' + (amended.length ? amendBtn('range:' + r.from + '-' + r.to) : '') + '</span>';
    const extra = amended.length ? '<li class="amend-note"><span class="amend-tag">Δ amended</span> <b>' + L + '</b> includes Omnibus-amended articles, whose June 2024 text is superseded in part: ' +
      amended.map(n => 'Art. ' + n + ' (' + (POINTS_BY[String(n)] || []).map(p => ext(omniHref(p.omnibusPage), 'pt ' + p.point + ', p.' + p.omnibusPage)).join(', ') + ')').join('; ') + '.</li>' : '';
    return { html: html, extra: extra };
  }
  // single article
  if (NEWARTS.has(r.num)) {
    const pts = POINTS_BY[r.num] || []; const pg = pts.length ? pts[0].omnibusPage : null;
    return { html: '<span class="chip chip-new">' + (pg ? ext(omniHref(pg), L, 'cite', 'New article — exists only in Regulation (EU) 2026/1744, page ' + pg) + '<span class="cite-pg">Omnibus p.' + pg + '</span>' : '<span class="cite">' + L + '</span><span class="todo">TODO: Omnibus page not in data</span>') + newBtn(r.num) + '</span>',
             notes: pts.map(p => ({ p: p, art: 'Art. ' + r.num, isNew: true })) };
  }
  const a = ART[r.num];
  if (!a) return { html: '<span class="chip"><span class="cite">' + L + '</span><span class="todo">TODO: article not in page map</span></span>' };
  const title = 'Art. ' + r.num + ' — ' + a.title + ' (June 2024 text, p. ' + a.page + ')';
  if (SUPERSEDED.has(r.num)) {
    const pts = POINTS_BY[r.num] || [];
    return { html: '<span class="chip chip-amended">' + ext(actHref(a.page), L, 'cite', title) + '<span class="cite-pg">p.' + a.page + '</span>' + amendBtn(r.num) + (pts.length ? omniLinks(pts) : '<span class="todo">TODO: amendment point not in data</span>') + '</span>',
             notes: pts.map(p => ({ p: p, art: 'Art. ' + r.num })) };
  }
  return { html: '<span class="chip">' + ext(actHref(a.page), L, 'cite', title) + '<span class="cite-pg">p.' + a.page + '</span></span>' };
}
function noteHtml(n){

/* =========================== glossary-term linker =========================== */
function glAliases(term){
  const out = [];
  term.split(/\s*\/\s*/).forEach(p => { const m = p.match(/^(.*?)\s*\(([^)]+)\)\s*(.*)$/); if (m) { out.push((m[1] + ' ' + m[3]).trim()); out.push(m[2]); } else out.push(p.trim()); });
  return out.filter(Boolean);
}
const isAcr = s => /^[A-Z]{2,}s?$/.test(s);
const GL_ALTS = [];
DATA.glossary.forEach((g, i) => glAliases(g.term).forEach(a => {
  const pat = isAcr(a) ? escRe(a.replace(/s$/, '')) + 's?' : a.split(/[\s-]+/).map(escRe).join('[\\s-]?') + 's?';
  GL_ALTS.push({ i: i, a: a, acr: isAcr(a), pat: pat, re: new RegExp('^(?:' + pat + ')$', 'i') });
}));
GL_ALTS.sort((x, y) => y.a.length - x.a.length);
const GL_RE = new RegExp('\\b(?:' + GL_ALTS.map(x => x.pat).join('|') + ')\\b', 'gi');
function glMatch(text){ for (const x of GL_ALTS) { if (x.re.test(text)) { if (x.acr && !/^[A-Z]{2,}s?$/.test(text)) return null; return x; } } return null; }
const GL_SKIP = /^(A|BUTTON|H1|H2|H3|H4|SUMMARY|CODE|BLOCKQUOTE|LABEL|SELECT|OPTION|INPUT|DT|SCRIPT|STYLE)$/;
const GL_BLOCK = 'p,li,dd,td,div';
function linkGlossary(root){
  const used = new WeakMap();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n){
    if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    for (let p = n.parentElement; p && p !== root.parentElement; p = p.parentElement) {
      if (GL_SKIP.test(p.tagName) || p.classList.contains('no-gl') || p.classList.contains('chip') || p.classList.contains('cites')) return NodeFilter.FILTER_REJECT;
    }
    return NodeFilter.FILTER_ACCEPT; } });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const block = node.parentElement.closest(GL_BLOCK) || root;
    let set = used.get(block); if (!set) { set = new Set(); used.set(block, set); }
    const text = node.nodeValue; GL_RE.lastIndex = 0; let m, last = 0, changed = false; const frag = document.createDocumentFragment();
    while ((m = GL_RE.exec(text))) {
      const hit = glMatch(m[0]); if (!hit || set.has(hit.i)) continue;
      set.add(hit.i); changed = true;
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const b = document.createElement('button'); b.type = 'button'; b.className = 'gl-term'; b.dataset.gl = hit.i;
      b.setAttribute('aria-haspopup', 'dialog'); b.title = 'Glossary: ' + DATA.glossary[hit.i].term; b.textContent = m[0];
      frag.appendChild(b); last = m.index + m[0].length;
    }
    if (changed) { frag.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag, node); }
  });
}

function refKeys(ref){
  const r = parseRef(ref);
  if (r.kind === 'article') return ['A' + r.num];
  if (r.kind === 'range') { const o = []; for (let n = r.from; n <= r.to; n++) o.push('A' + n); return o; }
  if (r.kind === 'annexIII' || r.kind === 'annexIIIpoint') return ['Annex III'];
  if (r.kind === 'annex') return [r.name];
  return [];
}
function targetsFor(refs){
  const keys = new Set([].concat.apply([], refs.map(refKeys))); const out = [];
  const hits = arts => [].concat.apply([], arts.map(refKeys)).some(k => keys.has(k));
  DATA.tiers.forEach(t => { if (hits(t.articles)) out.push('<button type="button" class="mini-btn" data-tier="' + t.id + '">' + TIER_GLYPH[t.id] + ' ' + esc(t.shortName) + ' tier</button>'); });
  if (keys.has('Annex I')) out.push('<button type="button" class="mini-btn" data-go="map#route1">▲ High risk · Route 1 (Annex I)</button>');
  if (hits(DATA.crossCuttingDuty.articles)) out.push('<button type="button" class="mini-btn" data-go="map#sec-literacy">' + esc(DATA.crossCuttingDuty.name) + ' (all tiers)</button>');
  if (hits(DATA.gpai.articles)) out.push('<button type="button" class="mini-btn" data-go="map#sec-gpai">GPAI track</button>');
  return out;
}

const WZ = DATA.wizard;
const Q = {}; WZ.questions.forEach(q => Q[q.id] = q);
const QIDX = id => WZ.questions.findIndex(q => q.id === id);
const wiz = { answers: {}, draft: {}, focus: WZ.questions[0].id };
function walk(){
  const steps = []; let qid = WZ.questions[0].id; const seen = new Set();
  while (qid && Q[qid] && !seen.has(qid)) {
    seen.add(qid); const q = Q[qid]; const ans = wiz.answers[qid];
    if (!ans || !ans.length) return { steps: steps, pending: qid };
    const chosen = ans.map(id => q.choices.find(c => c.id === id)).filter(Boolean);
    steps.push({ q: q, chosen: chosen });
    const term = chosen.find(c => c.outcome);
    if (term) return { steps: steps, outcome: term.outcome };
    let next = null;
    if (q.type === 'single') next = chosen[0].next || q.next || null;
    else {
      const nexts = chosen.map(c => c.next).filter(Boolean);
      next = nexts.length ? nexts.sort((a, b) => QIDX(a) - QIDX(b))[0] : (q.next || null);   // earliest question first so no branch is skipped
    }
    if (!next && q.outcome) return { steps: steps, outcome: q.outcome };
    if (!next) return { steps: steps, outcome: null };
    qid = next;
  }
  return { steps: steps, pending: qid };
}
function collect(steps){
  const st = { role: null, routes: [], annexIII: [], annexI: false, appliesFrom: [], art50: [], gdpr: [], gdprArt9: false, filterApplied: false, flagForReview: false, flags: [], notes: [], conf: [], noPersonal: false };
  const add = (arr, v) => { if (arr.indexOf(v) < 0) arr.push(v); };
  steps.forEach(s => {
    if (s.q.confidence) st.conf.push({ level: s.q.confidence, src: 'Question: ' + s.q.prompt });
    s.chosen.forEach(c => {
      if (c.confidence) st.conf.push({ level: c.confidence, src: 'Answer: ' + c.label });
      const x = c.sets || {};
      if (x.role) st.role = x.role;                 // later answers override (q3 "none" is exclusive)
      if (x.route) add(st.routes, x.route);
      if (x.annexIII) add(st.annexIII, x.annexIII);
      if (x.annexI) st.annexI = true;
      if (x.appliesFrom) add(st.appliesFrom, x.appliesFrom);
      (x.art50 || []).forEach(a => add(st.art50, a));
      (x.gdpr || []).forEach(a => add(st.gdpr, a));
      if (x.gdprArt9) st.gdprArt9 = true;
      if (x.filterApplied) st.filterApplied = true;
      if (x.flagForReview) st.flagForReview = true;
      if (c.flag) st.flags.push({ text: c.flag, src: c.label });
      if (c.note) st.notes.push({ text: c.note, src: c.label, q: s.q.id });
      if (s.q.id === 'q8-gdpr' && c.exclusive) st.noPersonal = true;
    });
  });
  return st;
}
/* Tier flags. outcomes.assemble.instruction: highest severity wins (prohibited > high > transparency > minimal).
   A choice whose `next` is a classification question (q5 -> q6) has its tier REFINED by that question's answer —
   otherwise the Art. 6(3) filter answer could never lower a high flag. Art. 50 duties add a transparency flag,
   so they stack on whatever the use case resolved to. */
function tierFlags(steps, st){
  const flags = []; const refiners = new Set();
  steps.forEach(s => s.chosen.forEach(c => {
    const t = c.sets && c.sets.tier; if (!t) return;
    const ref = c.next ? steps.find(x => x.q.id === c.next && x.chosen.some(cc => cc.sets && cc.sets.tier)) : null;
    if (ref) refiners.add(ref.q.id);
  }));
  steps.forEach(s => {
    if (refiners.has(s.q.id)) return;
    s.chosen.forEach(c => {
      const t = c.sets && c.sets.tier; if (!t) return;
      const ref = c.next ? steps.find(x => x.q.id === c.next && x.chosen.some(cc => cc.sets && cc.sets.tier)) : null;
      if (ref) { const rc = ref.chosen.find(cc => cc.sets && cc.sets.tier); flags.push({ tier: rc.sets.tier, choice: c, refinedBy: rc, refQ: ref.q }); }
      else flags.push({ tier: t, choice: c });
    });
  });
  if (st.art50.length) flags.push({ tier: 'transparency', art50: true });
  return flags;
}

function openItemsPanel(focus){
  const R = DATA.resolvedItems;
  const actions = (DATA.interimPostures && DATA.interimPostures.remainingActionItems) || [];
  openDrawer(drawerHead('◌ Open items (' + DATA.openItems.length + ')' + (R ? ' · ✓ ' + R.items.length + ' resolved' : '')) +
    '<p class="small">Unresolved questions in the research. Each is also shown on the sections, scenarios and wizard outcomes it affects.' + (R ? ' Resolved items are listed below the open ones.' : '') + '</p>' +
    DATA.openItems.map(o => {
      const p = o.omnibusPoint ? POINT[o.omnibusPoint] : null;
      const act = actions.find(a => a.id === o.id);
      const post = o.interimPosture ? pathTarget(o.interimPosture) : null;
      return '<article class="oi co-' + esc(o.confidence) + '" id="oi-' + o.id + '" tabindex="-1"><h3>' + o.id.toUpperCase() + ' ' + badge(o.confidence) + '</h3><p>' + esc(o.item) + '</p>' +
        (post ? '<p><button type="button" class="mini-btn" data-go="' + post + '">Interim position and decision rules →</button></p>' : '') +
        (act ? '<p class="small"><b>Next step.</b> ' + esc(act.nextStep) + '</p>' : '') +
        '<div class="tl-links"><span class="small muted">Affects:</span> ' + o.affects.map(a => { const t = affectTarget(a); return t ? '<button type="button" class="mini-btn" data-go="' + t + '">' + esc(affectLabel(a)) + '</button>' : '<span class="mini-btn">' + esc(a) + '</span>'; }).join('') + '</div>' +
        (p ? '<p class="small"><b>Omnibus point ' + p.point + '</b> (' + esc(p.targets) + '): ' + esc(p.change) + ' ' + ext(omniHref(p.omnibusPage), 'Omnibus p.' + p.omnibusPage + ' ↗', 'omni-link') + '</p>' : (o.omnibusPoint ? '<p class="todo">TODO: Omnibus point ' + o.omnibusPoint + ' not in data</p>' : '')) + '</article>';
    }).join('') +
    (R ? '<h3 style="margin-top:1.4rem">✓ Resolved items (' + R.items.length + ') — ' + fmtDate(R.resolvedOn) + '</h3><p class="small">' + esc(R.method) + '</p>' +
      R.items.map(r => {
        const now = pathTarget(r.nowIn); const ref = r.refinedBy ? pathTarget(r.refinedBy) : null;
        return '<article class="resolved" id="oi-' + r.id + '" tabindex="-1"><h3><span class="resolved-tag">✓ Resolved</span> ' + esc(r.id.toUpperCase()) + (r.outcome ? ' <span class="outcome-tag">' + esc(r.outcome) + '</span>' : '') + '</h3>' +
          '<p class="small"><b>Was.</b> ' + esc(r.was) + '</p><p><b>Resolution.</b> ' + esc(r.resolution) + '</p>' +
          '<div class="tl-links">' + (now ? '<button type="button" class="mini-btn" data-go="' + now + '">Now in: ' + esc(r.nowIn) + '</button>' : '<span class="small">Now in: ' + esc(r.nowIn) + '</span>') +
          (ref ? '<button type="button" class="mini-btn" data-go="' + ref + '">Refined by: ' + esc(r.refinedBy.split(' ').pop()) + '</button>' : '') + '</div></article>';
      }).join('') : ''),
    focus ? 'oi-' + focus : null);
}
function corrTarget(loc){
  if (loc.indexOf('tiers[high]') === 0) return ['map#route1'];
  if (loc.indexOf('annexIIIReference.annexI') === 0) return ['map#ax-annexI'];
  if (loc.indexOf('wizard.') === 0) return ['wizard#'];
  if (loc === 'gdprLayer') return ['map#gdpr-art4a'];
  if (loc === 'highRiskProviderRequirements') return ['map#sec-hrreq'];
  if (loc.indexOf('obligationsByRoleAndTier') === 0) return ['map#tier-detail'];
  if (loc === 'switchConsequences') return ['map#sec-switch'];
  if (loc === 'boundaries') return ['map#sec-boundaries'];
  if (loc.indexOf('openItems') === 0) return ['panel:open'];
  if (/draftClassificationGuidelines/.test(loc)) return ['map#sec-dcg'];
  if (/interimPostures/.test(loc)) return ['map#sec-postures'];
  if (/enforcementStructure/.test(loc)) return ['map#sec-enforcement'];
  if (/nationalLayer/.test(loc)) return ['map#sec-national'];
  if (loc === 'crossCuttingDuty') return ['map#sec-literacy'];
  if (loc === 'penalties') return ['map#sec-penalties'];
  if (loc === 'timeline') return ['map#sec-timeline'];
  if (loc.indexOf('scenarios') === 0) return (loc.match(/[DP]\d+/g) || []).map(id => 'scenarios#sc-' + id);
  return [];
}
function changesPanel(focusIdx){
  const C = DATA.corrections;
  const pts = OA.points;
  openDrawer(drawerHead('Δ What changed and why') +
    '<p>' + esc(C.reason) + '</p><p class="note">' + esc(C.reviewNote) + '</p><p class="small">Corrections applied ' + fmtDate(C.appliedOn) + '. ' + esc(OA.briefingGap) + '</p>' +
    '<h3>' + C.items.length + ' corrections to the research</h3>' +
    C.items.map((c, i) => {
      const p = POINT[c.omnibusPoint];
      const noChange = /no change/i.test(c.location) || /^CHECKED AND NOT CHANGED/.test(c.change);
      return '<div class="corr-item" id="corr-' + i + '" tabindex="-1"' + (noChange ? ' style="border-color:var(--new)"' : '') + '><p style="margin:0"><b>' + (i + 1) + '.</b> ' + (noChange ? '<span class="checked-tag">✓ Checked — no change</span> ' : '') + '<code>' + esc(c.location) + '</code></p><p>' + esc(c.change) + '</p>' +
        '<p class="small"><b>Basis:</b> ' + esc(c.basis) + (p ? ' · ' + ext(omniHref(p.omnibusPage), 'Omnibus point ' + p.point + ', p.' + p.omnibusPage + ' ↗', 'omni-link') : '') + '</p>' +
        '<div class="tl-links">' + corrTarget(c.location).map(t => t === 'panel:open' ? '<button type="button" class="mini-btn" data-panel="open">Open items panel</button>' : '<button type="button" class="mini-btn" data-go="' + t + '">Go to ' + esc(t.replace(/^.*#(sc-)?/, '').replace(/^$/, 'wizard') || t) + '</button>').join('') + '</div></div>';
    }).join('') +
    '<h3 style="margin-top:1.2rem">The amending regulation</h3><p class="small">' + esc(OA.regulation) + '</p><p class="note">' + esc(OA.warning) + '</p>' +
    '<p class="small">Secondary reference: ' + ext(EXPLORER_HREF, 'Commission AI Act Explorer — consolidated text ↗') + '. The local PDF page links are primary.</p>' +
    '<h4>' + SUPERSEDED.size + ' superseded articles (June 2024 text no longer accurate)</h4>' + cites(OA.supersededActArticles.map(n => 'Art. ' + n), { label: false }).replace(/<ul class="amend-notes"[\s\S]*<\/ul>$/, '') +
    '<h4>' + NEWARTS.size + ' new articles (Omnibus only)</h4>' + cites(OA.newArticles.map(n => 'Art. ' + n), { label: false }).replace(/<ul class="amend-notes"[\s\S]*<\/ul>$/, '') +
    '<p class="small">Amended annexes: ' + esc(OA.amendedAnnexes.join(', ')) + ' · New annexes: ' + esc(OA.newAnnexes.join(', ')) + '</p>' +
    '<h3>All ' + pts.length + ' Omnibus amendment points</h3><label class="small"><input type="checkbox" id="pt-material"> Show material points only</label> <span class="small muted" id="pt-count"></span>' +
    '<div id="pt-list">' + pts.map(p => '<div class="pt-row" data-material="' + p.material + '"><b>' + p.point + '</b><div><b>' + esc(p.targets) + '</b> · ' + esc(p.type) + (p.material ? ' · <b>material</b>' : '') + '<br>' + esc(p.change) + ' ' + ext(omniHref(p.omnibusPage), 'p.' + p.omnibusPage + ' ↗', 'omni-link') + '</div></div>').join('') + '</div>',
    focusIdx != null ? 'corr-' + focusIdx : null);
  updatePtCount();
}
function updatePtCount(){ const rows = $$('.pt-row'); const n = rows.filter(r => !r.hidden).length; const c = $('#pt-count'); if (c) c.textContent = n + ' of ' + rows.length + ' shown'; }

/* =========================== navigation =========================== */
function setView(v, toTop){
  ['overview', 'map', 'scenarios', 'wizard'].forEach(k => { $('#view-' + k).hidden = k !== v; });
  $$('.mode-btn').forEach(b => { if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (toTop) window.scrollTo(0, 0);
}
function go(spec){
  const i = spec.indexOf('#'); const view = i < 0 ? spec : spec.slice(0, i); const anchor = i < 0 ? '' : spec.slice(i + 1);
  closeDrawer(); hideGloss(false);
  setView(view, !anchor);
  if (view === 'wizard' && anchor && Q[anchor]) { wiz.focus = anchor; renderWizard(true); return; }
  if (!anchor) { if (view === 'wizard') { const h = $('#wz-main [data-head]'); if (h) h.focus(); } return; }
  if (anchor === 'tier-detail' || anchor === 'sec-hrreq' || anchor === 'route1') { if (openTierId !== 'high') openTier('high', false); }
  if (anchor.indexOf('sc-') === 0) { const el = document.getElementById(anchor); if (el && el.hidden) resetFilters(); }
  if (anchor === 'sec-hosp' || anchor.indexOf('gdpr-') === 0 || anchor.indexOf('hosp-') === 0) setGdpr(true);
  if (anchor.indexOf('gl-') === 0) { const s = $('#gl-search'); if (s && s.value) { s.value = ''; filterGlossary(''); } }
  const el = document.getElementById(anchor); if (!el) return;
  const tp = el.closest('#view-map .topic'); if (tp && tp.dataset.topic !== currentTopic) setTopic(tp.dataset.topic, false);
  for (let p = el.parentElement; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  if (el.tagName === 'DETAILS') el.open = true;
  el.scrollIntoView({ block: 'start' });
  if (!el.hasAttribute('tabindex') && !/^(INPUT|BUTTON|A|SELECT)$/.test(el.tagName)) el.setAttribute('tabindex', '-1');
  el.focus({ preventScroll: true });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function filterGlossary(q){
  q = q.trim().toLowerCase(); let n = 0;
  $$('.gl-item').forEach(it => { const ok = !q || it.dataset.text.indexOf(q) >= 0; it.hidden = !ok; if (ok) n++; });
  $('#gl-count').textContent = n + ' of ' + DATA.glossary.length + ' terms';
}

/* =========================== events =========================== */
document.addEventListener('click', e => {
  const pop = $('#gl-pop');
  if (!pop.hidden && !e.target.closest('#gl-pop') && !e.target.closest('.gl-term,[data-amend]')) hideGloss(false);
  const am = e.target.closest('[data-amend]');
  if (am) { if (popOwner === am && !pop.hidden) return hideGloss(true); return showAmend(am); }
  const pp = e.target.closest('[data-pop]');
  if (pp) { hideGloss(false); return openPopup(pp.dataset.pop); }
  const tb = e.target.closest('.tnav [data-topic]');
  if (tb) { setTopic(tb.dataset.topic); const first = $('#view-map .topic[data-topic="' + tb.dataset.topic + '"] h2'); if (first) { first.setAttribute('tabindex', '-1'); first.focus({ preventScroll: true }); } return; }
  const t = e.target.closest('[data-view],[data-go],[data-panel],[data-tier],[data-corr],[data-oi],[data-gl],[data-close],[data-close-pop],[data-wz],[data-wz-continue],[data-wz-goto],#wz-reset,#gdpr-toggle,#sf-reset,#backdrop');
  if (!t) return;
  if (t.id === 'backdrop' || t.hasAttribute('data-close')) return closeDrawer();
  if (t.hasAttribute('data-close-pop')) return hideGloss(true);
  if (t.dataset.view) { closeDrawer(); setView(t.dataset.view, true); if (t.dataset.view === 'wizard') renderWizard(false); return; }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); if (t.dataset.focus) { const f = document.getElementById(t.dataset.focus); if (f) f.focus(); } return; }
  if (t.dataset.panel) { hideGloss(false); return t.dataset.panel === 'open' ? openItemsPanel() : changesPanel(); }
  if (t.dataset.oi) { hideGloss(false); return openItemsPanel(t.dataset.oi); }
  if (t.dataset.corr) { hideGloss(false); return changesPanel(+t.dataset.corr); }
  if (t.dataset.tier) {
    const inPyramid = !!t.closest('.pyramid');
    if (!inPyramid) { closeDrawer(); setView('map', false); setTopic('tiers', false); }
    openTier(t.dataset.tier, inPyramid);
    if (!inPyramid) { const d = $('#tier-detail'); d.scrollIntoView({ block: 'start' }); d.focus({ preventScroll: true }); }
    return;
  }
  if (t.dataset.gl != null && t.classList.contains('gl-term')) { if (popOwner === t && !pop.hidden) return hideGloss(true); return showGloss(t); }
  if (t.dataset.wz) { const p = t.dataset.wz.split('|'); return wizChoice(p[0], p[1]); }
  if (t.dataset.wzContinue) { const qid = t.dataset.wzContinue; const sel = wiz.draft[qid] || wiz.answers[qid] || []; if (sel.length) wizAnswer(qid, sel); return; }
  if (t.dataset.wzGoto) { wiz.focus = t.dataset.wzGoto; renderWizard(true); return; }
  if (t.id === 'wz-reset') { wiz.answers = {}; wiz.draft = {}; wiz.focus = WZ.questions[0].id; renderWizard(true); return; }
  if (t.id === 'gdpr-toggle') return setGdpr(!gdprOn);
  if (t.id === 'sf-reset') return resetFilters();
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-f]')) { SF[e.target.dataset.f] = e.target.value; applyFilters(); }
  if (e.target.id === 'pt-material') { $$('.pt-row').forEach(r => r.hidden = e.target.checked && r.dataset.material !== 'true'); updatePtCount(); }
});
document.addEventListener('input', e => { if (e.target.id === 'gl-search') filterGlossary(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#gl-pop').hidden) return hideGloss(true);
  if (!$('#drawer').hidden) return closeDrawer();
});
$('#drawer').addEventListener('keydown', e => {   // keep Tab inside the open drawer
  if (e.key !== 'Tab') return;
  const f = $$('a[href],button:not([disabled]),input,select,summary,[tabindex="0"]', $('#drawer')).filter(x => x.offsetParent !== null);
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* =========================== boot =========================== */
$('#oi-count').textContent = '(' + DATA.openItems.length + ')';
$('#brand-sub').textContent = 'Data v' + M.version + ' · facts verified ' + fmtDate(M.factsVerifiedOn);
$('#foot').innerHTML = '<div class="wrap" style="padding:0"><b>Facts verified on ' + fmtDate(M.factsVerifiedOn) + '.</b> <b>Legal basis:</b> ' + esc(M.legalBasis) + '. ' + esc(firstSentence(M.disclaimer)) +
  ' Consolidated text (secondary): ' + ext(EXPLORER_HREF, 'Commission AI Act Explorer ↗') + '</div>';
renderMap();
renderScenarios();
renderWizardShell();
renderOverview();
setView('overview', false);
window.__aiActExplorer = { DATA: DATA, citeChip: citeChip, walk: walk, wiz: wiz, wizAnswer: wizAnswer, go: go };   // for inspection only
})();
</script>
