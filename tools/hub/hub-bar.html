  function boldLine(label, text) { var p = el('p'); p.appendChild(el('b', '', label)); p.appendChild(document.createTextNode(' ' + text)); return p; }
  function srcItem(s) {
    var li = el('li'); li.setAttribute('data-src', s.type);
    if (s.type === 'h') { li.appendChild(el('span', 'tag', 'Hotel')); li.appendChild(document.createTextNode(' ')); }
    var name;
    if (s.url) { name = el('a', '', s.name); name.href = s.url; name.target = '_blank'; name.rel = 'noopener noreferrer'; } else name = document.createTextNode(s.name);
    if (s.type === 'l') li.appendChild(name); else { var b = el('b'); b.appendChild(name); li.appendChild(b); }
    if (s.note) li.appendChild(document.createTextNode(': ' + s.note));
    if (s.url) {
      var addr = el('span', 'srcaddr'), u = el('span', 'srcurl', s.url), btn = el('button', 'copysrc', 'Copy address'); btn.type = 'button';
      btn.addEventListener('click', function () {
        function sel() { var r = document.createRange(); r.selectNodeContents(u); var w = getSelection(); w.removeAllRanges(); w.addRange(r); btn.textContent = 'Selected: press Ctrl+C or Cmd+C'; }
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s.url).then(function () { btn.textContent = 'Copied'; }, sel); else sel(); } catch (e) { sel(); }
      });
      addr.appendChild(u); addr.appendChild(document.createTextNode(' ')); addr.appendChild(btn); li.appendChild(addr);
    }
    return li;
  }
  function detailBox() {
    if (detail.el) return detail.el;
    var d = el('dialog', 'hub-detail'); d.id = 'hub-detail'; d.setAttribute('aria-labelledby', 'hub-detail-title');
    d.addEventListener('cancel', function (e) { e.preventDefault(); closeHubDetail(true); }); // Esc
    d.addEventListener('click', function (e) { if (e.target === d) closeHubDetail(true); }); // the dimmed area outside the drawer
    document.body.appendChild(d); detail.el = d; return d;
  }
  function openHubDetail(x, win, tool) {
    var d = detailBox(); d.textContent = '';
    var panel = el('div', 'hd-panel'), head = el('div', 'dhead'), hl = el('div'), body = el('div', 'dbody');
    hl.appendChild(el('p', 'kicker', x.kicker)); var h2 = el('h2', '', x.title); h2.id = 'hub-detail-title'; hl.appendChild(h2);
    if (x.catName) hl.appendChild(el('p', 'meta', x.catName));
    var close = el('button', 'btn', 'Close'); close.type = 'button'; close.id = 'hub-detail-close'; close.addEventListener('click', function () { closeHubDetail(true); });
    head.appendChild(hl); head.appendChild(close);
    if (x.draft) { var w = el('p', 'savewarn'); w.appendChild(el('strong', '', x.draft)); w.appendChild(document.createTextNode(' ' + x.draftText)); body.appendChild(w); }
    if (x.does) body.appendChild(boldLine('What it does:', x.does));
    if (x.how) body.appendChild(boldLine('How the AI works:', x.how));
    var lv = el('p'); lv.appendChild(el('b', '', x.level)); body.appendChild(lv);
    body.appendChild(el('h3', '', 'For the detail-minded')); body.appendChild(boldLine('The catalogue’s own description (research wording):', x.task));
    body.appendChild(el('h3', '', 'Examples and sources (' + x.srcs.length + ')'));
    if (x.srcs.length) { var ul = el('ul', 'dsrcs'); ul.id = 'hub-detail-srcs'; x.srcs.forEach(function (s) { ul.appendChild(srcItem(s)); }); body.appendChild(ul); }
    else body.appendChild(el('p', 'meta', 'The catalogue lists no source for this use case.'));
    body.appendChild(el('p', 'meta', x.foot));
    panel.appendChild(head); panel.appendChild(body); d.appendChild(panel);
    d.style.top = bar.offsetHeight + 'px'; // exactly the frame's area
    detail.open = true; detail.tool = tool; detail.id = x.id; detail.win = win; d.setAttribute('data-use', x.id);
    if (!d.open) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
    close.focus();
  }
  /* focus: true (Close, Esc, backdrop): focus goes back into the frame; false (another hub tab, or the frame asked). */
  function closeHubDetail(focus, quiet) {
    if (!detail.open) return;
    var d = detail.el, win = detail.win, id = detail.id, tool = detail.tool;
    detail.open = false; detail.tool = null; detail.id = ''; detail.win = null;
    if (d) { d.removeAttribute('data-use'); if (d.open) d.close(); d.textContent = ''; }
    if (focus && frames[tool]) { try { frames[tool].focus(); } catch (e) { /* gone */ } }
    if (!quiet && win) { try { win.postMessage({ hub: 'detail-closed', id: id, focus: !!focus }, location.origin); } catch (e) { /* frame gone */ } }
  }
  addEventListener('message', function (e) {
    var m = e.data;
    if (e.origin !== location.origin || !isPlainObject(m) || typeof m.hub !== 'string') return;
    var own = Object.keys(frames).some(function (k) { return frames[k].contentWindow === e.source; });
    if (!own) return;
    if (m.hub === 'db') { onDb(m, e.source); return; }
    if (m.hub === 'open') {
      if (!OPENABLE[m.tool]) return;
      var to = hubTool(m.tool); // 'readiness-check' → 'readiness-2', keeping the hash
      var hash = typeof m.hash === 'string' ? m.hash.replace(/[^\w=&%.\-]/g, '') : '';
      var path = srcOf(to) + (hash ? '#' + hash : '');
      if (frames[to]) {
        // replace(): a new hash in an open tab must not add a frame entry to Back/forward on top of the hub's own entry.
        try { frames[to].contentWindow.location.replace(new URL(path, location.href).href); } catch (err) { frames[to].src = path; }
      } else nextSrc[to] = path;
      send({ type: 'select', tool: to }, { push: true });
      return;
    }
    if (m.hub === 'detail') {
      var x = hubDetail(m.id, m.data), tool = Object.keys(frames).filter(function (k) { return frames[k].contentWindow === e.source; })[0];
      if (x && tool === S.tool) openHubDetail(x, e.source, tool); return; // only for the tab on screen
    }
    if (m.hub === 'detail-close') { if (detail.open && detail.win === e.source) closeHubDetail(false, true); return; }
    if (m.hub === 'ping') { cap('downloads').then(function (dl) { try { e.source.postMessage({ hub: 'pong', downloads: !!dl }, location.origin); } catch (err) { /* frame gone */ } }); return; }
    if (m.hub === 'download') onDownload(m, e.source);
  });

  // The bar's height changes with the window, with the team button appearing, and with fonts loading: keep the frame under it.
  if (typeof ResizeObserver === 'function') new ResizeObserver(placeFrame).observe(bar);
  else addEventListener('resize', placeFrame);

  canEdit().then(function (ok) { send({ type: 'access', access: ok === null ? 'local' : ok ? 'editor' : 'viewer' }); });

  // Start where this tab was: the Back/forward entry first, then this browser tab's last choice. Unknown names fall back to the assessment.
  var start = histTool();
  if (!start) { try { start = sessionStorage.getItem('hubTool'); } catch (e) { start = null; } }
  start = hubTool(start);
  if (HUB_TOOLS.indexOf(start) < 0) start = 'assessment';
  send({ type: 'select', tool: start });
  writeHist(S.pending || S.tool, false);

  /* AX: read the state without scraping the page; drive it with the same events the buttons send. */
  window.HFTPHub = {
    state: function () { return { tool: S.tool, access: S.access, pending: S.pending, frames: Object.keys(frames), capabilities: Object.assign({}, capState), detail: detail.open ? { tool: detail.tool, id: detail.id } : null, ver: Object.assign({}, HUB_VER) }; },
    send: function (ev) { return send(ev, { push: true }); },
    tools: HUB_TOOLS.slice(),
    next: hubNext
  };
})();
</script>
