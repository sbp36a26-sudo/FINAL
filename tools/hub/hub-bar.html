<!-- HFTP hub bar: injected at the top of the AI Assessment page by build-hub.mjs.
     State machines and the cross-tool contracts are documented in tools/hub/CONTRACTS.md. -->
<style>
  .hub-bar {
    display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
    padding: 8px 16px; background: #1f3b3a; color: #f3f1ea;
    font: 14px/1.4 "IBM Plex Sans", system-ui, sans-serif;
  }
  .hub-bar strong { font-weight: 600; white-space: nowrap; }
  .hub-bar strong span { font-weight: 400; opacity: .75; }
  .hub-bar nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .hub-bar button {
    font: inherit; font-weight: 500; color: inherit; background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  .hub-bar button:hover { border-color: rgba(255,255,255,.35); }
  .hub-bar button:focus-visible { outline: 2px solid #f3f1ea; outline-offset: 2px; }
  .hub-bar button[aria-pressed="true"] { background: #f3f1ea; color: #1f3b3a; }
  .hub-bar a { margin-left: auto; color: inherit; opacity: .8; font-size: 13px; }
  .hub-frame { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: #fff; display: none; }
  .hub-frame.on { display: block; }
  .hub-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  body.hub-other { overflow: hidden; }
  .hub-bar button:active { transform: translateY(1px); }
  .hub-bar nav { flex: 1; }
  .hub-bar button.team { margin-left: auto; background: #b42318; color: #fff; border-color: #b42318; }
  .hub-bar button.team:hover { border-color: #fff; }
  .hub-bar button.team[aria-pressed="true"] { background: #fff; color: #b42318; border-color: #b42318; box-shadow: inset 0 0 0 2px #b42318; }
  @media (pointer: coarse) { .hub-bar button { min-height: 44px; } }
  /* Phone: one scrolling row of tabs under the name, instead of a stacked list that ate a third of the screen. */
  @media (max-width: 640px) {
    .hub-bar { padding: 6px 12px 0; gap: 2px 12px; }
    .hub-bar nav { flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
    .hub-bar nav::-webkit-scrollbar { display: none; }
    .hub-bar button { flex: none; white-space: nowrap; padding: 5px 10px; }
    .hub-bar button.team { margin-left: 4px; }
  }
#hubBar button[hidden]{display:none!important}
</style>
<div class="hub-bar" id="hubBar" data-tool="assessment" data-access="unknown">
  <strong>HFTP tools <span>· SBP Group 36</span></strong>
  <nav aria-label="Tools">
    <button type="button" data-tool="assessment" aria-pressed="true">AI Assessment</button>
    <button type="button" data-tool="use-case-catalogue" aria-pressed="false">Use-Case Catalogue</button>
    <button type="button" data-tool="readiness-2" aria-pressed="false" title="Is AI the answer, and is your hotel ready for it?">Do you need AI?</button>
    <button type="button" data-tool="ai-act-guide" aria-pressed="false">AI Act guide</button>
    <button type="button" data-tool="register" aria-pressed="false">AI Register</button>
    <button type="button" data-tool="team" class="team" aria-pressed="false" hidden title="Team only: each shared check and how its verdict was worked out">Team: readiness results</button>
  </nav>
</div>
<div class="hub-frame" id="hubFrame"></div>
<script>
(function () {
  'use strict';
  /* machine:start  (pure: tools/hub/tests/hub.test.mjs runs this block in Node)
     Hub tab machine.
     State: { tool, access, pending }
       tool    'assessment' (this page) | 'use-case-catalogue' | 'readiness-2' | 'ai-act-guide' | 'register' | 'team' (a frame)
               24 Nov 2026: "Do you need AI?" (readiness-2) replaced the Readiness check tab. The old name 'readiness-check' is an
               alias (HUB_ALIAS): old links, old Back/forward entries and old sessionStorage values land on readiness-2.
       access  'unknown' (not asked yet) | 'local' (no claude.ai: everything shows) | 'editor' | 'viewer'
       pending 'team' while the team tab was asked for before access is known, else null
     Events (send):
       { type: 'select', tool }  a hub button, Back/forward (popstate) or a frame's { hub: 'open' }
       { type: 'access', access } the user capability answered
     Guards: an alias is resolved first; unknown tool names are ignored; 'team' is never shown to a 'viewer' and waits while access is 'unknown'. */
  var HUB_TOOLS = ['assessment', 'use-case-catalogue', 'readiness-2', 'ai-act-guide', 'register', 'team'];
  var HUB_ALIAS = { 'readiness-check': 'readiness-2' };
  function hubTool(t) { return typeof t === 'string' && Object.prototype.hasOwnProperty.call(HUB_ALIAS, t) ? HUB_ALIAS[t] : t; }
  var HUB_ACCESS = ['unknown', 'local', 'editor', 'viewer'];
  function hubInitial() { return { tool: 'assessment', access: 'unknown', pending: null }; }
  function hubNext(s, ev) {
    var n = { tool: s.tool, access: s.access, pending: s.pending };
    if (!ev || typeof ev !== 'object') return n;
    if (ev.type === 'select') {
      var tool = hubTool(ev.tool);
      if (HUB_TOOLS.indexOf(tool) < 0) return n;
      if (tool === 'team') {
        if (n.access === 'viewer') return n;
        if (n.access === 'unknown') { n.pending = 'team'; return n; }
      }
      n.tool = tool; n.pending = null; return n;
    }
    if (ev.type === 'access') {
      if (HUB_ACCESS.indexOf(ev.access) < 1) return n;
      n.access = ev.access;
      if (n.access === 'viewer' && n.tool === 'team') n.tool = 'assessment';
      if (n.pending === 'team' && n.access !== 'viewer') n.tool = 'team';
      n.pending = null; return n;
    }
    return n;
  }
  /* Link bridge (24 Nov 2026): { hub: 'link', url } from a frame. In the claude.ai artifact sandbox a target="_blank" link inside the
     hub's nested frame does not open, so the hub opens it from the top page. hubLinkUrl is the only check: a string of at most
     HUB_LINK_MAX characters, absolute http: or https:, no spaces or control characters, no user name or password in it.
     Returns the normalised URL, or null (the message is then ignored: it has no reply). */
  var HUB_LINK_MAX = 2048;
  function hubLinkUrl(u) {
    if (typeof u !== 'string' || !u || u.length > HUB_LINK_MAX || /[\s\u0000-\u001f\u007f]/.test(u) || !/^https?:\/\//i.test(u)) return null;
    var p; try { p = new URL(u); } catch (e) { return null; }
    if ((p.protocol !== 'http:' && p.protocol !== 'https:') || !p.hostname || p.username || p.password) return null;
    return p.href.length > HUB_LINK_MAX ? null : p.href;
  }
  /* machine:end */

  var SRC = { team: 'readiness-check/team.html' }; // the team page still lives in the readiness check's folder (which stays published)
  /* Tools a frame may open with { hub: 'open' }. 23 Nov 2026: + 'readiness-2' and 'use-case-catalogue'. Since 24 Nov 2026 (Do you need AI?
     v2.4) no frame sends 'use-case-catalogue' (its detail layer replaced the links); the entry is kept so the bridge stays open for later.
     24 Nov 2026: 'readiness-check' stays openable for old links (the AI Register's "check readiness" link with #use=<id>); it opens readiness-2 with the same hash. */
  var OPENABLE = { 'readiness-check': 1, register: 1, 'ai-act-guide': 1, 'readiness-2': 1, 'use-case-catalogue': 1 };
  var TIMEOUT_MS = 6000; // capability lookups and db calls answer before the frames' own 8 s / 12 s timeouts
  var bar = document.getElementById('hubBar');
  var box = document.getElementById('hubFrame');
  var nav = bar.querySelector('nav');
  var frames = {}, nextSrc = {}, assessScroll = 0;
  var S = hubInitial();
  var hasClaude = !!(window.claude && typeof window.claude.use === 'function');

  function srcOf(tool) { return SRC[tool] || (tool + '/index.html'); }
  function placeFrame() { box.style.top = bar.offsetHeight + 'px'; }
  function storeTool(t) { try { sessionStorage.setItem('hubTool', t); } catch (e) { /* storage blocked */ } }
  function histTool() { var st = history.state; return st && typeof st === 'object' && typeof st.hubTool === 'string' ? st.hubTool : null; }
  function writeHist(tool, push) {
    var st = Object.assign({}, history.state && typeof history.state === 'object' ? history.state : {}, { hubTool: tool });
    try { history[push ? 'pushState' : 'replaceState'](st, ''); } catch (e) { /* sandboxed: tabs just do not join Back/forward */ }
  }

  /* The only writer of S. how.push: add a Back/forward entry (user action). how.reload: re-open the team list. */
  function send(ev, how) {
    var prev = S; S = hubNext(S, ev); how = how || {};
    if (S.tool !== prev.tool && prev.tool === 'assessment') assessScroll = window.scrollY;
    if (S.tool !== prev.tool || ev.type === 'access') writeHist(S.tool, !!how.push && ev.type === 'select' && S.tool !== prev.tool);
    render(prev, how);
    return S;
  }
  function render(prev, how) {
    var tool = S.tool;
    bar.setAttribute('data-tool', tool); bar.setAttribute('data-access', S.access);
    if (S.pending) bar.setAttribute('data-pending', S.pending); else bar.removeAttribute('data-pending');
    var teamBtn = bar.querySelector('button[data-tool="team"]');
    if (teamBtn) teamBtn.hidden = !(S.access === 'local' || S.access === 'editor');
    bar.querySelectorAll('button[data-tool]').forEach(function (b) {
      var on = b.dataset.tool === tool; b.setAttribute('aria-pressed', String(on));
      if (on && nav.scrollWidth > nav.clientWidth) { var l = b.offsetLeft - nav.offsetLeft; if (l < nav.scrollLeft || l + b.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = l - 12; }
    });
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== tool; });
    if (tool === 'assessment') {
      box.classList.remove('on'); document.body.classList.remove('hub-other');
      if (prev.tool !== 'assessment') window.scrollTo(0, assessScroll);
    } else {
      if (frames[tool] && tool === 'team' && (prev.tool !== 'team' || how.reload)) { try { frames[tool].contentWindow.location.reload(); } catch (e) { /* not loaded yet */ } }
      if (!frames[tool]) {
        var f = document.createElement('iframe');
        f.src = nextSrc[tool] || srcOf(tool); f.title = tool; delete nextSrc[tool];
        frames[tool] = f; box.appendChild(f);
      }
      if (prev.tool === 'assessment') window.scrollTo(0, 0);
      placeFrame();
      box.classList.add('on'); document.body.classList.add('hub-other');
    }
    storeTool(tool);
  }

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tool]'); if (!b) return;
    send({ type: 'select', tool: b.dataset.tool }, { push: true, reload: true });
  });
  // Back/forward between hub tabs. Entries the assessment makes with its own #hash carry no hubTool: they belong to it.
  addEventListener('popstate', function () { send({ type: 'select', tool: histTool() || 'assessment' }); });

  /* Capabilities (claude.ai only). Each lookup is one promise that settles to the capability or null,
     at the latest after TIMEOUT_MS (the timeout is an event: it resolves null, it never leaves a caller waiting). */
  var caps = {}, capState = {};
  function cap(name, ms) {
    if (caps[name]) return caps[name];
    if (!hasClaude) { capState[name] = 'missing'; caps[name] = Promise.resolve(null); return caps[name]; }
    capState[name] = 'loading';
    caps[name] = new Promise(function (res) {
      var t = setTimeout(function () { capState[name] = 'timeout'; delete caps[name]; res(null); }, ms || TIMEOUT_MS);
      Promise.resolve().then(function () { return window.claude.use(name); }).then(function (c) { clearTimeout(t); if (capState[name] !== 'timeout') capState[name] = c ? 'ready' : 'missing'; res(c || null); },
        function () { clearTimeout(t); if (capState[name] !== 'timeout') capState[name] = 'missing'; res(null); });
    });
    return caps[name];
  }
  // Who may see shared readiness checks: only Editors of the hub (and the owner). Outside claude.ai (local testing) the team tab shows.
  var editP = null;
  function canEdit() {
    if (!editP) editP = hasClaude ? cap('user', 15000).then(function (u) { return !!(u && u.canEdit()); }).catch(function () { return false; }) : Promise.resolve(null);
    return editP;
  }

  /* Bridge for the tools in frames (contract: CONTRACTS.md). Only same-origin messages from this hub's own frames are read;
     anything malformed gets a { ok: false, code: 'bad_request' } reply where the message has a reply type. */
  function isPlainObject(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function cleanId(s) { return String(s || '').replace(/[^\w-]/g, ''); }
  function onDb(m, source) {
    var done = false;
    function reply(o) { if (done) return; done = true; o.hub = 'db-result'; o.id = m.id; try { source.postMessage(o, location.origin); } catch (e) { /* frame gone */ } }
    var t = setTimeout(function () { reply({ ok: false, code: 'timeout' }); }, TIMEOUT_MS + 1000);
    var replyAndStop = function (o) { clearTimeout(t); reply(o); };
    var op = m.op, doc = typeof m.doc === 'string' ? m.doc : '';
    var team = doc.indexOf('/') > 0;
    if (m.col !== 'readiness' || ['probe', 'list', 'set', 'delete'].indexOf(op) < 0) { replyAndStop({ ok: false, code: 'bad_request' }); return; }
    if ((op === 'set' || op === 'delete') && !cleanId(doc.split('/').pop())) { replyAndStop({ ok: false, code: 'bad_request' }); return; }
    if (op === 'set' && !isPlainObject(m.data)) { replyAndStop({ ok: false, code: 'bad_request' }); return; }
    // Shared checks live at readiness/<viewer id>/checks/<check id>: each person writes only their own folder
    // (db rule readiness/{self}); only Editors and the owner can read across folders (rule on readiness).
    ((op === 'list' || team) ? canEdit().then(function (ok) { if (ok === false) throw { code: 'not_allowed' }; }) : Promise.resolve()).then(function () {
      return Promise.all([cap('db'), cap('user')]);
    }).then(function (r) {
      var db = r[0], u = r[1];
      if (!db || !u) throw { code: 'unavailable' };
      if (op === 'probe') { replyAndStop({ ok: true }); return; }
      if (op === 'list') return db.collection('readiness').get().then(function (snap) {
        var people = snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return d.id; });
        return Promise.all(people.map(function (pid) {
          return db.collection('readiness/' + pid + '/checks').get().then(function (s2) { return s2.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({}, d.data(), { _id: pid + '/' + d.id }); }); });
        })).then(function (lists) { replyAndStop({ ok: true, docs: [].concat.apply([], lists) }); });
      });
      if (op === 'delete' && team) {
        var parts = doc.split('/'), pid = cleanId(parts[0]), cid = cleanId(parts[1]);
        if (!pid || !cid) throw { code: 'bad_request' };
        return db.doc('readiness/' + pid + '/checks/' + cid).delete().then(function () { replyAndStop({ ok: true }); });
      }
      return u.id().then(function (me) {
        var path = 'readiness/' + me + '/checks/' + cleanId(doc);
        if (op === 'set') return db.doc('readiness/' + me).set({ updatedAt: new Date().toISOString() }).then(function () { return db.doc(path).set(m.data); }).then(function () { replyAndStop({ ok: true }); });
        return db.doc(path).delete().then(function () { replyAndStop({ ok: true }); });
      });
    }).catch(function (err) { replyAndStop({ ok: false, code: (err && err.code) || 'unavailable' }); });
  }
  function onDownload(m, source) {
    function reply(ok, code) { var o = { hub: 'download-result', id: m.id, ok: ok }; if (!ok) o.code = code; try { source.postMessage(o, location.origin); } catch (e) { /* frame gone */ } }
    var name = typeof m.filename === 'string' ? m.filename.trim() : '';
    if (!name || name.length > 200 || m.data === undefined || m.data === null) { reply(false, 'bad_request'); return; }
    cap('downloads').then(function (dl) {
      if (!dl) throw { code: 'unavailable' };
      return dl.save({ filename: m.filename, data: m.data });
    }).then(function () { reply(true); }, function (err) { reply(false, (err && err.code) || 'unavailable'); });
  }
  /* Opens a frame's external link from this (top) page: a real <a target="_blank"> clicked inside the message handler, which runs
     while the person's click in the frame still counts as a user action; window.open if the click fails. */
  var links = 0;
  function openTop(url) {
    links++;
    try {
      var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.hidden = true;
      document.body.appendChild(a); a.click(); a.remove(); return;
    } catch (e) { /* fall through */ }
    try { window.open(url, '_blank', 'noopener'); } catch (e) { /* the browser refused: nothing else to try */ }
  }
  addEventListener('message', function (e) {
    var m = e.data;
    if (e.origin !== location.origin || !isPlainObject(m) || typeof m.hub !== 'string') return;
    var own = Object.keys(frames).some(function (k) { return frames[k].contentWindow === e.source; });
    if (!own) return;
    if (m.hub === 'db') { onDb(m, e.source); return; }
    if (m.hub === 'open') {
      if (!OPENABLE[m.tool]) return;
      var to = hubTool(m.tool); // 'readiness-check' → 'readiness-2', keeping the hash
      var hash = typeof m.hash === 'string' ? m.hash.replace(/[^\w=&%.\-]/g, '') : '';
      var path = srcOf(to) + (hash ? '#' + hash : '');
      if (frames[to]) {
        // replace(): a new hash in an open tab must not add a frame entry to Back/forward on top of the hub's own entry.
        try { frames[to].contentWindow.location.replace(new URL(path, location.href).href); } catch (err) { frames[to].src = path; }
      } else nextSrc[to] = path;
      send({ type: 'select', tool: to }, { push: true });
      return;
    }
    if (m.hub === 'link') { var url = hubLinkUrl(m.url); if (url) openTop(url); return; }
    if (m.hub === 'ping') { cap('downloads').then(function (dl) { try { e.source.postMessage({ hub: 'pong', downloads: !!dl }, location.origin); } catch (err) { /* frame gone */ } }); return; }
    if (m.hub === 'download') onDownload(m, e.source);
  });

  // The bar's height changes with the window, with the team button appearing, and with fonts loading: keep the frame under it.
  if (typeof ResizeObserver === 'function') new ResizeObserver(placeFrame).observe(bar);
  else addEventListener('resize', placeFrame);

  canEdit().then(function (ok) { send({ type: 'access', access: ok === null ? 'local' : ok ? 'editor' : 'viewer' }); });

  // Start where this tab was: the Back/forward entry first, then this browser tab's last choice. Unknown names fall back to the assessment.
  var start = histTool();
  if (!start) { try { start = sessionStorage.getItem('hubTool'); } catch (e) { start = null; } }
  start = hubTool(start);
  if (HUB_TOOLS.indexOf(start) < 0) start = 'assessment';
  send({ type: 'select', tool: start });
  writeHist(S.pending || S.tool, false);

  /* AX: read the state without scraping the page; drive it with the same events the buttons send. */
  window.HFTPHub = {
    state: function () { return { tool: S.tool, access: S.access, pending: S.pending, frames: Object.keys(frames), capabilities: Object.assign({}, capState), links: links }; },
    send: function (ev) { return send(ev, { push: true }); },
    tools: HUB_TOOLS.slice(),
    next: hubNext
  };
})();
</script>
