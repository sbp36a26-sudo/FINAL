<!-- HFTP hub bar: injected at the top of the AI Assessment page by build-hub.mjs. -->
<style>
  .hub-bar {
    display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
    padding: 8px 16px; background: #1f3b3a; color: #f3f1ea;
    font: 14px/1.4 "IBM Plex Sans", system-ui, sans-serif;
  }
  .hub-bar strong { font-weight: 600; white-space: nowrap; }
  .hub-bar strong span { font-weight: 400; opacity: .75; }
  .hub-bar nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .hub-bar button {
    font: inherit; font-weight: 500; color: inherit; background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  .hub-bar button:hover { border-color: rgba(255,255,255,.35); }
  .hub-bar button[aria-pressed="true"] { background: #f3f1ea; color: #1f3b3a; }
  .hub-bar a { margin-left: auto; color: inherit; opacity: .8; font-size: 13px; }
  .hub-frame { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: #fff; display: none; }
  .hub-frame.on { display: block; }
  .hub-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  body.hub-other { overflow: hidden; }
  .hub-bar button:active { transform: translateY(1px); }
  .hub-bar nav { flex: 1; }
  .hub-bar button.team { margin-left: auto; background: #b42318; color: #fff; border-color: #b42318; }
  .hub-bar button.team:hover { border-color: #fff; }
  .hub-bar button.team[aria-pressed="true"] { background: #fff; color: #b42318; border-color: #b42318; box-shadow: inset 0 0 0 2px #b42318; }
  @media (pointer: coarse) { .hub-bar button { min-height: 44px; } }
</style>
<div class="hub-bar" id="hubBar">
  <strong>HFTP tools <span>· SBP Group 36</span></strong>
  <nav aria-label="Tools">
    <button type="button" data-tool="assessment" aria-pressed="true">AI Assessment</button>
    <button type="button" data-tool="use-case-catalogue" aria-pressed="false">Use-Case Catalogue</button>
    <button type="button" data-tool="readiness-check" aria-pressed="false">Readiness check</button>
    <button type="button" data-tool="register" aria-pressed="false">AI Register</button>
    <button type="button" data-tool="team" class="team" aria-pressed="false" title="Team only: each client's readiness check and how the score was worked out">Team: readiness results</button>
  </nav>
</div>
<div class="hub-frame" id="hubFrame"></div>
<script>
(function () {
  var frames = {};
  var SRC = { 'readiness-check': 'readiness-check/index.html', team: 'readiness-check/team.html' };
  var bar = document.getElementById('hubBar');
  var box = document.getElementById('hubFrame');
  function show(tool) {
    bar.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tool === tool)); });
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== tool; });
    if (tool === 'assessment') {
      box.classList.remove('on'); document.body.classList.remove('hub-other');
    } else {
      if (frames[tool] && tool === 'team') { try { frames[tool].contentWindow.location.reload(); } catch (e) { /* ignore */ } }
      if (!frames[tool]) {
        var f = document.createElement('iframe');
        f.src = SRC[tool] || (tool + '/index.html'); f.title = tool;
        frames[tool] = f; box.appendChild(f);
      }
      window.scrollTo(0, 0);
      box.style.top = bar.offsetHeight + 'px';
      box.classList.add('on'); document.body.classList.add('hub-other');
    }
    try { sessionStorage.setItem('hubTool', tool); } catch (e) {}
  }
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tool]'); if (b) show(b.dataset.tool);
  });
  // Download bridge: a tool in a tab cannot save files itself inside claude.ai, so it asks this page to do it.
  var dl = null, dlKnown = null;
  var dbP = null;
  function dbNs() { if (!dbP) dbP = (window.claude && typeof window.claude.use === 'function' ? window.claude.use('db') : Promise.resolve(null)).catch(function () { return null; }); return dbP; }
  function downloads() {
    if (!dlKnown) dlKnown = (window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : Promise.resolve(null)).then(function (d) { dl = d || null; }, function () { dl = null; });
    return dlKnown;
  }
  addEventListener('message', function (e) {
    var m = e.data;
    if (e.origin !== location.origin || !m || typeof m !== 'object' || !m.hub) return;
    var own = Object.keys(frames).some(function (k) { return frames[k].contentWindow === e.source; });
    if (!own) return;
    if (m.hub === 'db') {
      var reply = function (o) { o.hub = 'db-result'; o.id = m.id; e.source.postMessage(o, location.origin); };
      if (!/^readiness$/.test(String(m.col))) { reply({ ok: false, code: 'bad_request' }); return; }
      dbNs().then(function (db) {
        if (!db) throw { code: 'unavailable' };
        var col = db.collection(m.col);
        if (m.op === 'list') return col.get().then(function (snap) { reply({ ok: true, docs: snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({ _id: d.id }, d.data()); }) }); });
        if (m.op === 'set') return col.doc(String(m.doc)).set(m.data).then(function () { reply({ ok: true }); });
        if (m.op === 'delete') return col.doc(String(m.doc)).delete().then(function () { reply({ ok: true }); });
        throw { code: 'bad_request' };
      }).catch(function (err) { reply({ ok: false, code: (err && err.code) || 'unavailable' }); });
      return;
    }
    if (m.hub === 'ping') downloads().then(function () { e.source.postMessage({ hub: 'pong', downloads: !!dl }, location.origin); });
    else if (m.hub === 'download') downloads().then(function () {
      if (!dl) throw { code: 'unavailable' };
      return dl.save({ filename: String(m.filename), data: m.data });
    }).then(function () { e.source.postMessage({ hub: 'download-result', id: m.id, ok: true }, location.origin); },
            function (err) { e.source.postMessage({ hub: 'download-result', id: m.id, ok: false, code: (err && err.code) || 'unavailable' }, location.origin); });
  });
  addEventListener('resize', function () { box.style.top = bar.offsetHeight + 'px'; });
  var start = 'assessment';
  try { start = sessionStorage.getItem('hubTool') || start; } catch (e) {}
  show(start);
})();
</script>
