<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HFTP Tool Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a consulting-grade working tool. Summary first (filters, tiles, maturity-vs-strategy map),
   detail below (tables). The interview editor is a long form with a sticky score strip and a live result rail. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f1f4f8; --surface-3: #e5eaf0;
  --ink: #111826; --ink-2: #4a5465; --muted: #5E6878; --line: #e0e5ec; --line-2: #c9d0da;
  --accent: #226CC4; --accent-ink: #1c5cab; --accent-wash: rgba(42,120,214,.08); --accent-wash-2: rgba(42,120,214,.16);
  --b-low: #86b6ef; --b-low-ink: #0b1a2e; --b-med: #226CC4; --b-med-ink: #ffffff; --b-high: #104281; --b-high-ink: #ffffff;
  --b-none: #dce1e8; --b-none-ink: #4a5465;
  --ok: #0a7a0a; --ok-wash: rgba(12,163,12,.10); --warn: #855600; --warn-wash: rgba(250,178,25,.20); --crit: #bf2f2f; --crit-wash: rgba(208,59,59,.10);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(17,24,38,.05), 0 2px 8px rgba(17,24,38,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #161a21; --surface-2: #1b2028; --surface-3: #262c36;
    --ink: #eef1f5; --ink-2: #c3c9d3; --muted: #8b94a3; --line: #29303a; --line-2: #3a424e;
    --accent: #3987e5; --accent-ink: #9ec5f4; --accent-wash: rgba(57,135,229,.12); --accent-wash-2: rgba(57,135,229,.24);
    --b-low: #1c5cab; --b-low-ink: #ffffff; --b-med: #3987e5; --b-med-ink: #ffffff; --b-high: #9ec5f4; --b-high-ink: #0b1a2e;
    --b-none: #39414c; --b-none-ink: #c3c9d3;
    --ok: #4cc84c; --ok-wash: rgba(12,163,12,.18); --warn: #f2bf4f; --warn-wash: rgba(250,178,25,.16); --crit: #f08080; --crit-wash: rgba(208,59,59,.20);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #161a21; --surface-2: #1b2028; --surface-3: #262c36;
  --ink: #eef1f5; --ink-2: #c3c9d3; --muted: #8b94a3; --line: #29303a; --line-2: #3a424e;
  --accent: #3987e5; --accent-ink: #9ec5f4; --accent-wash: rgba(57,135,229,.12); --accent-wash-2: rgba(57,135,229,.24);
  --b-low: #1c5cab; --b-low-ink: #ffffff; --b-med: #3987e5; --b-med-ink: #ffffff; --b-high: #9ec5f4; --b-high-ink: #0b1a2e;
  --b-none: #39414c; --b-none-ink: #c3c9d3;
  --ok: #4cc84c; --ok-wash: rgba(12,163,12,.18); --warn: #f2bf4f; --warn-wash: rgba(250,178,25,.16); --crit: #f08080; --crit-wash: rgba(208,59,59,.20);
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 0.875rem/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 1.375rem; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 1rem; font-weight: 600; }
h3 { font-size: 0.9062rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.7812rem; }
.mono { font-family: var(--mono); font-size: 0.75rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 20px; padding: 10px 24px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--b-high); color: var(--b-high-ink);
  font-weight: 700; font-size: 0.75rem; letter-spacing: .03em; }
.brand b { display: block; font-size: 0.875rem; }
.brand small { display: block; font-size: 0.7188rem; color: var(--muted); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 6px 12px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-wash); color: var(--accent-ink); }
.topbar .spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 0.8125rem; }
.who img { width: 24px; height: 24px; border-radius: 50%; }

/* buttons & inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--surface); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 0.7812rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 0.7812rem; }
label.f { display: grid; gap: 4px; font-size: 0.7812rem; color: var(--ink-2); font-weight: 500; }
input[type=text], input[type=date], input[type=url], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-2); }
.counter { font-size: 0.7188rem; color: var(--muted); text-align: right; }
.counter.full { color: var(--warn); }

/* page */
main { max-width: 1320px; margin: 0 auto; padding: 22px 24px 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head p { color: var(--ink-2); margin-top: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 0; flex-wrap: wrap; }
.card-b { padding: 14px 16px 16px; }

/* banners & toasts */
#banners:empty { display: none; }
#banners { max-width: 1320px; margin: 14px auto 0; padding: 0 24px; display: grid; gap: 8px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.banner.warn { background: var(--warn-wash); border-color: transparent; }
.banner.crit { background: var(--crit-wash); border-color: transparent; }
.banner.info { background: var(--accent-wash); border-color: transparent; }
.banner b { font-weight: 600; }
.banner .grow { flex: 1; }
#toasts { position: fixed; left: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 0.8125rem; }
.toast .link { color: inherit; }

/* dialog */
.scrim { position: fixed; inset: 0; background: rgba(9,12,18,.45); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { width: min(520px, 100%); background: var(--surface); border-radius: 12px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog textarea { min-height: 200px; font-family: var(--mono); font-size: 0.75rem; }

/* pills & chips */
.pill { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; min-width: 74px; height: 24px; padding: 0 10px; border-radius: 6px;
  font-weight: 700; font-size: 0.7188rem; letter-spacing: .06em; }
.pill.LOW { background: var(--b-low); color: var(--b-low-ink); }
.pill.MEDIUM { background: var(--b-med); color: var(--b-med-ink); }
.pill.HIGH { background: var(--b-high); color: var(--b-high-ink); }
.pill.NONE { background: var(--b-none); color: var(--b-none-ink); font-weight: 600; letter-spacing: 0; }
.pill.lg { height: 34px; min-width: 110px; font-size: 0.875rem; border-radius: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 0.7188rem; font-weight: 500;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-wash); color: var(--warn); }
.chip.ok { background: var(--ok-wash); color: var(--ok); }
.chip.crit { background: var(--crit-wash); color: var(--crit); }
.chip.info { background: var(--accent-wash); color: var(--accent-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* overview */
.filters { display: grid; grid-template-columns: minmax(180px, 2fr) repeat(4, minmax(120px, 1fr)) minmax(130px, 1fr) minmax(130px, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 16px; }
.filters label.f { font-size: 0.7188rem; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 0.7812rem; color: var(--ink-2); height: 34px; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; }
.tile .lbl { font-size: 0.75rem; color: var(--ink-2); }
.tile .val { font-size: 1.625rem; font-weight: 600; margin-top: 2px; }
.tile .sub { font-size: 0.75rem; color: var(--muted); }
.tile.mix { grid-column: span 2; }
.mixbar { display: flex; gap: 2px; height: 8px; margin: 10px 0 8px; }
.mixbar span { border-radius: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.75rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.12); font-size: 0.7812rem; min-width: 160px; z-index: 5; }
.tip b { font-size: 0.8438rem; }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
table.t th { text-align: left; font-weight: 600; font-size: 0.75rem; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.t th button { all: unset; cursor: pointer; }
table.t th button:focus-visible { outline: 2px solid var(--accent); }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover { background: var(--surface-2); }
table.t tr.archived td { color: var(--muted); }
.cell-main { font-weight: 500; }
.cell-sub { font-size: 0.75rem; color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; display: grid; gap: 12px; justify-items: center; color: var(--ink-2); }

/* editor */
.strip { position: sticky; top: 51px; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 16px; margin: -6px 0 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); flex-wrap: wrap; }
.strip .who-is { min-width: 180px; flex: 1; }
.strip .who-is b { display: block; font-size: 0.9375rem; }
.strip .bignum { font-size: 1.625rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.strip .pillars { font-size: 0.7812rem; color: var(--ink-2); display: grid; }
.save { font-size: 0.7812rem; color: var(--muted); min-width: 120px; display: inline-flex; align-items: center; gap: 6px; }
.save.err { color: var(--crit); }
.save.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.pending::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.rail { position: sticky; top: 132px; display: grid; gap: 12px; }
fieldset.plain { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 16px; }
details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
details.sec > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.sec[open] > summary::before { transform: rotate(45deg); }
details.sec > summary .sum-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.sec-b { padding: 4px 18px 18px; display: grid; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fields .w2 { grid-column: span 2; }
.fields .w3 { grid-column: 1 / -1; }
.cat { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; background: var(--surface); }
.cat-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.cat-h .q { color: var(--ink-2); font-size: 0.8125rem; margin-top: 2px; }
.badge { text-align: right; min-width: 72px; }
.badge .v { font-size: 1.5rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.badge .s { font-size: 0.7188rem; color: var(--muted); margin-top: 3px; }
.badge.unset .v { color: var(--muted); }

/* range slider */
.range-wrap { padding: 2px 2px 0; }
input[type=range].lvl { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; cursor: pointer; display: block; }
input[type=range].lvl::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), var(--surface-3) var(--fill, 0%) 100%); }
input[type=range].lvl::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
input[type=range].lvl::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range].lvl::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; margin-top: -7px;
  background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
input[type=range].lvl::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
input[type=range].lvl.unset::-webkit-slider-thumb { opacity: 0; }
input[type=range].lvl.unset::-moz-range-thumb { opacity: 0; }
input[type=range].lvl.unset::-moz-range-progress { background: transparent; }
input[type=range].lvl:disabled { cursor: not-allowed; opacity: .7; }
.ticks { display: flex; justify-content: space-between; padding: 0 2px; font-size: 0.7188rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { width: 24px; text-align: center; }
.ticks span:first-child { text-align: left; }
.ticks span:last-child { text-align: right; }
.unset-hint { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
ol.levels { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
button.lv { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 7px 10px;
  border-radius: 7px; border: 1px solid transparent; cursor: pointer; }
button.lv:hover { background: var(--surface-2); }
button.lv:focus-visible { outline: 2px solid var(--accent); }
button.lv.on { background: var(--accent-wash); border-color: var(--accent-wash-2); }
button.lv:disabled { cursor: default; }
.lv-score { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
button.lv.on .lv-score { color: var(--accent-ink); }
.lv-name { display: block; font-weight: 500; }
.lv-desc { display: block; font-size: 0.7812rem; color: var(--muted); }
.rule { font-size: 0.7812rem; color: var(--ink-2); background: var(--surface-2); border-radius: 7px; padding: 8px 10px; }
.note-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; gap: 2px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7812rem; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:disabled { cursor: not-allowed; }
.calc { font-size: 0.8125rem; padding: 8px 10px; border-radius: 7px; background: var(--surface-2); }
.calc.err { background: var(--crit-wash); color: var(--crit); }
.dept { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dept:last-child { border-bottom: 0; }
.seg.d button.on.live { background: var(--accent); color: #fff; }
.seg.d button.on.pilot { background: var(--accent-wash-2); color: var(--accent-ink); }
.quote { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 8px; }
.find { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* result rail */
.res .card-b { display: grid; gap: 14px; }
.res-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.res-num { font-size: 2.75rem; font-weight: 700; line-height: 1; }
.res-num small { font-size: 0.9375rem; color: var(--muted); font-weight: 500; }
.pbar { display: grid; gap: 4px; }
.pbar .lab { display: flex; justify-content: space-between; font-size: 0.7812rem; color: var(--ink-2); }
.pbar .lab b { color: var(--ink); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.reqs { display: grid; gap: 10px; }
.req-g h4 { margin: 0 0 4px; font-size: 0.75rem; color: var(--ink-2); }
.req { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 0.7812rem; align-items: start; padding: 2px 0; }
.reason { font-size: 0.8125rem; line-height: 1.5; }
details.calcd summary { cursor: pointer; font-size: 0.7812rem; color: var(--accent-ink); }
details.calcd .lines { margin-top: 8px; display: grid; gap: 4px; font-size: 0.7812rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* company & framework */
.co-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
td.gap-hi { background: var(--warn-wash); }
.fw-cat { display: grid; gap: 8px; }
.fw-table td { vertical-align: top; }
.fw-edit input[type=number] { max-width: 110px; }
.fw-section { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 0.8125rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }

@media (max-width: 1180px) {
  .editor { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }

(function () {
  'use strict';
  /* machine:start  (pure: tools/hub/tests/hub.test.mjs runs this block in Node)

     State: { tool, access, pending }

       access  'unknown' (not asked yet) | 'local' (no claude.ai: everything shows) | 'editor' | 'viewer'
       pending 'team' while the team tab was asked for before access is known, else null
     Events (send):
       { type: 'select', tool }  a hub button, Back/forward (popstate) or a frame's { hub: 'open' }
       { type: 'access', access } the user capability answered
     Guards: unknown tool names are ignored; 'team' is never shown to a 'viewer' and waits while access is 'unknown'. */
  var HUB_TOOLS = ['assessment', 'use-case-catalogue', 'readiness-2', 'readiness-check', 'ai-act-guide', 'register', 'team'];
  var HUB_ACCESS = ['unknown', 'local', 'editor', 'viewer'];
  function hubInitial() { return { tool: 'assessment', access: 'unknown', pending: null }; }
  function hubNext(s, ev) {
    var n = { tool: s.tool, access: s.access, pending: s.pending };
    if (!ev || typeof ev !== 'object') return n;
    if (ev.type === 'select') {
      if (HUB_TOOLS.indexOf(ev.tool) < 0) return n;
      if (ev.tool === 'team') {
        if (n.access === 'viewer') return n;
        if (n.access === 'unknown') { n.pending = 'team'; return n; }
      }
      n.tool = ev.tool; n.pending = null; return n;
    }
    if (ev.type === 'access') {
      if (HUB_ACCESS.indexOf(ev.access) < 1) return n;
      n.access = ev.access;
      if (n.access === 'viewer' && n.tool === 'team') n.tool = 'assessment';
      if (n.pending === 'team' && n.access !== 'viewer') n.tool = 'team';
      n.pending = null; return n;
    }
    return n;
  }
  /* machine:end */

  var SRC = { 'readiness-check': 'readiness-check/index.html', team: 'readiness-check/team.html' };
  /* Tools a frame may open with { hub: 'open' }. 23 Nov 2026: + 'readiness-2' and 'use-case-catalogue' (Readiness 2.0 links to a department's sources). */
  var OPENABLE = { 'readiness-check': 1, register: 1, 'ai-act-guide': 1, 'readiness-2': 1, 'use-case-catalogue': 1 };
  var TIMEOUT_MS = 6000; // capability lookups and db calls answer before the frames' own 8 s / 12 s timeouts
  var bar = document.getElementById('hubBar');
  var box = document.getElementById('hubFrame');
  var nav = bar.querySelector('nav');
  var frames = {}, nextSrc = {}, assessScroll = 0;
  var S = hubInitial();
  var hasClaude = !!(window.claude && typeof window.claude.use === 'function');

  function srcOf(tool) { return SRC[tool] || (tool + '/index.html'); }
  function placeFrame() { box.style.top = bar.offsetHeight + 'px'; }
  function storeTool(t) { try { sessionStorage.setItem('hubTool', t); } catch (e) { /* storage blocked */ } }
  function histTool() { var st = history.state; return st && typeof st === 'object' && typeof st.hubTool === 'string' ? st.hubTool : null; }
  function writeHist(tool, push) {
    var st = Object.assign({}, history.state && typeof history.state === 'object' ? history.state : {}, { hubTool: tool });

    if (S.tool !== prev.tool || ev.type === 'access') writeHist(S.tool, !!how.push && ev.type === 'select' && S.tool !== prev.tool);
    render(prev, how);
    return S;
  }
  function render(prev, how) {

    if (S.pending) bar.setAttribute('data-pending', S.pending); else bar.removeAttribute('data-pending');
    var teamBtn = bar.querySelector('button[data-tool="team"]');
    if (teamBtn) teamBtn.hidden = !(S.access === 'local' || S.access === 'editor');

    });

    if (tool === 'assessment') {
      box.classList.remove('on'); document.body.classList.remove('hub-other');
      if (prev.tool !== 'assessment') window.scrollTo(0, assessScroll);
    } else {
      if (frames[tool] && tool === 'team' && (prev.tool !== 'team' || how.reload)) { try { frames[tool].contentWindow.location.reload(); } catch (e) { /* not loaded yet */ } }
      if (!frames[tool]) {
        var f = document.createElement('iframe');
        f.src = nextSrc[tool] || srcOf(tool); f.title = tool; delete nextSrc[tool];
        frames[tool] = f; box.appendChild(f);
      }
      if (prev.tool === 'assessment') window.scrollTo(0, 0);
      placeFrame();
      box.classList.add('on'); document.body.classList.add('hub-other');
    }
    storeTool(tool);
  }

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tool]'); if (!b) return;
    send({ type: 'select', tool: b.dataset.tool }, { push: true, reload: true });
  });
  // Back/forward between hub tabs. Entries the assessment makes with its own #hash carry no hubTool: they belong to it.
  addEventListener('popstate', function () { send({ type: 'select', tool: histTool() || 'assessment' }); });

  /* Capabilities (claude.ai only). Each lookup is one promise that settles to the capability or null,
     at the latest after TIMEOUT_MS (the timeout is an event: it resolves null, it never leaves a caller waiting). */
  var caps = {}, capState = {};
  function cap(name, ms) {
    if (caps[name]) return caps[name];
    if (!hasClaude) { capState[name] = 'missing'; caps[name] = Promise.resolve(null); return caps[name]; }
    capState[name] = 'loading';
    caps[name] = new Promise(function (res) {
      var t = setTimeout(function () { capState[name] = 'timeout'; delete caps[name]; res(null); }, ms || TIMEOUT_MS);

        function () { clearTimeout(t); if (capState[name] !== 'timeout') capState[name] = 'missing'; res(null); });
    });
    return caps[name];
  }
  // Who may see shared readiness checks: only Editors of the hub (and the owner). Outside claude.ai (local testing) the team tab shows.
  var editP = null;
  function canEdit() {
    if (!editP) editP = hasClaude ? cap('user', 15000).then(function (u) { return !!(u && u.canEdit()); }).catch(function () { return false; }) : Promise.resolve(null);

  }

    var replyAndStop = function (o) { clearTimeout(t); reply(o); };

    if (m.col !== 'readiness' || ['probe', 'list', 'set', 'delete'].indexOf(op) < 0) { replyAndStop({ ok: false, code: 'bad_request' }); return; }
    if ((op === 'set' || op === 'delete') && !cleanId(doc.split('/').pop())) { replyAndStop({ ok: false, code: 'bad_request' }); return; }
    if (op === 'set' && !isPlainObject(m.data)) { replyAndStop({ ok: false, code: 'bad_request' }); return; }
    // Shared checks live at readiness/<viewer id>/checks/<check id>: each person writes only their own folder
    // (db rule readiness/{self}); only Editors and the owner can read across folders (rule on readiness).
    ((op === 'list' || team) ? canEdit().then(function (ok) { if (ok === false) throw { code: 'not_allowed' }; }) : Promise.resolve()).then(function () {
      return Promise.all([cap('db'), cap('user')]);
    }).then(function (r) {

      if (op === 'list') return db.collection('readiness').get().then(function (snap) {
        var people = snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return d.id; });
        return Promise.all(people.map(function (pid) {
          return db.collection('readiness/' + pid + '/checks').get().then(function (s2) { return s2.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({}, d.data(), { _id: pid + '/' + d.id }); }); });
        })).then(function (lists) { replyAndStop({ ok: true, docs: [].concat.apply([], lists) }); });
      });

        var parts = doc.split('/'), pid = cleanId(parts[0]), cid = cleanId(parts[1]);
        if (!pid || !cid) throw { code: 'bad_request' };
        return db.doc('readiness/' + pid + '/checks/' + cid).delete().then(function () { replyAndStop({ ok: true }); });
      }
      return u.id().then(function (me) {
        var path = 'readiness/' + me + '/checks/' + cleanId(doc);
        if (op === 'set') return db.doc('readiness/' + me).set({ updatedAt: new Date().toISOString() }).then(function () { return db.doc(path).set(m.data); }).then(function () { replyAndStop({ ok: true }); });
        return db.doc(path).delete().then(function () { replyAndStop({ ok: true }); });
      });
    }).catch(function (err) { replyAndStop({ ok: false, code: (err && err.code) || 'unavailable' }); });
  }
  function onDownload(m, source) {
    function reply(ok, code) { var o = { hub: 'download-result', id: m.id, ok: ok }; if (!ok) o.code = code; try { source.postMessage(o, location.origin); } catch (e) { /* frame gone */ } }
    var name = typeof m.filename === 'string' ? m.filename.trim() : '';
    if (!name || name.length > 200 || m.data === undefined || m.data === null) { reply(false, 'bad_request'); return; }
    cap('downloads').then(function (dl) {
      if (!dl) throw { code: 'unavailable' };
      return dl.save({ filename: m.filename, data: m.data });
    }).then(function () { reply(true); }, function (err) { reply(false, (err && err.code) || 'unavailable'); });
  }
  addEventListener('message', function (e) {
    var m = e.data;
    if (e.origin !== location.origin || !isPlainObject(m) || typeof m.hub !== 'string') return;
    var own = Object.keys(frames).some(function (k) { return frames[k].contentWindow === e.source; });
    if (!own) return;
    if (m.hub === 'db') { onDb(m, e.source); return; }
    if (m.hub === 'open') {
      if (!OPENABLE[m.tool]) return;
      var hash = typeof m.hash === 'string' ? m.hash.replace(/[^\w=&%.\-]/g, '') : '';
      var path = srcOf(m.tool) + (hash ? '#' + hash : '');
      if (frames[m.tool]) {
        // replace(): a new hash in an open tab must not add a frame entry to Back/forward on top of the hub's own entry.
        try { frames[m.tool].contentWindow.location.replace(new URL(path, location.href).href); } catch (err) { frames[m.tool].src = path; }
      } else nextSrc[m.tool] = path;
      send({ type: 'select', tool: m.tool }, { push: true });
      return;
    }
    if (m.hub === 'ping') { cap('downloads').then(function (dl) { try { e.source.postMessage({ hub: 'pong', downloads: !!dl }, location.origin); } catch (err) { /* frame gone */ } }); return; }
    if (m.hub === 'download') onDownload(m, e.source);
  });

  // The bar's height changes with the window, with the team button appearing, and with fonts loading: keep the frame under it.
  if (typeof ResizeObserver === 'function') new ResizeObserver(placeFrame).observe(bar);
  else addEventListener('resize', placeFrame);

  canEdit().then(function (ok) { send({ type: 'access', access: ok === null ? 'local' : ok ? 'editor' : 'viewer' }); });

  var start = histTool();
  if (!start) { try { start = sessionStorage.getItem('hubTool'); } catch (e) { start = null; } }

  writeHist(S.pending || S.tool, false);

  /* AX: read the state without scraping the page; drive it with the same events the buttons send. */
  window.HFTPHub = {
    state: function () { return { tool: S.tool, access: S.access, pending: S.pending, frames: Object.keys(frames), capabilities: Object.assign({}, capState) }; },
    send: function (ev) { return send(ev, { push: true }); },
    tools: HUB_TOOLS.slice(),
    next: hubNext
  };
})();
