<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HFTP Tool Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1f22; --muted: #5d6168;
    --line: #dcd9d1; --accent: #1f5f5b; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181b; --surface: #1f2226; --ink: #ecebe7; --muted: #a3a7ad;
      --line: #33373c; --accent: #6fb3ad; --accent-ink: #0f1112;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 "IBM Plex Sans", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 400; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a {
    padding: 6px 12px; border-radius: 6px; color: var(--ink); text-decoration: none;
    border: 1px solid transparent; font-weight: 500;
  }
  nav a:hover { border-color: var(--line); }
  nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
  .open { margin-left: auto; color: var(--muted); font-size: 13px; }
  .open a { color: inherit; }
  main { flex: 1; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .home { max-width: 860px; margin: 0 auto; padding: 32px 16px; }
  .home p.lead { color: var(--muted); margin-top: 0; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card {
    display: block; padding: 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: inherit; text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card small { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .note { margin-top: 24px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>HFTP tools <span>· SBP Group 36</span></h1>
  <nav id="nav">
    <a href="#home">Home</a>
    <a href="#assessment">AI Assessment</a>
    <a href="#use-case-catalogue">Use-Case Catalogue</a>
    <a href="#readiness">Readiness Tool</a>
  </nav>
  <div class="open" id="open"></div>
</header>
<main id="main"></main>

<template id="home-tpl">
  <div class="home">
    <p class="lead">The team's three working tools, kept as separate sections for now. Each one lives in its own folder under <code>tools/</code> and can be edited on its own.</p>
    <div class="cards">
      <a class="card" href="#assessment">
        <h2>AI Assessment Tool</h2>
        <p>Score each interviewed company on the 8 framework categories and get a LOW / MEDIUM / HIGH bucket.</p>
        <small>tools/assessment/</small>
      </a>
      <a class="card" href="#use-case-catalogue">
        <h2>Hotel AI Use-Case Catalogue</h2>
        <p>D4: use cases by department, how AI handles each task, adoption levels, gaps and example vendors.</p>
        <small>tools/use-case-catalogue/</small>
      </a>
      <a class="card" href="#readiness">
        <h2>Hotel AI Readiness Tool</h2>
        <p>D4 × D6: resources each use case needs and a readiness check (build foundations, pilot or scale).</p>
        <small>tools/readiness/</small>
      </a>
    </div>
    <p class="note">The live AI Assessment Tool with the team's saved interviews runs on claude.ai (Alexis's artifact). Here it opens without storage, so it shows the interface but does not save interviews.</p>
  </div>
</template>

<script>
  const TOOLS = {
    "assessment": "AI Assessment",
    "use-case-catalogue": "Use-Case Catalogue",
    "readiness": "Readiness Tool"
  };
  function route() {
    const id = location.hash.slice(1) || "home";
    const main = document.getElementById("main");
    const open = document.getElementById("open");
    document.querySelectorAll("#nav a").forEach(a => {
      if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (TOOLS[id]) {
      main.innerHTML = "";
      const f = document.createElement("iframe");
      f.src = id + "/index.html";
      f.title = TOOLS[id];
      main.appendChild(f);
      open.innerHTML = '<a href="' + id + '/index.html" target="_blank" rel="noopener">Open in new tab</a>';
    } else {
      main.innerHTML = document.getElementById("home-tpl").innerHTML;
      open.innerHTML = "";
    }
  }
  addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
