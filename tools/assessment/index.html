<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Assessment Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a consulting-grade working tool. Summary first (filters, tiles, maturity-vs-strategy map),
   detail below (tables). The interview editor is a long form with a sticky score strip and a live result rail. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f1f4f8; --surface-3: #e5eaf0;
  --ink: #111826; --ink-2: #4a5465; --muted: #788294; --line: #e0e5ec; --line-2: #c9d0da;
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-wash: rgba(42,120,214,.08); --accent-wash-2: rgba(42,120,214,.16);
  --b-low: #86b6ef; --b-low-ink: #0b1a2e; --b-med: #2a78d6; --b-med-ink: #ffffff; --b-high: #104281; --b-high-ink: #ffffff;
  --b-none: #dce1e8; --b-none-ink: #4a5465;
  --ok: #0a7a0a; --ok-wash: rgba(12,163,12,.10); --warn: #855600; --warn-wash: rgba(250,178,25,.20); --crit: #bf2f2f; --crit-wash: rgba(208,59,59,.10);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px; --r-sm: 6px;
  --shadow: 0 1px 2px rgba(17,24,38,.05), 0 2px 8px rgba(17,24,38,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #161a21; --surface-2: #1b2028; --surface-3: #262c36;
    --ink: #eef1f5; --ink-2: #c3c9d3; --muted: #8b94a3; --line: #29303a; --line-2: #3a424e;
    --accent: #3987e5; --accent-ink: #9ec5f4; --accent-wash: rgba(57,135,229,.12); --accent-wash-2: rgba(57,135,229,.24);
    --b-low: #1c5cab; --b-low-ink: #ffffff; --b-med: #3987e5; --b-med-ink: #ffffff; --b-high: #9ec5f4; --b-high-ink: #0b1a2e;
    --b-none: #39414c; --b-none-ink: #c3c9d3;
    --ok: #4cc84c; --ok-wash: rgba(12,163,12,.18); --warn: #f2bf4f; --warn-wash: rgba(250,178,25,.16); --crit: #f08080; --crit-wash: rgba(208,59,59,.20);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #161a21; --surface-2: #1b2028; --surface-3: #262c36;
  --ink: #eef1f5; --ink-2: #c3c9d3; --muted: #8b94a3; --line: #29303a; --line-2: #3a424e;
  --accent: #3987e5; --accent-ink: #9ec5f4; --accent-wash: rgba(57,135,229,.12); --accent-wash-2: rgba(57,135,229,.24);
  --b-low: #1c5cab; --b-low-ink: #ffffff; --b-med: #3987e5; --b-med-ink: #ffffff; --b-high: #9ec5f4; --b-high-ink: #0b1a2e;
  --b-none: #39414c; --b-none-ink: #c3c9d3;
  --ok: #4cc84c; --ok-wash: rgba(12,163,12,.18); --warn: #f2bf4f; --warn-wash: rgba(250,178,25,.16); --crit: #f08080; --crit-wash: rgba(208,59,59,.20);
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 14.5px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 20px; padding: 10px 24px;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--b-high); color: var(--b-high-ink);
  font-weight: 700; font-size: 12px; letter-spacing: .03em; }
.brand b { display: block; font-size: 14px; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 6px 12px; border-radius: 7px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-wash); color: var(--accent-ink); }
.topbar .spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.who img { width: 24px; height: 24px; border-radius: 50%; }

/* buttons & inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--surface); font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; }
label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
input[type=text], input[type=date], input[type=url], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-2); }
.counter { font-size: 11.5px; color: var(--muted); text-align: right; }
.counter.full { color: var(--warn); }

/* page */
main { max-width: 1320px; margin: 0 auto; padding: 22px 24px 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head p { color: var(--ink-2); margin-top: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 0; flex-wrap: wrap; }
.card-b { padding: 14px 16px 16px; }

/* banners & toasts */
#banners:empty { display: none; }
#banners { max-width: 1320px; margin: 14px auto 0; padding: 0 24px; display: grid; gap: 8px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.banner.warn { background: var(--warn-wash); border-color: transparent; }
.banner.crit { background: var(--crit-wash); border-color: transparent; }
.banner.info { background: var(--accent-wash); border-color: transparent; }
.banner b { font-weight: 600; }
.banner .grow { flex: 1; }
#toasts { position: fixed; left: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-size: 13px; }
.toast .link { color: inherit; }

/* dialog */
.scrim { position: fixed; inset: 0; background: rgba(9,12,18,.45); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { width: min(520px, 100%); background: var(--surface); border-radius: 12px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog textarea { min-height: 200px; font-family: var(--mono); font-size: 12px; }

/* pills & chips */
.pill { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; min-width: 74px; height: 24px; padding: 0 10px; border-radius: 6px;
  font-weight: 700; font-size: 11.5px; letter-spacing: .06em; }
.pill.LOW { background: var(--b-low); color: var(--b-low-ink); }
.pill.MEDIUM { background: var(--b-med); color: var(--b-med-ink); }
.pill.HIGH { background: var(--b-high); color: var(--b-high-ink); }
.pill.NONE { background: var(--b-none); color: var(--b-none-ink); font-weight: 600; letter-spacing: 0; }
.pill.lg { height: 34px; min-width: 110px; font-size: 14px; border-radius: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 500;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-wash); color: var(--warn); }
.chip.ok { background: var(--ok-wash); color: var(--ok); }
.chip.crit { background: var(--crit-wash); color: var(--crit); }
.chip.info { background: var(--accent-wash); color: var(--accent-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* overview */
.filters { display: grid; grid-template-columns: minmax(180px, 2fr) repeat(4, minmax(120px, 1fr)) minmax(130px, 1fr) minmax(130px, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 16px; }
.filters label.f { font-size: 11.5px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); height: 34px; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; }
.tile .lbl { font-size: 12px; color: var(--ink-2); }
.tile .val { font-size: 26px; font-weight: 600; margin-top: 2px; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.mix { grid-column: span 2; }
.mixbar { display: flex; gap: 2px; height: 8px; margin: 10px 0 8px; }
.mixbar span { border-radius: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.12); font-size: 12.5px; min-width: 160px; z-index: 5; }
.tip b { font-size: 13.5px; }
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.t th button { all: unset; cursor: pointer; }
table.t th button:focus-visible { outline: 2px solid var(--accent); }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover { background: var(--surface-2); }
table.t tr.archived td { color: var(--muted); }
.cell-main { font-weight: 500; }
.cell-sub { font-size: 12px; color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; display: grid; gap: 12px; justify-items: center; color: var(--ink-2); }

/* editor */
.strip { position: sticky; top: 51px; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 16px; margin: -6px 0 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); flex-wrap: wrap; }
.strip .who-is { min-width: 180px; flex: 1; }
.strip .who-is b { display: block; font-size: 15px; }
.strip .bignum { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.strip .pillars { font-size: 12.5px; color: var(--ink-2); display: grid; }
.save { font-size: 12.5px; color: var(--muted); min-width: 120px; display: inline-flex; align-items: center; gap: 6px; }
.save.err { color: var(--crit); }
.save.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.pending::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.rail { position: sticky; top: 132px; display: grid; gap: 12px; }
fieldset.plain { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 16px; }
details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
details.sec > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.sec[open] > summary::before { transform: rotate(45deg); }
details.sec > summary .sum-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.sec-b { padding: 4px 18px 18px; display: grid; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fields .w2 { grid-column: span 2; }
.fields .w3 { grid-column: 1 / -1; }
.cat { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; background: var(--surface); }
.cat-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.cat-h .q { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.badge { text-align: right; min-width: 72px; }
.badge .v { font-size: 24px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.badge .s { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.badge.unset .v { color: var(--muted); }

/* range slider */
.range-wrap { padding: 2px 2px 0; }
input[type=range].lvl { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; cursor: pointer; display: block; }
input[type=range].lvl::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), var(--surface-3) var(--fill, 0%) 100%); }
input[type=range].lvl::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
input[type=range].lvl::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range].lvl::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; margin-top: -7px;
  background: var(--surface); border: 3px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
input[type=range].lvl::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
input[type=range].lvl.unset::-webkit-slider-thumb { opacity: 0; }
input[type=range].lvl.unset::-moz-range-thumb { opacity: 0; }
input[type=range].lvl.unset::-moz-range-progress { background: transparent; }
input[type=range].lvl:disabled { cursor: not-allowed; opacity: .7; }
.ticks { display: flex; justify-content: space-between; padding: 0 2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { width: 24px; text-align: center; }
.ticks span:first-child { text-align: left; }
.ticks span:last-child { text-align: right; }
.unset-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
ol.levels { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
button.lv { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 7px 10px;
  border-radius: 7px; border: 1px solid transparent; cursor: pointer; }
button.lv:hover { background: var(--surface-2); }
button.lv:focus-visible { outline: 2px solid var(--accent); }
button.lv.on { background: var(--accent-wash); border-color: var(--accent-wash-2); }
button.lv:disabled { cursor: default; }
.lv-score { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
button.lv.on .lv-score { color: var(--accent-ink); }
.lv-name { display: block; font-weight: 500; }
.lv-desc { display: block; font-size: 12.5px; color: var(--muted); }
.rule { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 7px; padding: 8px 10px; }
.note-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; gap: 2px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:disabled { cursor: not-allowed; }
.calc { font-size: 13px; padding: 8px 10px; border-radius: 7px; background: var(--surface-2); }
.calc.err { background: var(--crit-wash); color: var(--crit); }
.dept { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dept:last-child { border-bottom: 0; }
.seg.d button.on.live { background: var(--accent); color: #fff; }
.seg.d button.on.pilot { background: var(--accent-wash-2); color: var(--accent-ink); }
.quote { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 8px; }
.find { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* result rail */
.res .card-b { display: grid; gap: 14px; }
.res-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.res-num { font-size: 44px; font-weight: 700; line-height: 1; }
.res-num small { font-size: 15px; color: var(--muted); font-weight: 500; }
.pbar { display: grid; gap: 4px; }
.pbar .lab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }
.pbar .lab b { color: var(--ink); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.reqs { display: grid; gap: 10px; }
.req-g h4 { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); }
.req { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 12.5px; align-items: start; padding: 2px 0; }
.reason { font-size: 13px; line-height: 1.5; }
details.calcd summary { cursor: pointer; font-size: 12.5px; color: var(--accent-ink); }
details.calcd .lines { margin-top: 8px; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* company & framework */
.co-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
td.gap-hi { background: var(--warn-wash); }
.fw-cat { display: grid; gap: 8px; }
.fw-table td { vertical-align: top; }
.fw-edit input[type=number] { max-width: 110px; }
.fw-section { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }

@media (max-width: 1180px) {
  .editor { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .filters { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .filters .q { grid-column: 1 / -1; }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid2, .co-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  main { padding: 16px 16px 48px; }
  .topbar { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .fields, .find { grid-template-columns: minmax(0, 1fr); }
  .fields .w2 { grid-column: auto; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quote { grid-template-columns: minmax(0, 1fr); }
  .strip { top: 0; position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<header class="topbar">
  <a class="brand" href="#overview"><span class="mark" aria-hidden="true">AI</span><span><b>AI Assessment Tool</b><small>HFTP SBP &middot; Group 36</small></span></a>
  <nav class="nav" aria-label="Main">
    <a href="#overview" id="nav-overview">Overview</a>
    <a href="#framework" id="nav-framework">Framework</a>
  </nav>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <a class="btn primary" href="#new" id="btnNew">New interview</a>
</header>
<div id="banners" aria-live="polite"></div>
<main id="view"><div class="empty"><p>Loading assessments&hellip;</p></div></main>
<div id="toasts" aria-live="polite"></div>

<script>
/* AI Assessment Tool – scoring engine.
   Pure functions, no DOM. Shared by the page and the Node tests.
   All arithmetic runs in tenths (integers) so displayed numbers always add up. */
(function (root) {
  'use strict';

  var LEVEL_SCORES = [0, 2.5, 5, 7.5, 10];
  var BUCKETS = ['LOW', 'MEDIUM', 'HIGH'];
  var REQ_METRICS = ['liveDepts', 'spendPct', 'depth', 'strategy', 'maturity'];

  var DEFAULT_FRAMEWORK = {
    version: 1,
    note: 'Initial framework from the team whiteboard (6 Nov 2026)',
    pillarWeights: { maturity: 50, strategy: 50 },
    completenessMin: 3,
    thresholds: { medium: 4.0, high: 7.5 },
    requirements: {
      high: { liveDepts: 3, spendPct: 30, depth: 7.5, strategy: 5.0, maturity: null },
      medium: { liveDepts: 2, spendPct: 10, depth: null, strategy: null, maturity: null }
    },
    unknownPolicy: { high: 'fail', medium: 'flag' },
    zeroSpendScore: 0,
    spendingBands: [
      { key: 'lt5', min: 0, max: 5, score: 2.5 },
      { key: '5to10', min: 5, max: 10, score: 5 },
      { key: '10to25', min: 10, max: 25, score: 7.5 },
      { key: 'gte25', min: 25, max: null, score: 10 }
    ],
    pilotWeight: 0.5,
    departments: [
      { key: 'frontOffice', name: 'Front office' },
      { key: 'reservations', name: 'Reservations & distribution' },
      { key: 'revenue', name: 'Revenue management' },
      { key: 'salesMarketing', name: 'Sales & marketing' },
      { key: 'fnb', name: 'F&B' },
      { key: 'housekeeping', name: 'Housekeeping' },
      { key: 'maintenance', name: 'Maintenance' },
      { key: 'finance', name: 'Finance' },
      { key: 'hr', name: 'HR' }
    ],
    purposes: ['Profit-driven', 'Efficiency', 'Competitive pressure', 'Guest experience'],
    decisionMakers: ['CIO / IT', 'GM', 'Department head', 'Owner or asset manager', 'Brand', 'Management company'],
    categories: [
      {
        key: 'tech', pillar: 'maturity', type: 'levels', name: 'Tech foundation', weight: 1,
        question: 'How ready are the company’s systems to support AI?',
        levels: [
          { name: 'Old on-premises system', desc: 'Software on the hotel’s own servers; systems don’t share data; staff re-enter data by hand' },
          { name: 'Old and cloud, mostly separated', desc: 'Some cloud tools added, but the core is old; data moves by export or Excel' },
          { name: 'Mostly cloud, some connected', desc: 'Most software online; key systems linked (e.g. bookings into the property-management system), others not' },
          { name: 'Cloud systems with some APIs', desc: 'Systems with open connections; most data flows automatically; a new tool connects within weeks' },
          { name: 'Fully connected, easy AI plug-in', desc: 'Everything connected, often through one platform; a new AI tool plugs in within days' }
        ]
      },
      {
        key: 'spending', pillar: 'maturity', type: 'spending', name: 'AI spending', weight: 1,
        question: 'What share of the IT budget goes to AI?'
      },
      {
        key: 'span', pillar: 'maturity', type: 'span', name: 'Span across departments', weight: 1,
        question: 'In which departments is AI used?'
      },
      {
        key: 'depth', pillar: 'maturity', type: 'levels', name: 'Depth', weight: 1,
        question: 'How deeply is AI built into the work?',
        rule: 'Score the most advanced AI that is live in daily use; pilots don’t count.',
        levels: [
          { name: 'No AI', desc: 'No AI in use' },
          { name: 'Standalone tools', desc: 'Separate AI tools such as ChatGPT in a browser; results copied in by hand' },
          { name: 'AI built into existing software', desc: 'AI inside a system they already use, e.g. AI pricing in the revenue-management system' },
          { name: 'AI across systems', desc: 'AI connected to several systems; data passes between them automatically' },
          { name: 'Agentic', desc: 'AI agents carry out multi-step tasks across systems on their own; people supervise' }
        ]
      },
      {
        key: 'decision', pillar: 'strategy', type: 'levels', name: 'Decision-making', weight: 1,
        question: 'Who decides on AI, and how?',
        levels: [
          { name: 'Nobody', desc: 'No one decides; staff use tools on their own' },
          { name: 'Each department for itself', desc: 'Departments choose their own tools separately' },
          { name: 'One unplanned decision for all', desc: 'One person (e.g. GM or IT) decides for everyone, case by case, without a plan' },
          { name: 'One planned decision for all (GM/CIO)', desc: 'A named owner decides for everyone, following an AI plan' },
          { name: 'AI department', desc: 'A dedicated AI team: the CIO with representatives of the departments' }
        ]
      },
      {
        key: 'budgeting', pillar: 'strategy', type: 'levels', name: 'Budgeting', weight: 1,
        question: 'How is AI paid for?',
        levels: [
          { name: 'No budget for AI', desc: 'Nothing set aside for AI' },
          { name: 'Ad hoc, depends on needs', desc: 'Paid case by case from whichever budget has room' },
          { name: 'Annual dedicated budget for AI', desc: 'A fixed AI line in the yearly budget' },
          { name: 'Annual budget + multi-year plan', desc: 'AI investment planned beyond the current year' },
          { name: 'All of that + ROI tracked against budget', desc: 'Results are compared with what was spent' }
        ]
      },
      {
        key: 'training', pillar: 'strategy', type: 'levels', name: 'People training', weight: 1,
        question: 'How do staff learn to use AI?',
        levels: [
          { name: 'No training', desc: 'Staff get no help learning AI tools' },
          { name: 'Self-taught', desc: 'Staff learn tools on their own' },
          { name: 'Occasional training', desc: 'Sessions now and then, e.g. from the vendor at launch' },
          { name: 'Structured training', desc: 'A planned programme for the staff who use AI' },
          { name: 'New roles for AI', desc: 'Structured training plus roles created or hired for AI' }
        ]
      },
      {
        key: 'data', pillar: 'strategy', type: 'levels', name: 'Data & measurement', weight: 1,
        question: 'Is the data ready, and are AI results measured?',
        rule: 'When data and measurement are at different levels, score the level the weaker half supports and note the gap.',
        levels: [
          { name: 'No overview of data', desc: 'Nobody knows what data exists or where it sits' },
          { name: 'Data scattered across systems', desc: 'Data sits in separate systems and departments; pulled together by hand' },
          { name: 'Vague goals set for AI, not tracked', desc: 'AI tools have goals (“save time”) but no numbers are tracked' },
          { name: 'Clear data plan, some KPIs tracked', desc: 'A plan for connecting data; some KPIs measured' },
          { name: 'Unified data, KPIs monitored and relevant', desc: 'Data in one place (e.g. one guest profile); KPIs checked regularly and acted on' }
        ]
      }
    ]
  };

  // ---------- small helpers ----------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function toTenths(x) { return Math.round(x * 10 + 1e-9); }
  function round1(x) { return toTenths(x) / 10; }
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = typeof v === 'number' ? v : Number(String(v).replace(/['\s]/g, '').replace(',', '.'));
    return isFinite(n) ? n : null;
  }
  function intOrNull(v) { var n = num(v); return n === null ? null : Math.round(n); }
  function hasReq(v) { return v !== null && v !== undefined && v !== '' && isFinite(Number(v)); }
  function fmt1(x) { return x === null || x === undefined ? '–' : (Math.round(x * 10) / 10).toFixed(1); }
  function fmtScore(x) {
    if (x === null || x === undefined) return '–';
    var t = Math.round(x * 10) / 10;
    return (t % 1 === 0) ? String(t) : t.toFixed(1);
  }
  function fmtPct(p) {
    if (p === null || p === undefined) return '–';
    var t = Math.round(p * 10) / 10;
    return (t % 1 === 0 ? String(t) : t.toFixed(1)) + '%';
  }

  function sortedBands(fw) {
    return (fw.spendingBands || []).slice().sort(function (a, b) { return a.min - b.min; });
  }
  function bandLabel(b, bands) {
    if (b.min === 0 || b === bands[0]) return 'Above 0% and under ' + fmtPct(b.max);
    if (b.max === null || b.max === undefined) return fmtPct(b.min) + ' and above';
    return fmtPct(b.min) + ' to under ' + fmtPct(b.max);
  }
  function bandFor(pct, fw) {
    var bands = sortedBands(fw);
    for (var i = bands.length - 1; i >= 0; i--) { if (pct >= bands[i].min - 1e-9) return bands[i]; }
    return bands[0];
  }

  // ---------- category information ----------
  function levelInfo(raw) {
    if (raw && typeof raw.level === 'number' && raw.level >= 0 && raw.level <= 4 && raw.level % 1 === 0) {
      return { assessed: true, score: LEVEL_SCORES[raw.level], level: raw.level };
    }
    return { assessed: false };
  }

  function spendingInfo(raw, fw) {
    if (!raw || !raw.mode) return { assessed: false };
    var bands = sortedBands(fw);
    var pct;
    if (raw.mode === 'none') {
      pct = 0;
    } else if (raw.mode === 'amounts') {
      var it = num(raw.itBudget), ai = num(raw.aiSpend);
      if (it === null || ai === null) return { assessed: false, error: 'Enter both the IT budget and the AI spending.' };
      if (!(it > 0)) return { assessed: false, error: 'The IT budget must be above 0.' };
      if (ai < 0) return { assessed: false, error: 'AI spending cannot be negative.' };
      pct = round1(ai / it * 100);
    } else if (raw.mode === 'percent') {
      var p = num(raw.percent);
      if (p === null) return { assessed: false, error: 'Enter a percentage.' };
      if (p < 0 || p > 100) return { assessed: false, error: 'Enter a percentage between 0 and 100.' };
      pct = round1(p);
    } else if (raw.mode === 'range') {
      var band = null;
      for (var i = 0; i < bands.length; i++) if (bands[i].key === raw.range) band = bands[i];
      if (!band) return { assessed: false, error: 'Pick a range.' };
      return {
        assessed: true, exact: false, score: band.score, band: band,
        pctMin: band.min, pctMax: (band.max === null || band.max === undefined) ? null : band.max,
        label: bandLabel(band, bands) + ' (range given)'
      };
    } else {
      return { assessed: false };
    }
    if (pct === 0) {
      return { assessed: true, exact: true, pct: 0, pctMin: 0, pctMax: 0, score: fw.zeroSpendScore || 0, label: '0% (no AI spending)' };
    }
    var b = bandFor(pct, fw);
    var warn = pct > 100 ? 'AI spending is higher than the IT budget. Check the amounts.' : null;
    return { assessed: true, exact: true, pct: pct, pctMin: pct, pctMax: pct, score: b.score, band: b, label: fmtPct(pct), warning: warn };
  }

  function spanInfo(raw, fw) {
    if (!raw || !raw.mode) return { assessed: false };
    var total, live = 0, pilot = 0;
    if (raw.mode === 'list') {
      var d = raw.depts || {}, unset = 0, na = 0;
      for (var i = 0; i < fw.departments.length; i++) {
        var v = d[fw.departments[i].key];
        if (v === 'live') live++;
        else if (v === 'pilot') pilot++;
        else if (v === 'na') na++;
        else if (v !== 'none') unset++;
      }
      total = fw.departments.length - na;
      if (unset > 0) {
        return { assessed: false, live: live, pilot: pilot, total: total, unset: unset,
          error: unset + (unset === 1 ? ' department is' : ' departments are') + ' not marked yet.' };
      }
    } else if (raw.mode === 'manual') {
      total = intOrNull(raw.total); live = intOrNull(raw.live); pilot = intOrNull(raw.pilot) || 0;
      if (total === null || live === null) return { assessed: false, error: 'Enter the number of departments and how many use AI.' };
      if (live < 0 || pilot < 0) return { assessed: false, error: 'Numbers cannot be negative.' };
      if (live + pilot > total) return { assessed: false, error: 'Live plus pilot departments cannot exceed the total.' };
    } else {
      return { assessed: false };
    }
    if (!(total > 0)) return { assessed: false, live: live, pilot: pilot, total: total, error: 'At least one department must apply.' };
    var pw = typeof fw.pilotWeight === 'number' ? fw.pilotWeight : 0.5;
    var weighted = live + pw * pilot;
    var tenths = toTenths(weighted / total * 10);
    return {
      assessed: true, score: tenths / 10, live: live, pilot: pilot, total: total, weighted: weighted,
      coverage: Math.round(weighted / total * 100), liveCoverage: Math.round(live / total * 100)
    };
  }

  function categoryInfos(a, fw) {
    var cats = {}, scores = (a && a.scores) || {};
    for (var i = 0; i < fw.categories.length; i++) {
      var c = fw.categories[i], raw = scores[c.key], info;
      if (c.type === 'levels') info = levelInfo(raw);
      else if (c.type === 'spending') info = spendingInfo(raw, fw);
      else if (c.type === 'span') info = spanInfo(raw, fw);
      else info = { assessed: false };
      info.tenths = info.assessed ? toTenths(info.score) : null;
      cats[c.key] = info;
    }
    return cats;
  }

  // ---------- aggregation ----------
  function aggregate(cats, fw) {
    var pillars = {};
    ['maturity', 'strategy'].forEach(function (p) {
      var list = fw.categories.filter(function (c) { return c.pillar === p; });
      var assessed = list.filter(function (c) { return cats[c.key] && cats[c.key].assessed; });
      var wsum = 0, acc = 0;
      assessed.forEach(function (c) { var w = Number(c.weight) || 0; wsum += w; acc += w * cats[c.key].tenths; });
      var tenths = (assessed.length && wsum > 0) ? Math.round(acc / wsum + 1e-9) : null;
      var need = Math.min(Number(fw.completenessMin) || 1, list.length);
      pillars[p] = {
        tenths: tenths, score: tenths === null ? null : tenths / 10,
        assessedCount: assessed.length, total: list.length,
        complete: assessed.length >= need && tenths !== null,
        parts: assessed.map(function (c) { return { key: c.key, name: c.name, score: cats[c.key].tenths / 10, weight: Number(c.weight) || 0 }; })
      };
    });
    var wm = Number(fw.pillarWeights.maturity) || 0, ws = Number(fw.pillarWeights.strategy) || 0;
    var overallT = null;
    if (pillars.maturity.tenths !== null && pillars.strategy.tenths !== null && (wm + ws) > 0) {
      overallT = Math.round((wm * pillars.maturity.tenths + ws * pillars.strategy.tenths) / (wm + ws) + 1e-9);
    }
    var complete = pillars.maturity.complete && pillars.strategy.complete && overallT !== null;
    var assessedAll = fw.categories.every(function (c) { return cats[c.key] && cats[c.key].assessed; });
    var ev = {
      cats: cats, pillars: pillars,
      overallTenths: overallT, overall: overallT === null ? null : overallT / 10,
      complete: complete, partial: complete && !assessedAll,
      assessedCount: fw.categories.filter(function (c) { return cats[c.key] && cats[c.key].assessed; }).length,
      categoryCount: fw.categories.length
    };
    ev.classification = classify(ev, fw);
    return ev;
  }

  function evaluate(a, fw) { return aggregate(categoryInfos(a, fw), fw); }

  // ---------- requirements & buckets ----------
  function reqLabel(metric, value) {
    switch (metric) {
      case 'liveDepts': return 'AI live in at least ' + value + ' department' + (Number(value) === 1 ? '' : 's');
      case 'spendPct': return 'At least ' + fmtPct(Number(value)) + ' of IT budget on AI';
      case 'depth': return 'Depth at least ' + fmtScore(Number(value));
      case 'strategy': return 'Strategy at least ' + fmt1(Number(value));
      case 'maturity': return 'Maturity at least ' + fmt1(Number(value));
    }
    return metric;
  }

  function checkReq(metric, req, ev) {
    var c = { metric: metric, required: req, label: reqLabel(metric, req), status: 'unknown', actual: null };
    var cats = ev.cats;
    if (metric === 'liveDepts') {
      var sp = cats.span;
      if (sp && sp.assessed) { c.actual = sp.live; c.status = sp.live >= req ? 'met' : 'not_met'; }
    } else if (metric === 'spendPct') {
      var s = cats.spending;
      if (s && s.assessed) {
        if (s.exact) { c.actual = s.pct; c.status = toTenths(s.pct) >= toTenths(req) ? 'met' : 'not_met'; }
        else {
          c.actual = s.label;
          if (s.pctMin >= req) c.status = 'met';
          else if (s.pctMax !== null && s.pctMax <= req) c.status = 'not_met';
          else c.status = 'unknown';
          c.range = true;
        }
      }
    } else if (metric === 'depth') {
      var d = cats.depth;
      if (d && d.assessed) { c.actual = d.score; c.status = d.tenths >= toTenths(req) ? 'met' : 'not_met'; }
    } else if (metric === 'strategy' || metric === 'maturity') {
      var p = ev.pillars[metric];
      if (p && p.tenths !== null) { c.actual = p.score; c.status = p.tenths >= toTenths(req) ? 'met' : 'not_met'; }
    }
    return c;
  }

  function describeFailure(c, bucket) {
    var need = bucket + ' needs ';
    switch (c.metric) {
      case 'liveDepts':
        if (c.status === 'unknown') return 'the departments using AI were not recorded (' + need + c.required + ')';
        return 'AI is live in only ' + c.actual + ' department' + (c.actual === 1 ? '' : 's') + '; ' + need + c.required;
      case 'spendPct':
        if (c.status === 'unknown' && c.range) return 'AI spending was given only as “' + String(c.actual).replace(' (range given)', '') + '”, which does not confirm ' + fmtPct(c.required) + ' (' + bucket + ' requirement)';
        if (c.status === 'unknown') return 'AI spending was not disclosed (' + need + 'at least ' + fmtPct(c.required) + ')';
        if (c.range) return 'AI spending is “' + String(c.actual).replace(' (range given)', '') + '”; ' + need + fmtPct(c.required);
        return 'only ' + fmtPct(c.actual) + ' of the IT budget goes to AI; ' + need + fmtPct(c.required);
      case 'depth':
        if (c.status === 'unknown') return 'Depth was not scored (' + need + 'at least ' + fmtScore(c.required) + ')';
        return 'Depth is ' + fmtScore(c.actual) + '; ' + need + 'at least ' + fmtScore(c.required);
      case 'strategy':
      case 'maturity':
        var nm = c.metric === 'strategy' ? 'Strategy' : 'Maturity';
        if (c.status === 'unknown') return nm + ' could not be scored (' + need + 'at least ' + fmt1(c.required) + ')';
        return nm + ' is ' + fmt1(c.actual) + '; ' + need + 'at least ' + fmt1(c.required);
    }
    return c.label;
  }

  function classify(ev, fw) {
    if (!ev.complete || ev.overallTenths === null) {
      var missing = [];
      ['maturity', 'strategy'].forEach(function (p) {
        var pl = ev.pillars[p];
        if (!pl.complete) missing.push((p === 'maturity' ? 'Maturity' : 'Strategy') + ' has ' + pl.assessedCount + ' of ' + pl.total + ' categories scored');
      });
      var need = Math.min(Number(fw.completenessMin) || 1, 4);
      return {
        status: 'incomplete', provisional: null, final: null, unverified: false, trail: [],
        reason: 'Not classified yet: ' + missing.join('; ') + '. Each pillar needs at least ' + need + '.'
      };
    }
    var o = ev.overallTenths;
    var prov = o >= toTenths(fw.thresholds.high) ? 'HIGH' : (o >= toTenths(fw.thresholds.medium) ? 'MEDIUM' : 'LOW');
    var idx = BUCKETS.indexOf(prov), trail = [];
    var policy = fw.unknownPolicy || { high: 'fail', medium: 'flag' };
    while (idx > 0) {
      var b = BUCKETS[idx], reqs = (fw.requirements && fw.requirements[b.toLowerCase()]) || {};
      var checks = REQ_METRICS.filter(function (m) { return hasReq(reqs[m]); })
        .map(function (m) { return checkReq(m, Number(reqs[m]), ev); });
      var unknownFails = policy[b.toLowerCase()] === 'fail';
      var failed = checks.filter(function (c) { return c.status === 'not_met' || (c.status === 'unknown' && unknownFails); });
      trail.push({ bucket: b, checks: checks, failed: failed });
      if (!failed.length) break;
      idx--;
    }
    var final = BUCKETS[idx];
    var finalStep = null;
    for (var i = 0; i < trail.length; i++) if (trail[i].bucket === final) finalStep = trail[i];
    var unverifiedChecks = finalStep ? finalStep.checks.filter(function (c) { return c.status === 'unknown'; }) : [];
    var unverified = unverifiedChecks.length > 0;
    var score = fmt1(ev.overall), reason;
    if (final === prov) {
      if (final === 'LOW') reason = 'Scored ' + score + ', below the MEDIUM threshold of ' + fmt1(fw.thresholds.medium) + '.';
      else reason = 'Scored ' + score + ' (' + final + ' range) and meets all ' + final + ' requirements.';
    } else {
      var parts = [];
      trail.forEach(function (t) {
        if (t.failed.length) parts.push(t.failed.map(function (c) { return describeFailure(c, t.bucket); }).join('; '));
      });
      reason = 'Scored ' + score + ' (' + prov + ' range), but ' + parts.join('; and ') + '.';
      reason = reason.charAt(0).toUpperCase() + reason.slice(1);
    }
    if (unverified) {
      reason += ' Not verified: ' + unverifiedChecks.map(function (c) {
        if (c.metric === 'spendPct') return c.range ? 'AI spending is only known as a range' : 'AI spending was not disclosed';
        if (c.metric === 'liveDepts') return 'departments using AI were not recorded';
        return c.label.toLowerCase() + ' could not be checked';
      }).join('; ') + '.';
    }
    return {
      status: unverified ? 'unverified' : 'classified', provisional: prov, final: final,
      downgraded: final !== prov, unverified: unverified, trail: trail, reason: reason,
      finalChecks: finalStep ? finalStep.checks : []
    };
  }

  // ---------- combined company view ----------
  function combine(items, fw) {
    // items: [{ a, ev }] already evaluated under their own framework versions
    var cats = {};
    fw.categories.forEach(function (c) {
      var assessed = items.map(function (it) { return it.ev.cats[c.key]; }).filter(function (x) { return x && x.assessed; });
      if (!assessed.length) { cats[c.key] = { assessed: false, tenths: null }; return; }
      var t = Math.round(assessed.reduce(function (s, x) { return s + x.tenths; }, 0) / assessed.length + 1e-9);
      var info = { assessed: true, tenths: t, score: t / 10, n: assessed.length };
      var vals = assessed.map(function (x) { return x.tenths; });
      info.gap = (Math.max.apply(null, vals) - Math.min.apply(null, vals)) / 10;
      if (c.type === 'span') {
