}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding-block:26px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:2.125rem;line-height:1.08;margin:0;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-size:1.375rem;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:600}
p{margin:0}
ul,ol{margin:0}
.sub{color:var(--ink2);max-width:66ch}
.meta{font-size:0.875rem;color:var(--ink3);max-width:68ch}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-size:0.9375rem;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.warn{border-color:var(--lo);color:var(--lo)}
.btn:active,.opt:active,.tile:active{transform:translateY(1px);filter:brightness(.96)}
.linkbtn{border:none;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;text-align:left;font:inherit;min-height:44px;display:inline-flex;align-items:center}
#view{display:flex;flex-direction:column;gap:18px}
#view:focus{outline:none}

/* header */
.hdr{display:flex;flex-direction:column;gap:6px}
.hdrtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdrline{font-size:0.9375rem;color:var(--ink2);min-width:0}
.hdrline strong{color:var(--ink)}
.honest{margin-top:2px;max-width:66ch}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.steps3 span{height:5px;border-radius:3px;background:var(--line)}
.steps3 span.done{background:var(--accent)}
.steps3 span.now{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}

/* start screen */
.journey{list-style:none;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:j}
.journey li{display:grid;grid-template-columns:2.25rem minmax(0,1fr);gap:2px 10px;padding:12px 0;border-top:1px solid var(--line2);counter-increment:j}
.journey li:first-child{border-top:0;padding-top:0}
.journey li::before{content:counter(j);grid-row:1/3;font-family:var(--display);font-size:1.5rem;font-weight:700;color:var(--accent);line-height:1.1}
.journey b{font-weight:600}
.journey span{color:var(--ink2);font-size:0.9375rem}

/* questions */
.stephead{display:flex;flex-direction:column;gap:4px}
.kicker{font-size:0.8125rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.qa{border:0;border-top:1px solid var(--line2);padding:16px 0 6px;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.qa:first-of-type{border-top:0;padding-top:0}
.qa legend{font-weight:400;padding:0;float:left;width:100%}
.qa legend + *{clear:both}
.qrow{display:grid;grid-template-columns:1.75rem minmax(0,1fr);gap:0 8px}
.qno{font-family:var(--display);font-weight:700;font-size:1.125rem;color:var(--accent);line-height:1.35}
.qtext{font-size:1.125rem;font-weight:600;line-height:1.35}
.qhint{font-size:0.9375rem;color:var(--ink2);max-width:66ch}
.qbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--ctl);border-radius:6px;padding:5px 13px;cursor:pointer;font-weight:500;font-size:0.9375rem;background:var(--panel);position:relative;min-height:44px;display:inline-flex;align-items:center}
.opt.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.opt.on::before{content:"\2713\00a0";font-weight:700}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.missing{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.needline{color:var(--accent);font-weight:600;font-size:0.9375rem}
.rc{font-family:var(--mono);font-size:0.75rem;color:var(--ink3);white-space:nowrap}
.keytag{display:inline-block;font-size:0.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px;vertical-align:2px;white-space:nowrap}
.byfield{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:0.9375rem}
.byfield input[type=date]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--ctl);border-radius:6px;padding:8px 10px;min-height:44px;max-width:14rem}
.byfield .meta{flex-basis:100%}

/* folded explanations */
details.more{font-size:0.9375rem}
details.more > summary{cursor:pointer;color:var(--accent);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px;min-height:44px;width:max-content;max-width:100%}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"\25B8";display:inline-block;width:1em;transition:transform .15s}
details.more[open] > summary::before{transform:rotate(90deg)}
.morebody{display:flex;flex-direction:column;gap:8px;padding:2px 0 6px 1.25em;border-left:2px solid var(--line);margin-left:.35em;max-width:70ch}
.morebody p,.morebody li{color:var(--ink2)}
.morebody b{color:var(--ink);font-weight:600}
.morebody ul{padding-left:18px;display:flex;flex-direction:column;gap:3px}
.ev{font-size:0.875rem}
.ev .src{display:block;color:var(--ink3);font-size:0.8125rem}
.sources ul{padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:0.875rem;color:var(--ink2)}

/* verdicts */
.verdict{border-width:0 0 0 6px;border-style:solid;border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px}
.verdict.v-stop{background:var(--lo-s);border-color:var(--lo)}
.verdict.v-hold{background:var(--md-s);border-color:var(--md)}
.verdict.v-open{background:var(--accent-soft);border-color:var(--accent)}
.verdict.v-go{background:var(--hi-s);border-color:var(--hi)}
.vsent{font-family:var(--display);font-size:1.625rem;line-height:1.18;font-weight:700;max-width:32ch;text-wrap:balance}
.verdict ul{padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.stopcard{padding:28px 24px}
.stopcard h1{font-size:2.5rem}
.stopcard p{font-size:1.0625rem;max-width:60ch}

/* 1b: where in the hotel */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--ctl);border-radius:8px;background:var(--panel);padding:12px 14px;cursor:pointer;min-height:44px}
.tile:hover{border-color:var(--accent)}
.tile b{font-weight:600}
.tile span{font-size:0.8125rem;color:var(--ink3)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"] span{color:var(--ink2)}
.ucs{display:flex;flex-direction:column}
.uc{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 12px;padding:12px 4px;border-top:1px solid var(--line2);cursor:pointer;align-items:start}
.uc:first-child{border-top:0}
.uc input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.ucbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.uc .ucn{font-weight:600}
.uc .uct{font-size:0.9375rem;color:var(--ink2)}
.uc .ucm{font-size:0.8125rem;color:var(--ink3);display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center}
.uc.on{background:var(--accent-soft);border-radius:6px}
.uc .ucm a{min-height:44px;display:inline-flex;align-items:center}
.lvl{font-weight:600;color:var(--ink2)}
.nonefits{border-top:1px dashed var(--ctl);margin-top:4px}
.pathline{font-size:0.9375rem;color:var(--ink2)}
.pathline b{color:var(--ink)}

/* nav */
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.navrow .spacer{flex:1}
.confirmline{display:flex;flex-direction:column;gap:8px;border:1px solid var(--lo);border-radius:6px;padding:12px 14px;background:var(--panel)}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.countline{font-size:1.0625rem;font-weight:500}
.countline b{font-variant-numeric:tabular-nums}
.first ol{padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.first li span{display:block;font-size:0.875rem;color:var(--ink3)}
.todo{display:flex;flex-direction:column}
.todo .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:9px 0;border-top:1px solid var(--line2);align-items:start}
.todo .row:first-child{border-top:0}
.todo .who{font-size:0.8125rem;color:var(--ink3);white-space:nowrap;text-align:right}
.todo .nm{font-size:0.8125rem;color:var(--ink3);display:block}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:4px;font-size:0.75rem;font-weight:600;white-space:nowrap;line-height:1.55}
.a-n,.a-p{background:var(--lo-s);color:var(--lo)} .a-k{background:var(--accent-soft);color:var(--accent)} .a-pl{background:var(--md-s);color:var(--md)}
.handover{border-left:3px solid var(--accent)}
.copybox textarea{font:0.875rem/1.45 var(--mono);width:100%;min-height:220px;padding:10px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);color:var(--ink)}
.printhead{display:none}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:6px;font-size:0.875rem;max-width:min(92vw,560px);z-index:20}
.foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}

@media (max-width:760px){
  h1{font-size:1.75rem}
  .wrap{padding-block:14px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panel{padding:16px}
  .vsent{font-size:1.375rem}
  .stopcard{padding:22px 18px}
  .stopcard h1{font-size:2rem}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .navrow{flex-direction:column;align-items:stretch}
  .navrow .spacer{display:none}
  .navrow .btn{width:100%}
  .navrow .btn.back{border:0;background:none;color:var(--accent);text-decoration:underline;justify-content:flex-start;padding-left:0;font-weight:500;width:auto}
  .navrow .btn.back::before{content:"\2039\00a0"}
  .todo .row{grid-template-columns:minmax(0,1fr)}
  .todo .who{text-align:left}
  .qrow{grid-template-columns:1.375rem minmax(0,1fr)}
}
@media (prefers-reduced-motion: no-preference){ .btn,.opt,.tile{transition:background-color .12s,border-color .12s,color .12s} }

/* print: the summary only, on white, nothing to press */
@media print{
  :root{--bg:#fff;--panel:#fff;--ink:#000;--ink2:#222;--ink3:#444;--line:#bbb;--line2:#ddd}
  body{background:#fff;font-size:11pt}

  .printhead{display:block}
  .panel{border:1px solid #bbb;break-inside:avoid;padding:12px}
  .verdict{border-left-width:4px;background:#fff!important}
  a{color:#000;text-decoration:none}
}
/* one-line header: "Start again" stays beside the step line on phones; the step line wraps instead */
.hdrtop{flex-wrap:nowrap;align-items:flex-start}
.hdrtop .linkbtn{flex:none;white-space:nowrap;min-height:44px;margin-top:-11px}
@media (max-width:760px){ .hdrline{font-size:0.875rem} }

ages are translated between languages; also live translation and captioning for guests and staff","use":"Low"},{"id":"hk-2","n":"Autonomous cleaning robots (floor care)","task":"Autonomous vacuum and floor-care robots for corridors, public areas and rooms","use":"Low"},{"id":"hk-3","n":"Linen and amenity forecasting / RFID linen tracking","task":"Tracks towels, sheets and uniforms through laundry with RFID; forecasts par levels and linen demand","use":"Low"},{"id":"hk-4","n":"Occupancy-sensor driven cleaning and room status","task":"Uses door-lock, occupancy and IoT sensor data to infer vacated rooms, DND/MUR status or needs-based cleaning of public areas; the same room sensors can flag noise, smoking or unauthorised parties; caution: in the US, in-room smoking and vape sensors have led to disputed fees charged to guests who say they never smoked. Most of these sensors work on thresholds or a vendor algorithm, not AI. No lawsuit or regulator action, and no European hotel billing guests this way, was found (checked 20 Nov 2026); a sensor alert should start a check by staff, not a charge","use":"Very low"},{"id":"hk-5","n":"Room inspection with computer vision","task":"Analyses photos of cleaned rooms to flag defects and missing amenities and confirm check-in readiness","use":"Very low"},{"id":"hk-6","n":"Room-cleaning prioritisation, assignment and workload optimisation","task":"Builds the daily cleaning plan from PMS data, predicts each clean's duration, assigns and sequences rooms, re-plans on DND/late check-out; report each attendant's minutes per room against the standard","use":"Medium"},{"id":"hk-7","n":"Bed-bug monitoring sensors with image recognition","task":"A sensor pod under the mattress or by the bed draws insects in and photographs whatever enters; image recognition decides whether it is a bed bug and sends the hotel the room number and the photo. The AI step is classifying the photographed insect. Results so far are measured by the vendor, and no independent test of the classifier was found","use":"Low"}]},{"id":"me","name":"Maintenance & Engineering","cat":"Operational","uses":[{"id":"me-1","n":"AI HVAC / BMS optimisation and energy analytics (central plant)","task":"AI layer reads BMS data and adjusts plant setpoints and schedules; anomaly detection and recommissioning to cut energy; group-wide platforms forecast each hotel's energy and water use and track actual use against the forecast","use":"Medium"},{"id":"me-2","n":"Work-order triage, creation and asset register","task":"Turns photos, voice or chat into structured work orders, predicts due times, builds the asset register from equipment photos; for the asset register, engineers photograph equipment and its nameplate and AI fills in the record (one vendor, launched 2026, no hotel named)","use":"Low"},{"id":"me-3","n":"Digital twins","task":"Calibrated virtual hotel model predicts energy and water demand, simulates control strategies, supports predictive maintenance","use":"Very low"},{"id":"me-4","n":"Guest-room energy management (occupancy-based HVAC/lighting)","task":"Detects unoccupied rooms and sets back HVAC/lights; pre-conditions rooms from PMS check-in data","use":"Very low"},{"id":"me-5","n":"Predictive maintenance - OEM-connected equipment (lifts, escalators, doors)","task":"OEM remote monitoring predicts faults before breakdown and dispatches technicians","use":"Low"},{"id":"me-6","n":"Predictive maintenance - hotel-run across assets (HVAC, kitchen, technical devices)","task":"Predict faults across hotel equipment from sensor and ticket history to move from reactive to planned work (announced only)","use":"Very low"},{"id":"me-7","n":"Water leak and fault detection","task":"Analyses water-meter or fixture data to detect leaks and abnormal consumption and alert engineering","use":"Very low"}]},{"id":"kc","name":"Kitchen & Culinary Operations","cat":"Operational","uses":[{"id":"kc-1","n":"Food-waste measurement with computer vision","task":"Camera at impersonates OTAs before stays are confirmed or payments captured","use":"Very low"},{"id":"it-4","n":"Physical security video analytics","task":"Detect intrusion, loitering, incidents and occupancy from CCTV; biometric uses constrained by GDPR and AI Act; also weapon detection on cameras and drowning alerts at pools; the same cameras can count people in queues and busy areas (front desk, breakfast, pool) without identifying anyone; for pool drowning detection, published research does not yet show reliability in live pools, and no European hotel deployment was verified (the opened examples are public pools)","use":"Very low"},{"id":"it-5","n":"AI network operations for guest and staff Wi-Fi","task":"AI watches the wired and wireless network, detects anomalies and fixes or flags them before guests notice","use":"Low"}]},{"id":"lg","name":"Legal, Compliance & ESG","cat":"Administrative","uses":[{"id":"lg-1","n":"ESG / carbon data collection and reporting","task":"Collect energy, water, waste and emissions data across properties, benchmark, and produce sustainability and regulatory reports","use":"Low"},{"id":"lg-2","n":"GDPR / data-request handling and AI Act compliance tooling","task":"Map guest data, manage consent, run privacy impact assessments, govern third-party AI models","use":"Very low"},{"id":"lg-3","n":"GenAI contract review and legal assistance","task":"Review vendor and supplier contracts, flag non-standard clauses, monitor regulatory changes","use":"Very low"},{"id":"lg-4","n":"AI use policies and governance","task":"Set the rules for how staff may use AI, with oversight bodies and works-council agreements; a new task created by AI rather than a task AI does","use":"Low","notTool":true}]}],"nDepts":15,"nUses":99},"builtOn":"2026-11-23"}</script>
<script>
/* Readiness 2.0: every word a hotel reads about the questions, the prerequisites and the success factors.

(function (root) {

  var QUESTIONS = [
    { id: 'q1', short: 'Needs judgement, not fixed rules',

      why: 'Software that only follows rules written by people is not AI, and a simpler tool is cheaper, easier to explain and easier to fix.',
      yes: 'Reading guest emails in five languages and drafting replies.',
      no: 'Sending a pre-arrival email three days before arrival, or alerting when a room is not cleaned by 14:00.',
      outcome: 'Not an AI problem: rules or ordinary automation will do it.',
      who: 'the vendor or IT' },
    { id: 'q2', short: 'Worth real money or hours',
      q: 'Does the job come up often enough, or cost enough, that doing it better would be worth real money or staff hours every month?',
      hint: '',
      why: 'AI tools have set-up, subscription, checking and training costs. A rare or small task seldom repays them.',
      yes: 'About 400 guest emails a week at front office.',
      no: 'A 12-room guesthouse with 10 email enquiries a week.',
      outcome: 'Probably not worth it.', add: 'Look again if the volume grows, or if a tool you already pay for adds it.',
      who: 'the GM or finance' },
    { id: 'q3', short: 'Information is digital and current',
      q: 'Is the information the tool needs already kept somewhere digital and up to date?',
      hint: 'Examples: bookings, past guest messages, rates, your hotel’s facts and menus.',
      why: 'If the facts sit on paper, in one person’s head or in five systems that disagree, the tool gives wrong answers with confidence.',
      yes: 'One up-to-date fact sheet (rooms, hours, policies) for a guest chatbot.',
      no: 'Allergen information only in the chef’s binder.',
      outcome: 'Fix the data first.', add: 'Put the facts in one place and name who keeps them right. Then ask again.',
      who: 'IT or the department head' },
    { id: 'q4', short: 'Mistakes can be caught',
      q: 'If the tool gets it wrong now and then, can the mistake be spotted and put right before it hurts a guest, a staff member or the hotel?',
      hint: '',
      why: 'AI works on probabilities, so it is never right every time. Where a mistake would be costly, unsafe or unfair, AI can still help, but only as a draft a person checks.',
      yes: 'Draft replies to reviews that a manager approves before they go out.',
      no: 'Answering guests’ allergen questions on its own.',
      outcome: 'AI as an assistant only: a person checks every result before it counts.',
      add: 'If the use touches safety, health or people’s rights (hiring, staff evaluation), check the AI Act guide tab: it may be high-risk.',

      why: 'Without a starting figure nobody can tell whether the tool worked, and the decision to keep or stop it turns into opinion.',
      yes: '“Average reply time to email enquiries: 9 hours today; target under 1 hour.”',

      outcome: 'Define success first.', add: 'Write down the number and today’s figure, then come back.',
      who: 'the GM' }
  ];

  var STOP = {
    head: 'This is not an AI problem.',
    why: 'The job follows rules a person can write down, so rules or ordinary automation will do it, and a simpler tool is cheaper, easier to explain and easier to fix.',

  var VERDICT = {
    stop: STOP.head,
    worth: 'Probably not worth it.',
    data: 'Fix the data first.',
    success: 'Define success first.',
    find: 'Find out first.',
    assist: 'Worth exploring, as an assistant only: a person checks every result before it counts.',
    go: 'Worth exploring with AI. Next: find where it sits in your hotel.',
    goDone: 'Worth exploring with AI.' // the same verdict on the summary, where "where it sits" is already answered

  /* ---------- Steps 2 and 3: answer scale (research D, same as the readiness check) ---------- */
  var ANSWERS = [['y', 'Yes'], ['pl', 'Planned, not done yet'], ['p', 'Partly'], ['n', 'No'], ['k', 'Don’t know yet']];

  /* ---------- Step 2: what you need to implement AI (research B) ----------
     Order on screen: B1, B3, B5, B8, B9 first (they match readiness-check must-haves), then B2, B4, B6, B7, B10.
     key: true for those five. also: further readiness-check questions on the same point (shown folded). */
  var NEEDS = [
    { id: 'b1', key: true, name: 'Systems that can talk to each other',
      plain: 'The AI tool must read from and write back to your booking system (PMS) and other software, or staff end up copying data by hand.',

      check: 'Has it been confirmed in writing that the tool can read from and write back to your hotel systems?', rc: 'T1',
      also: [['T4', 'Do you have a written list of the software your hotel uses that shows which ones share data?']],
      ev: [['45.91% of EU accommodation businesses that had considered AI but did not use it named incompatibility with their existing equipment, software or systems as a reason.', 'Eurostat, ICT usage survey, early 2025 (dataset isoc_eb_ain2). Base: EU accommodation enterprises with 10+ persons employed.'],
           ['29% of hotel company leaders named systems integration as a barrier to getting value from AI.', 'State of Hotel AI, Fall 2026. Base: 107 hotel company leaders, worldwide, Aug–Sep 2026.']],
      act: 'Ask the vendor to confirm in writing that the tool reads from and writes back to your PMS, and see it work on your own systems.', who: 'IT / vendor' },
    { id: 'b3', key: true, name: 'Data you can reach, trust and own',
      plain: 'The tool is only as good as the bookings, guest records and hotel facts it reads. Someone must keep them right, and the hotel must keep the rights to them.',
      good: 'You can name where each piece of data sits. One up-to-date source holds the hotel’s facts. A named person checks the data at set times. The contract says the data stays yours.',
      check: 'Can you name the system that holds each piece of data this tool needs?', rc: 'D1',
      also: [['D3', 'Does a named person check at set times that the data this tool uses is correct and up to date?']],
      ev: [['42.61% of EU accommodation businesses that had considered AI but did not use it named difficulties with the availability or quality of the data.', 'Eurostat, ICT usage survey, early 2025 (dataset isoc_eb_ain2). Base: EU accommodation enterprises with 10+ persons employed.'],
           ['42% of hotel company leaders were confident their data is ready for their AI goals; 48% were not.', 'State of Hotel AI, Fall 2026. Base: 107 hotel company leaders, worldwide, Aug–Sep 2026.']],
      act: 'List the systems that hold the data the tool needs, and name the person who checks that data at set times.', who: 'Department head / IT' },
    { id: 'b5', key: true, name: 'Data protection paperwork',
      plain: 'If the tool handles guest or staff data, the vendor works with that data for you. The GDPR requires a written contract with it, and your data protection contact must agree.',
      good: 'A signed data processing agreement (DPA) that covers instructions, security, sub-processors, returning or deleting data at the end, and whether the vendor may train on your data. A written OK from your data protection contact, and a data protection impact assessment (DPIA) where the risk is high.',
      check: 'Have you signed a data processing agreement with the vendor of this tool?', rc: 'D5a',
      also: [['D5b', 'Has your data protection contact confirmed in writing that you may use guest or staff data in this tool?'], ['G2s', 'Has a data protection impact assessment (DPIA) been done for this tool?']],
      ev: [['52.36% of EU accommodation businesses that had considered AI but did not use it named concerns about data protection and privacy.', 'Eurostat, ICT usage survey, early 2025 (dataset isoc_eb_ain2). Base: EU accommodation enterprises with 10+ persons employed.'],
           ['“Such legal act must be in writing, including in electronic form.” (on the contract between a hotel and a vendor that processes its personal data, GDPR Art. 28(3))', 'EDPB Guidelines 07/2020 on the concepts of controller and processor, version 2.1.']],
      act: 'Sign a data processing agreement with the vendor and get a written OK from your data protection contact.', who: 'GM / data protection contact' },
    { id: 'b8', key: true, name: 'A named owner with time',
      plain: 'Someone in the hotel is responsible for the tool. They watch the results, deal with the vendor and decide on changes, with hours set aside for it.',
      good: 'A named role with weekly hours written into a job description or the project plan.',

  function deptOf(cat, id) { return (cat && cat.depts || []).filter(function (d) { return d.id === id; })[0] || null; }

    var to = row[ev];

  function events(step, c) { return Object.keys(FLOW[step] || {}).filter(function (e) { return flowNext(step, e, c) !== null; }); }

  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }

    NEED_IDS.concat(FACTOR_IDS).forEach(function (id) { if (A_OK[A[id]]) o.A[id] = A[id]; });
    Object.keys(o.A).forEach(function (id) { if (o.A[id] === 'pl' && typeof By[id] === 'string' && DATE.test(By[id])) o.By[id] = By[id]; });
    o.cat = CATS.indexOf(r.cat) >= 0 ? r.cat : '';
    var d = deptOf(cat, r.dept); o.dept = d && d.cat === o.cat ? d.id : '';

  /* The only writer of the record. ev: 'answer' {id, value} | 'by' {id, date} | 'cat' name | 'dept' id | 'use' id or 'none'

        else return no;

  function confirmNext(c, ev) {

<script>
/* Readiness 2.0: the page. State machines and the record live in src/flow.js (R2Flow), rules in src/logic.js (R2Logic),

   rec = the record (saved in localStorage['hftp-readiness2-v1']); ui = what is on screen now, never saved:
     confirm  CONFIRM machine: null | 'restart'
     missing  after a refused "Next": the id of the first unanswered question ('where' on step 1b), outlined; else null
     copy     true while the copy box (clipboard fallback) is open
     open     which folded explanations are open (kept across re-renders) */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var C = window.R2Content, L = window.R2Logic, F = window.R2Flow;
  var D, CAT;
  try { D = JSON.parse($('r2-data').textContent); CAT = D.cat; }
  catch (e) { $('app').setAttribute('data-state', 'error'); $('view').innerHTML = '<p class="panel" role="alert">The catalogue data in this page could not be read. Reload the page; if this stays, tell the project team the page needs rebuilding.</p>'; throw e; }
  var USE = {}, DEPT = {};
  CAT.depts.forEach(function (d) { DEPT[d.id] = d; d.uses.forEach(function (u) { USE[u.id] = Object.assign({ dept: d }, u); }); });

      return false;

  }

    needs: ['Step 2 of 3', 'What you need'], success: ['Step 3 of 3', 'What makes it succeed'], summary: ['Summary', ''] };
  function header() {
    if (rec.step === 'start') {
      return '<div class="hdrtop"><p class="meta">A student project by EHL for HFTP · prototype</p></div><h1>Readiness 2.0</h1>' +
        '<p class="sub"><strong>Start here: is AI the answer, and where?</strong></p>' +
        '<p class="meta honest" id="honest">' + esc(C.HONEST) + '</p>';

    return '<div class="hdrtop"><p class="hdrline"><strong>Readiness 2.0</strong> · ' + esc(s[0]) + (s[1] ? ' · ' + esc(s[1]) : '') + '</p>' +

  }
  function sources(step) {
    var list = C.SOURCES[step] || [], note = C.SOURCES[step + 'Note'] || '';

    if (step === 'where') body = '<p>' + esc(note) + ' ' + esc(CAT.nUses + ' use cases in ' + CAT.nDepts + ' departments; page built ' + D.builtOn + '.') + '</p>';

  }

  }
  function radios(name, opts, cur) {
    return '<div class="opts" role="radiogroup" aria-labelledby="t-' + name + '">' + opts.map(function (o) {

    }).join('') + '</div>';
  }
  function needLine(id) { return ui.missing === id ? '<p class="needline" role="alert">Answer this to continue (“Don’t know yet” is fine).</p>' : ''; }

    return '<div class="navrow"><button type="button" class="btn back" data-act="back" id="back">' + esc(backLabel || 'Back') + '</button><span class="spacer"></span>' +

    return h;
  }

  // ---------- screens ----------
  function vStart() {
    return '<section class="panel"><h2>Three steps, then a summary</h2><ol class="journey">' +
      '<li><b>Where is the problem?</b><span>Five yes/no questions: is AI the right kind of tool for it? Then find where it sits in your hotel among ' + esc(CAT.nUses + ' use cases in ' + CAT.nDepts + ' departments') + '.</span></li>' +
      '<li><b>What you need to implement AI</b><span>Ten things every hotel needs in place, such as systems that can talk to each other and the data protection paperwork.</span></li>' +
      '<li><b>What makes it succeed</b><span>Nine factors, from budget and leadership to change management.</span></li></ol>' +
      '<p class="sub">The summary has no score. It shows what is in place, the three weakest points and what to do next. Your answers stay in this browser.</p>' +

  }

    h += '<section class="panel">' + C.QUESTIONS.map(function (q, i) {
      return '<fieldset class="qa' + (ui.missing === q.id ? ' missing' : '') + '" id="f-' + q.id + '" aria-labelledby="t-' + q.id + '"><div class="qrow"><span class="qno" aria-hidden="true">' + (i + 1) + '</span><div class="qbody">' +

        fold('why-' + q.id, 'Why we ask, and an example', '<p>' + esc(q.why) + '</p><p><b>Yes, for example:</b> ' + esc(q.yes) + '</p><p><b>No, for example:</b> ' + esc(q.no) + '</p>') +
        '</div></div></fieldset>';

  }

      '<p>' + esc(C.STOP.why) + '</p><p><strong>' + esc(C.STOP.instead) + '</strong></p>' +

      '<div class="btnrow"><button type="button" class="btn primary" data-act="change" id="change">Change my answers</button><button type="button" class="btn" data-act="restart" id="restart">Start again</button></div></section>' +

  }
  function vWhere() {
    var h = '<div class="stephead"><p class="kicker">Step 1 · Part 2 of 2</p><h2>Where in the hotel?</h2>' +
      '<p class="sub">Pick the area, then the department. If one of its use cases matches your problem, choose it. If none does, say so: steps 2 and 3 still apply.</p>' +
      '<p class="meta">' + esc(CAT.nUses + ' use cases in ' + CAT.nDepts + ' departments, from the hub’s Use-Case Catalogue.') + '</p></div>';
    h += '<section class="panel' + (ui.missing === 'where' ? ' missing' : '') + '" id="where"><h3>1. Area</h3><div class="tiles" role="group" aria-label="Area">' + CAT.cats.map(function (c) {
      var ds = CAT.depts.filter(function (d) { return d.cat === c.name; }), n = ds.reduce(function (a, d) { return a + d.uses.length; }, 0);
      return '<button type="button" class="tile" data-act="cat" data-cat="' + esc(c.name) + '" id="cat-' + esc(c.name.toLowerCase().replace(/[^a-z]/g, '')) + '" aria-pressed="' + (rec.cat === c.name) + '"><b>' + esc(c.name) + '</b>' +
        (c.line ? '<span>' + esc(c.line) + '</span>' : '') + '<span>' + esc(plural(ds.length, 'department') + ' · ' + plural(n, 'use case')) + '</span></button>';
    }).join('') + '</div>';
    if (rec.cat) {
      h += '<h3>2. Department</h3><div class="tiles" role="group" aria-label="Department">' + CAT.depts.filter(function (d) { return d.cat === rec.cat; }).map(function (d) {
        return '<button type="button" class="tile" data-act="dept" data-dept="' + esc(d.id) + '" id="dept-' + esc(d.id) + '" aria-pressed="' + (rec.dept === d.id) + '"><b>' + esc(d.name) + '</b><span>' + esc(plural(d.uses.length, 'use case')) + '</span></button>';
      }).join('') + '</div>';
    }
    var d = DEPT[rec.dept];
    if (d && d.cat === rec.cat) {
      h += '<h3>3. Use case</h3><p class="meta">Choose the one that matches your problem. “How common” is the catalogue’s rating of how widely hotels use it.</p><div class="ucs" role="radiogroup" aria-label="Use case">' + d.uses.map(function (u) {
        var on = rec.use === u.id;
        return '<label class="uc' + (on ? ' on' : '') + '" for="u-' + u.id + '"><input type="radio" name="use" id="u-' + u.id + '" value="' + u.id + '" data-use="' + u.id + '"' + (on ? ' checked' : '') + '>' +
          '<span class="ucbody"><span class="ucn">' + esc(u.n) + '</span><span class="uct">What AI does: ' + esc(u.task) + '</span>' +
          '<span class="ucm"><span>How common in hotels: <span class="lvl">' + esc(useLevel(u)) + '</span></span>' + catLink(d) + '</span></span></label>';
      }).join('') + '</div>';
    }
    var noneOn = rec.use === 'none';
    h += '<div class="ucs nonefits"><label class="uc' + (noneOn ? ' on' : '') + '" for="u-none"><input type="radio" name="use" id="u-none" value="none" data-use="none"' + (noneOn ? ' checked' : '') + '>' +
      '<span class="ucbody"><span class="ucn">None of these fits my problem</span><span class="uct">The summary will say so. Steps 2 and 3 still apply.</span></span></label></div>';
    if (ui.missing === 'where') h += '<p class="needline" role="alert">Choose the use case that matches your problem, or “None of these fits my problem”.</p>';
    h += '</section>';
    h += '<p class="pathline" id="pathline">' + pathText(true) + '</p>';
    h += sources('where');
    h += nav('Back', 'Next: what you need');
    return h;
  }
  /* "Guest-facing › Front Office › <use case>" or "… › None of these fits". */
  function pathParts() {
    var p = [];
    if (rec.cat) p.push(rec.cat);
    if (rec.dept && DEPT[rec.dept]) p.push(DEPT[rec.dept].name);
    if (rec.use === 'none') p.push('None of these fits');
    else if (USE[rec.use]) p.push(USE[rec.use].n);
    return p;
  }
  function pathText(html) {
    var p = pathParts();
    if (!p.length) return html ? 'Nothing chosen yet.' : 'Nothing chosen.';
    return html ? 'Your choice: ' + p.map(function (x, i) { return i === p.length - 1 ? '<b>' + esc(x) + '</b>' : esc(x); }).join(' › ') : p.join(' › ');
  }
  function byField(id) {
    if (rec.A[id] !== 'pl') return '';
    return '<div class="byfield"><label for="by-' + id + '">By when? (optional)</label><input type="date" id="by-' + id + '" data-by="' + id + '" value="' + esc(rec.By[id] || '') + '">' +
      '<span class="meta">Planned is not in place yet: it stays on your to-do list until it is done.</span></div>';
  }
  function itemBlock(it, isFactor) {
    var more = isFactor
      ? '<p><b>What it means:</b> ' + esc(it.def) + '</p><p><b>What good looks like:</b> ' + esc(it.good) + '</p><div><b>Warning signs</b><ul>' + it.warn.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>'
      : '<p><b>What good looks like:</b> ' + esc(it.good) + '</p>' + (it.also.length ? '<div><b>The readiness check also asks</b><ul>' + it.also.map(function (a) { return '<li>' + esc(a[1]) + ' <span class="rc">' + esc(a[0]) + '</span></li>'; }).join('') + '</ul></div>' : '');
    more += evidence(it.ev);
    return '<fieldset class="qa' + (ui.missing === it.id ? ' missing' : '') + '" id="f-' + it.id + '" aria-labelledby="t-' + it.id + '"><h3>' + esc(it.name) + (it.key ? ' <span class="keytag">Must-have in the readiness check</span>' : '') + '</h3>' +
      '<p class="qhint">' + esc(isFactor ? it.def : it.plain) + '</p>' +
      '<p class="qtext" id="t-' + it.id + '">' + esc(it.check) + ' <span class="rc" title="Readiness check question code">' + esc(it.rc === 'new' ? 'new question' : it.rc) + '</span></p>' +
      radios(it.id, C.ANSWERS, rec.A[it.id]) + byField(it.id) + needLine(it.id) +
      fold('more-' + it.id, isFactor ? 'What good looks like, warning signs and evidence' : 'What good looks like and evidence', more) + '</fieldset>';
  }
  function vNeeds() {
    return '<div class="stephead"><p class="kicker">Step 2 of 3</p><h2>What you need to implement AI</h2>' +
      '<p class="sub">Ten things every hotel needs before an AI tool can work, whatever the tool. The first five matter most: they are must-haves in the readiness check. Answer each for the problem you have in mind (“Don’t know yet” is fine).</p></div>' +
      '<section class="panel">' + C.NEEDS.map(function (it) { return itemBlock(it, false); }).join('') + '</section>' + sources('needs') + nav('Back', 'Next: what makes it succeed');
  }
  function vSuccess() {
    return '<div class="stephead"><p class="kicker">Step 3 of 3</p><h2>What makes it succeed</h2>' +
      '<p class="sub">Nine factors that decide whether an AI project works once it starts. Answer each (“Don’t know yet” is fine).</p></div>' +
      '<section class="panel">' + C.FACTORS.map(function (it) { return itemBlock(it, true); }).join('') + '</section>' + sources('success') + nav('Back', 'See the summary');
  }

  // ---------- summary ----------
  var ANS_WORD = { n: 'No', p: 'Partly', k: 'Don’t know yet', pl: 'Planned' };
  function canCheck() { var u = USE[rec.use]; return !!(u && !u.notTool); }
  function checkWhyNot() {
    if (rec.use === 'none') return 'You chose “None of these fits”. The readiness check looks at one specific tool, so pick a use case in step 1 (Back) to use it.';
    var u = USE[rec.use]; if (u && u.notTool) return '“' + u.n + '” is a document, not an AI tool, so the readiness check has no check for it.';
    return 'Choose a use case in step 1 to check one tool in detail.';
  }
  function checkHref() { return '../readiness-check/index.html#use=' + encodeURIComponent(rec.use); }
  function vSummary() {
    var v = L.verdict(rec.Q), name = hotelName(), A = rec.A;
    var cN = L.counts(A, L.NEED_IDS), cF = L.counts(A, L.FACTOR_IDS), ov = L.overall(A), top = L.weakest(A, 3);
    var h = '<div class="printhead"><p class="meta">Readiness 2.0 · summary · printed ' + esc(L.fmtDate(new Date().toISOString().slice(0, 10))) + '</p></div>';
    h += '<div class="stephead"><h2>Your summary' + (name ? ': ' + esc(name) : '') + '</h2><p class="sub">No score: what you said, what is missing and what to do next.</p></div>';
    h += '<section class="verdict ' + vClass(v.key) + '" id="sum-verdict" data-verdict="' + v.key + '"><p class="kicker">Is this an AI problem?</p>' + verdictBody(v, true) + '</section>';
    var u = USE[rec.use];
    h += '<section class="panel" id="sum-where"><h3>Where it sits</h3><p class="pathline">' + esc(pathText(false)) + '</p>' +
      (u ? '<p class="sub">What AI does: ' + esc(u.task) + '</p><p class="meta">How common in hotels: ' + esc(useLevel(u)) + ' (Use-Case Catalogue rating).</p>'
        : '<p class="sub">None of the catalogue’s ' + esc(CAT.nUses) + ' use cases matches your problem. That is worth telling the project team; steps 2 and 3 still apply.</p>') + '</section>';
    h += '<section class="panel" id="sum-counts"><div class="sumgrid"><div><h3>What you need (step 2)</h3><p class="countline" id="count-needs">' + esc(L.countLine(cN)) + '</p></div>' +
      '<div><h3>What makes it succeed (step 3)</h3><p class="countline" id="count-success">' + esc(L.countLine(cF)) + '</p></div></div>' +
      '<p id="overall" data-overall="' + ov.key + '"><strong>' + esc(ov.text) + '</strong></p></section>';
    if (top.length) {
      h += '<section class="panel first" id="first3"><h3>Start with these ' + (top.length === 3 ? 'three' : top.length === 2 ? 'two' : 'one') + '</h3><ol>' + top.map(function (x) {
        var a = L.action(x.id, x.v, rec.By[x.id]);
        return '<li data-item="' + x.id + '">' + esc(a.text) + '<span>' + esc(a.name + ' · your answer: ' + ANS_WORD[x.v] + ' · usually: ' + a.who) + '</span></li>';
      }).join('') + '</ol></section>';
    }
    var all = L.actions(A, rec.By);
    h += '<section class="panel" id="todo"><h3>What to do next, item by item</h3>' + (all.length ? ['needs', 'success'].map(function (step) {
      var rows = all.filter(function (a) { return a.step === step; }); if (!rows.length) return '';
      return '<p class="meta">' + (step === 'needs' ? 'What you need' : 'What makes it succeed') + '</p><div class="todo">' + rows.map(function (a) {
        return '<div class="row" data-item="' + a.id + '"><div><span class="nm">' + esc(a.name) + ' <span class="chip a-' + a.v + '">' + esc(ANS_WORD[a.v]) + '</span></span>' + esc(a.text) + '</div><span class="who">' + esc(a.who) + '</span></div>';
      }).join('') + '</div>';
    }).join('') : '<p>Everything in steps 2 and 3 is in place.</p>') + '</section>';
    h += '<section class="panel handover noprint" id="handover"><h3>Next: check one tool in detail</h3>' +
      (canCheck() ? '<p class="sub">The readiness check asks the detailed questions for “' + esc(u.n) + '” and gives a verdict and a to-do list by person.</p>' : '<p class="sub" id="check-why">' + esc(checkWhyNot()) + '</p>') +
      '<div class="btnrow">' + (canCheck() ? '<a class="btn primary" id="check-one" data-act="check-one" href="' + esc(checkHref()) + '">Check one tool in detail</a>'
        : '<button type="button" class="btn primary" id="check-one" disabled aria-describedby="check-why">Check one tool in detail</button>') +
      '<button type="button" class="btn" data-act="copy" id="copy">Copy summary</button><button type="button" class="btn" data-act="print" id="print">Print</button>' +
      '<button type="button" class="btn" data-act="restart" id="restart">Start again</button></div>' +
      (ui.copy ? '<div class="copybox" id="copybox"><label for="copytext" class="meta">Copying is blocked here. Select the text and copy it yourself:</label><textarea id="copytext" readonly>' + esc(summaryText()) + '</textarea></div>' : '') + '</section>';
    h += '<div class="navrow noprint"><button type="button" class="btn back" data-act="back" id="back">Back</button><span class="spacer"></span><button type="button" class="linkbtn" data-act="edit" id="edit">Change answers from the start</button></div>';
    return h;
  }
  /* The summary as plain text (Copy summary). */
  function summaryText() {
    var v = L.verdict(rec.Q), A = rec.A, name = hotelName(), out = [];
    out.push('Readiness 2.0: summary' + (name ? ' for ' + name : '') + ' (' + L.fmtDate(new Date().toISOString().slice(0, 10)) + ')');
    out.push('', 'Is this an AI problem? ' + (v.key === 'go' ? C.VERDICT.goDone : v.head) + (v.second ? ' ' + v.second : ''));
    v.carried.forEach(function (c) { out.push('- ' + c.text + (c.add ? ' ' + c.add : '')); });
    v.find.forEach(function (f) { out.push('- To find out: ' + f.text + ' (ask ' + f.who + ')'); });
    out.push('', 'Where it sits: ' + pathText(false));
    out.push('', 'What you need (step 2): ' + L.countLine(L.counts(A, L.NEED_IDS)));
    out.push('What makes it succeed (step 3): ' + L.countLine(L.counts(A, L.FACTOR_IDS)));
    out.push(L.overall(A).text);
    var top = L.weakest(A, 3);
    if (top.length) { out.push('', 'Start with these:'); top.forEach(function (x, i) { var a = L.action(x.id, x.v, rec.By[x.id]); out.push((i + 1) + '. ' + a.text + ' (' + a.who + ')'); }); }
    var all = L.actions(A, rec.By);
    if (all.length) { out.push('', 'What to do next, item by item:'); all.forEach(function (a) { out.push('- ' + a.name + ' [' + ANS_WORD[a.v] + ']: ' + a.text + ' (' + a.who + ')'); }); }
    out.push('', 'Student prototype by EHL SBP Group 36 for HFTP, not legal advice. Content as of ' + C.AS_OF + '.');
    return out.join('\n');
  }
  function copySummary() {
    var t = summaryText();
    function fallback() { ui.copy = true; render(); var ta = $('copytext'); if (ta) { ta.focus(); ta.select(); } }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('Summary copied.'); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3500); }

  // ---------- render ----------
  var VIEWS = { start: vStart, q: vQ, stop: vStop, where: vWhere, needs: vNeeds, success: vSuccess, summary: vSummary };
  function render() {
    var a = document.activeElement, keep = a && a.id && a !== document.body ? a.id : null;
    $('app').setAttribute('data-state', rec.step);
    $('app').setAttribute('data-verdict', L.verdict(rec.Q).key);
    $('hdr').innerHTML = header();
    $('view').innerHTML = confirmBox() + VIEWS[rec.step]();
    if (keep && $(keep) && keep !== 'view') $(keep).focus({ preventScroll: true });
  }

  // ---------- events ----------
  function onClick(e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'cat') send('cat', t.getAttribute('data-cat'));
    else if (act === 'dept') send('dept', t.getAttribute('data-dept'));
    else if (act === 'copy') copySummary();
    else if (act === 'print') window.print();
    else if (act === 'check-one') {
      if (!canCheck()) { e.preventDefault(); return; }
      if (IN_HUB) { e.preventDefault(); try { window.parent.postMessage({ hub: 'open', tool: 'readiness-check', hash: 'use=' + rec.use }, location.origin); } catch (err) { location.href = checkHref(); } }
    } else if (act === 'catalogue') {
      if (IN_HUB) { e.preventDefault(); try { window.parent.postMessage({ hub: 'open', tool: 'use-case-catalogue', hash: t.getAttribute('data-dept') }, location.origin); } catch (err) { /* ignore */ } }
    } else send(act);
  }
  document.addEventListener('click', onClick);
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-answer]')) send('answer', { id: t.getAttribute('data-answer'), value: t.value });
    else if (t.matches('input[data-use]')) send('use', t.value);
    else if (t.matches('input[data-by]')) send('by', { id: t.getAttribute('data-by'), date: t.value || '' });
  });
  document.addEventListener('toggle', function (e) { var d = e.target; if (d && d.getAttribute && d.getAttribute('data-fold')) ui.open[d.getAttribute('data-fold')] = d.open; }, true);
  window.addEventListener('popstate', function (e) { var s = e.state && typeof e.state.r2 === 'string' ? e.state.r2 : 'start'; send('pop', s); });
  /* Another tab of this browser changed the saved record: follow it, so two tabs never overwrite each other silently. */
  window.addEventListener('storage', function (e) { if (e.key !== F.KEY) return; var r = load(); if (r) { rec = r; ui.confirm = null; ui.missing = null; render(); } });

  try { history.replaceState({ r2: rec.step }, ''); } catch (e) { /* ignore */ }
  render();

  /* AX: read the state without scraping the page; drive it with the same events the buttons send. */
  window.Readiness2 = {
    state: function () {
      var v = L.verdict(rec.Q), c = ctx();
      return { step: rec.step, Q: Object.assign({}, rec.Q), verdict: v.key, carried: v.carried.map(function (x) { return x.id; }), find: v.find.map(function (x) { return x.id; }),
        cat: rec.cat, dept: rec.dept, use: rec.use, A: Object.assign({}, rec.A), By: Object.assign({}, rec.By), ctx: c, events: F.events(rec.step, c),
        confirm: ui.confirm, missing: ui.missing, copyBox: ui.copy, storage: storage, inHub: IN_HUB, canCheck: canCheck(),
        counts: rec.step === 'summary' ? { needs: L.counts(rec.A, L.NEED_IDS), success: L.counts(rec.A, L.FACTOR_IDS) } : null,
        weakest: rec.step === 'summary' ? L.weakest(rec.A, 3).map(function (x) { return x.id; }) : null };
    },
    record: function () { return JSON.parse(JSON.stringify(rec)); },
    send: send,
    summaryText: summaryText,
    catalogue: { uses: CAT.nUses, depts: CAT.nDepts }
  };
})();

</script>
</body>
</html>
