<style>

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}

.wrap{max-width:880px;margin:0 auto;padding-block:26px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:2.125rem;line-height:1.08;margin:0;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-size:1.375rem;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:600}
p{margin:0}
ul,ol{margin:0}
.sub{color:var(--ink2);max-width:66ch}
.meta{font-size:0.875rem;color:var(--ink3);max-width:68ch}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-size:0.9375rem;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.warn{border-color:var(--lo);color:var(--lo)}
.btn:active,.opt:active,.tile:active{transform:translateY(1px);filter:brightness(.96)}
.linkbtn{border:none;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;text-align:left;font:inherit;min-height:44px;display:inline-flex;align-items:center}
#view{display:flex;flex-direction:column;gap:18px}
#view:focus{outline:none}

/* header */
.hdr{display:flex;flex-direction:column;gap:6px}
.hdrtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdrline{font-size:0.9375rem;color:var(--ink2);min-width:0}
.hdrline strong{color:var(--ink)}
.honest{margin-top:2px;max-width:66ch}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.steps3 span{height:5px;border-radius:3px;background:var(--line)}
.steps3 span.done{background:var(--accent)}
.steps3 span.now{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}

/* start screen */
.journey{list-style:none;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:j}
.journey li{display:grid;grid-template-columns:2.25rem minmax(0,1fr);gap:2px 10px;padding:12px 0;border-top:1px solid var(--line2);counter-increment:j}
.journey li:first-child{border-top:0;padding-top:0}
.journey li::before{content:counter(j);grid-row:1/3;font-family:var(--display);font-size:1.5rem;font-weight:700;color:var(--accent);line-height:1.1}
.journey b{font-weight:600}
.journey span{color:var(--ink2);font-size:0.9375rem}

/* questions */
.stephead{display:flex;flex-direction:column;gap:4px}
.kicker{font-size:0.8125rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.qa{border:0;border-top:1px solid var(--line2);padding:16px 0 6px;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.qa:first-of-type{border-top:0;padding-top:0}
.qa legend{font-weight:400;padding:0;float:left;width:100%}
.qa legend + *{clear:both}
.qrow{display:grid;grid-template-columns:1.75rem minmax(0,1fr);gap:0 8px}
.qno{font-family:var(--display);font-weight:700;font-size:1.125rem;color:var(--accent);line-height:1.35}
.qtext{font-size:1.125rem;font-weight:600;line-height:1.35}
.qhint{font-size:0.9375rem;color:var(--ink2);max-width:66ch}
.qbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--ctl);border-radius:6px;padding:5px 13px;cursor:pointer;font-weight:500;font-size:0.9375rem;background:var(--panel);position:relative;min-height:44px;display:inline-flex;align-items:center}
.opt.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.opt.on::before{content:"\2713\00a0";font-weight:700}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.missing{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.needline{color:var(--accent);font-weight:600;font-size:0.9375rem}
.rc{font-family:var(--mono);font-size:0.75rem;color:var(--ink3);white-space:nowrap}
.qguard{color:var(--ink);border-left:3px solid var(--line);padding-left:10px}
.gloss{font-size:0.875rem;color:var(--ink2);max-width:66ch;margin-top:2px}
.weak{font-size:0.8125rem;color:var(--md);background:var(--md-s);border-radius:4px;padding:3px 8px;margin:2px 0 4px;max-width:66ch;width:fit-content}
.savewarn{font-size:0.9375rem;font-weight:600;color:var(--md);background:var(--md-s);border-radius:6px;padding:8px 12px;margin:8px 0 0;max-width:68ch}
.keytag{display:inline-block;font-size:0.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px;vertical-align:2px;white-space:nowrap}
.byfield{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:0.9375rem}

details.more[open] > summary::before{transform:rotate(90deg)}
.morebody{display:flex;flex-direction:column;gap:8px;padding:2px 0 6px 1.25em;border-left:2px solid var(--line);margin-left:.35em;max-width:70ch}
.morebody p,.morebody li{color:var(--ink2)}
.morebody b{color:var(--ink);font-weight:600}
.morebody ul{padding-left:18px;display:flex;flex-direction:column;gap:3px}
.ev{font-size:0.875rem}
.ev .src{display:block;color:var(--ink3);font-size:0.8125rem}
.sources ul{padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:0.875rem;color:var(--ink2)}

/* verdicts */
.verdict{border-width:0 0 0 6px;border-style:solid;border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px}
.verdict.v-stop{background:var(--lo-s);border-color:var(--lo)}
.verdict.v-hold{background:var(--md-s);border-color:var(--md)}
.verdict.v-open{background:var(--accent-soft);border-color:var(--accent)}
.verdict.v-go{background:var(--hi-s);border-color:var(--hi)}
.vsent{font-family:var(--display);font-size:1.625rem;line-height:1.18;font-weight:700;max-width:32ch;text-wrap:balance}
.verdict ul{padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.stopcard{padding:28px 24px}
.stopcard h1{font-size:2.5rem}
.stopcard p{font-size:1.0625rem;max-width:60ch}

/* 1b: where in the hotel */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--ctl);border-radius:8px;background:var(--panel);padding:12px 14px;cursor:pointer;min-height:44px}

.tile[aria-pressed="true"] span{color:var(--ink2)}
.ucs{display:flex;flex-direction:column}
.uc{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 12px;padding:12px 4px;border-top:1px solid var(--line2);cursor:pointer;align-items:start}
.uc:first-child{border-top:0}
.uc input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.ucbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.uc .ucn{font-weight:600}
.uc .uct{font-size:0.9375rem;color:var(--ink2)}

.uc .ucm a{min-height:44px;display:inline-flex;align-items:center}
.lvl{font-weight:600;color:var(--ink2)}
.nonefits{border-top:1px dashed var(--ctl);margin-top:4px}
.pathline{font-size:0.9375rem;color:var(--ink2)}
.pathline b{color:var(--ink)}

/* nav */
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.navrow .spacer{flex:1}
.confirmline{display:flex;flex-direction:column;gap:8px;border:1px solid var(--lo);border-radius:6px;padding:12px 14px;background:var(--panel)}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.countline{font-size:1.0625rem;font-weight:500}
.countline b{font-variant-numeric:tabular-nums}
.first ol{padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.first li span{display:block;font-size:0.875rem;color:var(--ink3)}
.todo{display:flex;flex-direction:column}
.todo .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:9px 0;border-top:1px solid var(--line2);align-items:start}
.todo .row:first-child{border-top:0}
.todo .who{font-size:0.8125rem;color:var(--ink3);white-space:nowrap;text-align:right}
.todo .nm{font-size:0.8125rem;color:var(--ink3);display:block}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:4px;font-size:0.75rem;font-weight:600;white-space:nowrap;line-height:1.55}
.a-n,.a-p{background:var(--lo-s);color:var(--lo)} .a-k{background:var(--accent-soft);color:var(--accent)} .a-pl{background:var(--md-s);color:var(--md)}
.handover{border-left:3px solid var(--accent)}
.copybox textarea{font:0.875rem/1.45 var(--mono);width:100%;min-height:220px;padding:10px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);color:var(--ink)}
.printhead{display:none}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:6px;font-size:0.875rem;max-width:min(92vw,560px);z-index:20}
.foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}

@media (max-width:760px){
  h1{font-size:1.75rem}
  .wrap{padding-block:14px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panel{padding:16px}
  .vsent{font-size:1.375rem}
  .stopcard{padding:22px 18px}

}
@media (prefers-reduced-motion: no-preference){ .btn,.opt,.tile{transition:background-color .12s,border-color .12s,color .12s} }

/* print: the summary only, on white, nothing to press */
@media print{
  :root{--bg:#fff;--panel:#fff;--ink:#000;--ink2:#222;--ink3:#444;--line:#bbb;--line2:#ddd}
  body{background:#fff;font-size:11pt}
  .wrap{max-width:none;padding:0;gap:10px}
  .noprint,.hdr,.navrow,#toast,.copybox,button,.btn{display:none!important}
  .printhead{display:block}
  .panel{border:1px solid #bbb;break-inside:avoid;padding:12px}
  .verdict{border-left-width:4px;background:#fff!important}
  a{color:#000;text-decoration:none}
}
/* one-line header: "Start again" stays beside the step line on phones; the step line wraps instead */
.hdrtop{flex-wrap:nowrap;align-items:flex-start}
.hdrtop .linkbtn{flex:none;white-space:nowrap;min-height:44px;margin-top:-11px}
@media (max-width:760px){ .hdrline{font-size:0.875rem} }

tion operations (GenAI/agentic)","task":"Parse rooming lists into group blocks, generate rate codes and rate plans, bulk-amend reservations and turn comments into tasks","use":"Low"},{"id":"res-7","n":"Bookable hotel apps in AI assistants (ChatGPT apps, MCP servers)","task":"An app or MCP server gives an AI assistant the hotel's live rates and availability so travellers can search and, in some cases, book direct; most apps still send the guest to the hotel website to pay","use":"Medium"},{"id":"res-8","n":"AI call scoring and conversation analytics for reservation calls","task":"AI transcribes and scores reservation calls against service standards and flags coaching points and lost bookings","use":"Low"}]},{"id":"sm","name":"Sales & Marketing","cat":"Commercial","uses":[{"id":"sm-1","n":"GenAI marketing text content & translation","task":"Draft and rewrite campaign copy, newsletters, web/offer text, social posts and ad copy, and translate or localise it","use":"High"},{"id":"sm-2","n":"Group/MICE enquiry intake & RFP/proposal response","task":"Turn inbound group/M&E enquiries (e-mail, phone, Cvent e-RFP, web) into structured leads and draft priced, branded proposals and RFP answers for seller approval, fast enough to be among the first responders","use":"Medium"},{"id":"sm-3","n":"CRM segmentation, predictive targeting, loyalty & personalised email campaigns","task":"Build guest segments and profiles, predict when or what a guest will book, time and personalise e-mail/CRM and loyalty offers, and let agents answer replies to campaigns","use":"Medium"},{"id":"sm-4","n":"GenAI imagery & video for marketing","task":"Generate or edit campaign visuals, social imagery and short videos instead of (or alongside) photo and video shoots","use":"Medium"},{"id":"sm-5","n":"Paid media, metasearch & programmatic optimisation","task":"Automate bids, budgets, audiences and placements across search, metasearch, display and social to maximise direct bookings or ROAS","use":"Medium"},{"id":"sm-6","n":"SEO / AI-search (GEO) visibility & AI-assistant distribution","task":"Measure and improve how often ChatGPT, Gemini, Perplexity and AI Overviews recommend the hotel; fix content and rate parity; expose rates and availability to AI assistants and take bookings there; AI audit tools score whether listing content is accurate and consistent across booking channels (no named hotel user)","use":"Low"},{"id":"sm-7","n":"Lead qualification, scoring & prospecting (group/MICE and B2B)","task":"Rank incoming group/B2B leads by value and likelihood to book, collect missing data, and find or research prospects so sellers work the best leads first","use":"Low"}]},{"id":"fo","name":"Front Office","cat":"Guest-facing","uses":[{"id":"fo-1","n":"Digital check-in with ID document capture (online/mobile/kiosk)","task":"Guest scans passport/ID before arrival or at kiosk; OCR/MRZ fills registration and statutory police reporting, removing desk data entry","use":"Medium"},{"id":"fo-2","n":"AI room assignment","task":"Allocate or recommend rooms using reservation details, guest preferences and stay history to speed up check-in","use":"Low"},{"id":"fo-3","n":"Biometric face verification at check-in (selfie-to-ID 1:1 match)","task":"Confirm the guest is the ID holder remotely or at kiosk via selfie/liveness match, replacing visual ID check","use":"Low"},{"id":"fo-4","n":"Front-desk copilots and PMS AI agents","task":"Staff ask the PMS natural-language questions on procedures/reports; agents draft replies or perform PMS tasks (e.g. create/edit reservations from email)","use":"Low"},{"id":"fo-5","n":"Upsell at check-in (desk, kiosk, pre-arrival)","task":"Present the right upgrade/add-on (room upgrade, early check-in, breakfast) to each guest at check-in or before arrival and push sales to the PMS","use":"Medium"},{"id":"fo-6","n":"Guest risk screening before arrival (ID, behaviour and stay-history scoring)","task":"Score each booking before arrival from ID checks, behavioural data and stay history, and flag high-risk guests for staff to review","use":"Very low"},{"id":"fo-7","n":"AI avatar or hologram receptionist (check-in kiosk)","task":"A life-sized digital avatar at a kiosk talks to guests, checks them in and issues key cards","use":"Very low"},{"id":"fo-8","n":"Lost-and-found logging and guest claim matching","task":"Staff photograph a found item with a phone; image recognition writes the description and tags, and the software compares the item with the claims guests submit. Vendors call the matching AI without explaining the method; shipping labels and payment are ordinary software, and two European tools do the same job without claiming AI. No independent hotel source and no measured result from a hotel were found","use":"Low"}]},{"id":"gx","name":"Guest Experience & Customer Service","cat":"Guest-facing","uses":[{"id":"gx-1","n":"Review analysis and sentiment / guest-feedback analytics","task":"Mine reviews, surveys and messages for sentiment and topics, flag urgent complaints, summarise improvement priorities; also automated post-stay review requests (sending the request is automation, not AI)","use":"High"},{"id":"gx-2","n":"AI chat and messaging assistant, pre-booking and in-stay (web, WhatsApp, OTA inbox; multilingual)","task":"Answer repetitive pre-booking and in-stay guest questions 24/7 across web chat, WhatsApp, social and OTA inboxes in 100+ languages, grounded in hotel knowledge; convert lookers into direct bookings; hand off complex cases to staff","use":"Medium"},{"id":"gx-3","n":"GenAI review response","task":"Draft personalised replies to online reviews in hotel tone, in bulk, with staff approval","use":"Medium"},{"id":"gx-4","n":"Guest personalisation from unified guest profile","task":"Tailor replies, offers and service to stay history, preferences, loyalty tier; detect VIPs, birthdays, special requests; the clean-up step comes first: match and merge duplicate guest records into one profile","use":"Medium"},{"id":"gx-5","n":"In-stay digital concierge and recommendations","task":"Answer in-stay questions (menus, spa, activities) and recommend/book hotel services or local experiences via app, WhatsApp or phone","use":"Medium"},{"id":"gx-6","n":"In-room voice assistant","task":"Voice requests in the room (room service, housekeeping, hotel info, room controls)","use":"Low"}]},{"id":"fb","name":"Food & Beverage service","cat":"Guest-facing","uses":[{"id":"fb-1","n":"Event and banqueting sales AI (leads, proposals, contracts)","task":"Turn event enquiries into leads and proposals, draft contracts and forecast event demand; AI banquet event orders and menu costing are not shown by any source","use":"Very low"},{"id":"fb-2","n":"In-room dining and outlet ordering via chat/voice assistants","task":"Guest orders room service or F&B requests through messaging or voice assistant that passes order to outlet","use":"Low"},{"id":"fb-3","n":"Menu engineering and F&B pricing optimisation","task":"Analyse item profitability/popularity and set prices or menu mix for outlets","use":"Very low"},{"id":"fb-4","n":"QR / mobile ordering with AI upselling and dynamic menu pricing","task":"Self-service ordering at pool, bar, room; personalised upsell and price changes to lift F&B revenue","use":"Very low"},{"id":"fb-5","n":"Room-delivery and service robots (amenities, room service, outlets)","task":"Deliver amenities, drinks and snacks to rooms (minibar replacement) or carry plates in outlets","use":"Low"},{"id":"fb-6","n":"Restaurant table reservations: voice AI and AI table management","task":"A voice agent answers restaurant calls and books, changes or cancels tables; an algorithm assigns tables","use":"Low"}]},{"id":"hk","name":"Housekeeping","cat":"Operational","uses":[{"id":"hk-1","n":"Multilingual task capture and staff messaging (voice/chat to task, translation)","task":"Staff report issues or requests by voice or chat in their own language; AI translates and creates a tracked task; staff messages are translated between languages; also live translation and captioning for guests and staff","use":"Low"},{"id":"hk-2","n":"Autonomous cleaning robots (floor care)","task":"Autonomous vacuum and floor-care robots for corridors, public areas and rooms","use":"Low"},{"id":"hk-3","n":"Linen and amenity forecasting / RFID linen tracking","task":"Tracks towels, sheets and uniforms through laundry with RFID; forecasts par levels and linen demand","use":"Low"},{"id":"hk-4","n":"Occupancy-sensor driven cleaning and room status","task":"Uses door-lock, occupancy and IoT sensor data to infer vacated rooms, DND/MUR status or needs-based cleaning of public areas; the same room sensors can flag noise, smoking or unauthorised parties; caution: in the US, in-room smoking and vape sensors have led to disputed fees charged to guests who say they never smoked. Most of these sensors work on thresholds or a vendor algorithm, not AI. No lawsuit or regulator action, and no European hotel billing guests this way, was found (checked 20 Nov 2026); a sensor alert should start a check by staff, not a charge","use":"Very low"},{"id":"hk-5","n":"Room inspection with computer vision","task":"Analyses photos of cleaned rooms to flag defects and missing amenities and confirm check-in readiness","use":"Very low"},{"id":"hk-6","n":"Room-cleaning prioritisation, assignment and workload optimisation","task":"Builds the daily cleaning plan from PMS data, predicts each clean's duration, assigns and sequences rooms, re-plans on DND/late check-out; report each attendant's minutes per room against the standard","use":"Medium"},{"id":"hk-7","n":"Bed-bug monitoring sensors with image recognition","task":"A sensor pod under the mattress or by the bed draws insects in and photographs whatever enters; image recognition decides whether it is a bed bug and sends the hotel the room number and the photo. The AI step is classifying the photographed insect. Results so far are measured by the vendor, and no independent test of the classifier was found","use":"Low"}]},{"id":"me","name":"Maintenance & Engineering","cat":"Operational","uses":[{"id":"me-1","n":"AI HVAC / BMS optimisation and energy analytics (central plant)","task":"AI layer reads BMS data and adjusts plant setpoints and schedules; anomaly detection and recommissioning to cut energy; group-wide platforms forecast each hotel's energy and water use and track actual use against the forecast","use":"Medium"},{"id":"me-2","n":"Work-order triage, creation and asset register","task":"Turns photos, voice or chat into structured work orders, predicts due times, builds the asset register from equipment photos; for the asset register, engineers photograph equipment and its nameplate and AI fills in the record (one vendor, launched 2026, no hotel named)","use":"Low"},{"id":"me-3","n":"Digital twins","task":"Calibrated virtual hotel model predicts energy and water demand, simulates control strategies, supports predictive maintenance","use":"Very low"},{"id":"me-4","n":"Guest-room energy management (occupancy-based HVAC/lighting)","task":"Detects unoccupied rooms and sets back HVAC/lights; pre-conditions rooms from PMS check-in data","use":"Very low"},{"id":"me-5","n":"Predictive maintenance - OEM-connected equipment (lifts, escalators, doors)","task":"OEM remote monitoring predicts faults before breakdown and dispatches technicians","use":"Low"},{"id":"me-6","n":"Predictive maintenance - hotel-run across assets (HVAC, kitchen, technical devices)","task":"Predict faults across hotel equipment from sensor and ticket history to move from reactive to planned work (announced only)","use":"Very low"},{"id":"me-7","n":"Water leak and fault detection","task":"Analyses water-meter or fixture data to detect leaks and abnormal consumption and alert engineering","use":"Very low"}]},{"id":"kc","name":"Kitchen & Culinary Operations","cat":"Operational","uses":[{"id":"kc-1","n":"Food-waste measurement with computer vision","task":"Camera + scale identifies discarded food, quantity and time; dashboards drive cuts in overproduction and food cost","use":"Medium"},{"id":"kc-2","n":"Allergen handling and menu labelling","task":"Detect the 14 EU allergens from the menu text, label and translate menus","use":"Low"},{"id":"kc-3","n":"Intelligent cooking equipment (ovens that recognise the food)","task":"Combi ovens detect the food loaded and start the right programme","use":"Very low"},{"id":"kc-4","n":"Production, covers and breakfast-buffet forecasting (incl. purchasing quantities)","task":"Predict covers and item-level demand from occupancy and site history to set prep quantities and cut overproduction","use":"Low"},{"id":"kc-5","n":"Recipe and menu generation (GenAI)","task":"Generate recipes/menus, use surplus ingredients, suggest menu changes","use":"Low"},{"id":"kc-6","n":"Robotic cooking stations","task":"A robot portions, cooks and plates dishes such as bowls and salads around the clock, without a cook at the station","use":"Very low"}]},{"id":"pr","name":"Procurement & Purchasing","cat":"Operational","uses":[{"id":"pr-1","n":"Automated purchase recommendations / reordering","task":"Suggest order quantities and build supplier carts automatically, defaulting to approved suppliers, with a human approving the order","use":"Low"},{"id":"pr-2","n":"Demand & inventory forecasting for purchasing","task":"Predict consumption and par levels per outlet (kitchen, bars, banqueting) from sales, recipes, stock and occupancy/forecast so buyers do not over- or under-order perishables","use":"Low"},{"id":"pr-3","n":"Invoice-to-PO matching (2/3-way) & invoice error detection","task":"Match supplier invoices line by line to POs and goods receipts, flag price/quantity variances and route only exceptions","use":"Low"},{"id":"pr-4","n":"Spend analytics & stock-variance / shrink detection","task":"Analyse spend and stock movements across outlets and properties and alert on variances, shrinkage and waste","use":"Low"},{"i ":[{"id":"hr-1","n":"Labour demand forecasting and scheduling (all departments, incl. housekeeping attendants)","task":"Forecast labour demand per department and shift from occupancy, departures, covers and events, and build or adjust rotas; includes forecasting housekeeping attendant hours","use":"Medium"},{"id":"hr-2","n":"AI recruiting (conversational hiring, screening, matching)","task":"Answer candidates, capture applications and auto-schedule interviews for high-volume roles; parse CVs and match/recommend candidates to open shifts or roles; run AI first-round interviews that rate candidates' language and communication","use":"Medium"},{"id":"hr-3","n":"Onboarding and training (GenAI course creation, AI coaching, microlearning)","task":"Turn SOPs and handbooks into microlearning and on-shift guidance; link guest-review issues to training; let staff practise service recovery with an AI coach","use":"Medium"},{"id":"hr-4","n":"Retention and attrition prediction, engagement analytics","task":"Predict which staff are likely to leave","use":"Very low"},{"id":"hr-5","n":"Seasonal staff matching to properties","task":"Machine learning proposes which seasonal staff go to which property, from skills, languages and availability; people validate the choice","use":"Low"},{"id":"hr-6","n":"Biometric staff time clocks (face or fingerprint attendance)","task":"Staff clock in and out by face or fingerprint instead of a card or PIN; clock-in on the staff member's phone, limited by GPS or geofence to the hotel, is the alternative without biometrics (a fixed location rule, not AI)","use":"Very low"}]},{"id":"gm","name":"General Management & Administration","cat":"Administrative","uses":[{"id":"gm-1","n":"BI and KPI dashboards with AI analysis","task":"Consolidate PMS/finance/F&B KPIs into dashboards; explain changes and suggest next steps; forecasts","use":"Medium"},{"id":"gm-2","n":"GenAI copilots and enterprise assistants for managers and corporate staff","task":"Draft, summarise, analyse and report (finance close, owner communications, research) via a company-licensed LLM assistant","use":"Medium"},{"id":"gm-3","n":"Meeting, briefing and report automation","task":"Auto-generate daily performance summaries and morning briefings; answer natural-language operational queries","use":"Medium"},{"id":"gm-4","n":"Enterprise AI and data platforms at hotel groups","task":"Group-wide data and AI foundation and governance (centres of excellence, model-agnostic platforms) on which staff and guest AI use cases are built","use":"Medium"},{"id":"gm-5","n":"Owner and asset-manager reporting","task":"Consolidate multi-property, multi-operator data for owners and draft variance commentary","use":"Very low"},{"id":"gm-6","n":"Frontline staff knowledge assistant (handbook and SOP questions)","task":"A chat assistant in the staff app answers questions from the hotel's own handbook and procedures","use":"Low"},{"id":"gm-7","n":"Internal tools built with AI coding assistants","task":"Staff build small internal tools (data pulls, dashboards, connectors between systems) with an AI coding assistant, while core systems such as PMS, payments and POS stay with vendors; no European hotel example was found, and the two named operators are in the US and self-reported","use":"Very low"}]},{"id":"it","name":"IT & Security","cat":"Administrative","uses":[{"id":"it-1","n":"AI threat detection and autonomous response (network, email, endpoint)","task":"Detect and contain intrusions, phishing, account takeover and ransomware across multi-property estates with lean security teams","use":"Medium"},{"id":"it-2","n":"AI IT service desk","task":"Answer and route staff IT requests, transcribe and summarise calls, and create incidents automatically across properties","use":"Medium"},{"id":"it-3","n":"Booking fraud detection (reservation, OTA-impersonation and card-not-present fraud at booking)","task":"Detect fraudulent bookings, compromised booking-platform accounts and phishing th <script>
/* AI starting point (formerly "Readiness 2.0"; folder tools/readiness-2): every word a hotel reads about the questions, the prerequisites and the success factors.
   Source of all content: research_notes/AI starting point/research.md (23 Nov 2026). Section letters there:
   A = the five questions (step 1a here), B = prerequisites (step 2), C = success factors (step 3), D = scale and summary.
   Rules kept (CLAUDE.md): no source the project bans; every figure carries its source and base;
   only sources the research marks [opened] are listed or quoted (no [abstract] or [search-only] items).
   rc: the readiness-check question code the self-check comes from (tools/readiness-check/src/logic.js, rules v4); 'new' = wording new in the research. */
(function (root) {
  'use strict';

  /* ---------- Step 1a: is this an AI problem? (research A) ---------- */
  var QUESTIONS = [
    { id: 'q1', short: 'Needs judgement, not fixed rules',
      q: 'Is this job too varied to write down as fixed rules (if this, then that)?',
      hint: 'Yes if every case is different, like guest emails, photos or tomorrow’s demand. No if you could write it as rules, like “send an email 3 days before arrival” or “reorder towels when stock falls below 200”.',
      guard: 'Judge the job, not how you handle it today. If you use rules now only because nothing better was available, for example price rules, answer Not sure.', // v1.2, council BUILD NOW 1
      why: 'Software that only follows rules written by people is not AI, and a simpler tool is cheaper, easier to explain and easier to fix.',
      yes: 'Reading guest emails in five languages and drafting replies.',
      no: 'Sending a pre-arrival email three days before arrival, or alerting when a room is not cleaned by 14:00.',
      outcome: 'Not suitable for AI: rules or ordinary automation will do it.', // v1.2 (owner B2): was "Not an AI problem: …"
      who: 'the vendor or IT' },
    { id: 'q2', short: 'Worth real money or hours',
      q: 'Does the job come up often enough, or cost enough, that doing it better would be worth real money or staff hours every month?',
      hint: '',
      why: 'AI tools have set-up, subscription, checking and training costs. A rare or small task seldom repays them.',
      yes: 'About 400 guest emails a week at front office.',
      no: 'A 12-room guesthouse with 10 email enquiries a week.',
      outcome: 'Probably not worth it.', add: 'Look again if the volume grows, or if a tool you already pay for adds it.',
      who: 'the GM or finance' },
    { id: 'q3', short: 'Information is digital and current',
      q: 'Is the information the tool needs already kept somewhere digital and up to date?',
      hint: 'Examples: bookings, past guest messages, rates, your hotel’s facts and menus.',
      why: 'If the facts sit on paper, in one person’s head or in five systems that disagree, the tool gives wrong answers with confidence.',
      yes: 'One up-to-date fact sheet (rooms, hours, policies) for a guest chatbot.',
      no: 'Allergen information only in the chef’s binder.',
      outcome: 'Fix the data first.', add: 'Put the facts in one place and name who keeps them right. Then ask again.',
      who: 'IT or the department head' },
    { id: 'q4', short: 'Mistakes can be caught',
      q: 'If the tool gets it wrong now and then, can the mistake be spotted and put right before it hurts a guest, a staff member or the hotel?',
      hint: '',

    out.push(L.overall(A).text);
    var top = L.weakest(A, 3);
    if (top.length) { out.push('', 'Start with these:'); top.forEach(function (x, i) { var a = L.action(x.id, x.v, rec.By[x.id]); out.push((i + 1) + '. ' + a.text + ' (' + a.who + ')'); }); }
    var all = L.actions(A, rec.By);
    if (all.length) { out.push('', 'What to do next, item by item:'); all.forEach(function (a) { out.push('- ' + a.name + ' [' + ANS_WORD[a.v] + ']: ' + a.text + ' (' + a.who + ')'); }); }
    var ho = handover(); out.push('', 'Next step: ' + ho.text + (ho.mode !== 'blocked' ? ' ' + L.HANDOVER_NOTE : ''));
    out.push('', 'Student prototype by EHL SBP Group 36 for HFTP, not legal advice. Content as of ' + C.AS_OF + '.');
    return out.join('\n');
  }
  function copySummary() {
    var t = summaryText();
    function fallback() { ui.copy = true; render(); var ta = $('copytext'); if (ta) { ta.focus(); ta.select(); } }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('Summary copied.'); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3500); }

  // ---------- PDF download (the readiness check's way: hub bridge, plain link outside the hub) ----------
  var DL_LABEL = { making: 'Preparing the PDF…', waiting: 'Preparing the PDF…', saving: 'Saving the PDF…' };
  function pdfButton(label) {
    var busy = ui.dl !== 'idle';
    return '<button type="button" class="btn" data-act="pdf" id="pdf"' + (busy ? ' disabled aria-busy="true"' : '') + '>' + esc(busy ? DL_LABEL[ui.dl] : label) + '</button>';
  }
  function dlSend(ev) {
    var to = F.dlNext(ui.dl, ev, host.state); if (to === null) return false;
    ui.dl = to; $('app').setAttribute('data-dl', to);
    var b = $('pdf'); if (b) { b.disabled = to !== 'idle'; if (to !== 'idle') { b.setAttribute('aria-busy', 'true'); b.textContent = DL_LABEL[to]; } else render(); }
    return true;
  }
  /* BRIDGE machine (F.bridgeNext). Each download sent to the hub is in flight until its 'download-result', or 2 minutes
     (the hub may be showing the person a save dialog), which arrives as a 'fail' event. */
  var host = { state: IN_FRAME && !FOREIGN_PARENT ? 'pending' : 'none', pong: false, waiters: [], seq: 0, calls: {} };
  function hostSend(ev) {
    var to = F.bridgeNext(host.state, ev); if (to === host.state) return;
    host.state = to; $('app').setAttribute('data-bridge', to); host.waiters.splice(0).forEach(function (f) { f(); });
  }
  $('app').setAttribute('data-bridge', host.state); $('app').setAttribute('data-dl', ui.dl);
  if (host.state === 'pending') {
    window.addEventListener('message', function (e) {
      if (e.source !== window.parent || !e.data) return;
      var m = e.data;
      if (m.hub === 'pong') { var first = !host.pong; host.pong = true; hostSend(m.downloads ? 'yes' : 'no'); if (first) render(); } // links become hub messages
      else if (m.hub === 'download-result' && host.calls[m.id]) { var cb = host.calls[m.id]; delete host.calls[m.id]; cb(m); }
    });
    try { window.parent.postMessage({ hub: 'ping' }, location.origin); } catch (e) { hostSend('error'); }
    setTimeout(function () { hostSend('timeout'); }, 12000);
  }
  function saveFile(name, blob) {
    function viaLink() {
      try { var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); toast('Download started: ' + name); dlSend('done'); }
      catch (e) { toast('This browser could not save the file.'); dlSend('fail'); }
    }
    function go2() {
      dlSend('bridge');
      if (host.state !== 'yes') { viaLink(); return; }
      var id = 'r2d' + (++host.seq), t = setTimeout(function () { if (host.calls[id]) host.calls[id]({ ok: false, code: 'timeout' }); delete host.calls[id]; }, 120000);
      host.calls[id] = function (m) {
        clearTimeout(t);
        toast(m.ok ? 'Saved ' + name : m.code === 'declined' ? 'Download cancelled.' : m.code === 'timeout' ? 'No answer about the download. Try again.' : 'The file could not be saved here.');
        dlSend(m.ok ? 'done' : 'fail');
      };
      try { window.parent.postMessage({ hub: 'download', id: id, filename: name, data: blob }, location.origin); }
      catch (e) { var cb = host.calls[id]; delete host.calls[id]; cb({ ok: false, code: 'unavailable' }); }
    }
    if (host.state === 'pending') { toast('Preparing the download…'); host.waiters.push(go2); } else go2();
  }
  var PDF_FONT = null;
  function pdfFont() { return PDF_FONT || (PDF_FONT = (function () { try { return JSON.parse($('r2-font').textContent); } catch (e) { return null; } })()); }
  function todayIso() { return L.localIso(); } // v1.2: the local day (was UTC)
  /* Click → 'making' at once (the button is disabled and says so), then the PDF is built on the next task, so a double
     click finds the machine busy and is refused: one download at a time. */
  function downloadPdf() {
    if (rec.step !== 'summary' && rec.step !== 'stop') return false;
    if (!dlSend('start')) { toast('The PDF is still being prepared.'); return false; }
    var model = P.model(rec, CAT, { hotel: hotelName(), today: todayIso() }), name = P.fileName(hotelName(), todayIso());
    setTimeout(function () {
      var blob;
      try {
        if (!window.jspdf) throw new Error('jsPDF not bundled');
        blob = P.draw(model, window.jspdf, pdfFont()).doc.output('blob');
      } catch (e) { dlSend('fail'); toast('The PDF could not be made here. Use “Copy summary” or “Print” instead.'); return; }
      dlSend('made'); saveFile(name, blob);
    }, 30);
    return true;
  }

  // ---------- render ----------
  var VIEWS = { start: vStart, q: vQ, stop: vStop, where: vWhere, needs: vNeeds, success: vSuccess, summary: vSummary };
  function render() {
    var a = document.activeElement, keep = a && a.id && a !== document.body ? a.id : null;
    $('app').setAttribute('data-state', rec.step);
    $('app').setAttribute('data-verdict', L.verdict(rec.Q).key);
    $('app').setAttribute('data-storage', storage);
    var fk = $('foot-keep'); if (fk) fk.hidden = storage !== 'ok'; // "Your answers stay in this browser" only when they do
    $('hdr').innerHTML = header();
    $('view').innerHTML = confirmBox() + VIEWS[rec.step]();
    if (keep && $(keep) && keep !== 'view') $(keep).focus({ preventScroll: true });
  }

  // ---------- events ----------
  function onClick(e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'cat') send('cat', t.getAttribute('data-cat'));
    else if (act === 'dept') send('dept', t.getAttribute('data-dept'));
    else if (act === 'copy') copySummary();
    else if (act === 'print') window.print();
    else if (act === 'pdf') { if (!t.disabled) downloadPdf(); }
    else if (act === 'check-one') {
      var ho = handover();
      if (ho.mode === 'blocked' || rec.step !== 'summary') { e.preventDefault(); return; }
      /* Hub message only once the hub has answered (clean-up L4); else the plain link does it. 'search' sends no hash: the start screen. */
      if (host.pong) { e.preventDefault(); try { window.parent.postMessage(ho.hash ? { hub: 'open', tool: 'readiness-check', hash: ho.hash } : { hub: 'open', tool: 'readiness-check' }, location.origin); } catch (err) { location.href = checkHref(); } }
    } else if (act === 'catalogue') {
      if (host.pong) { e.preventDefault(); try { window.parent.postMessage({ hub: 'open', tool: 'use-case-catalogue', hash: t.getAttribute('data-dept') }, location.origin); } catch (err) { window.open(t.getAttribute('href'), '_blank', 'noopener'); } }
    } else send(act);
  }
  document.addEventListener('click', onClick);
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-answer]')) send('answer', { id: t.getAttribute('data-answer'), value: t.value });
    else if (t.matches('input[data-use]')) send('use', t.value);
    else if (t.matches('input[data-by]')) send('by', { id: t.getAttribute('data-by'), date: t.value || '' });
  });
  document.addEventListener('toggle', function (e) { var d = e.target; if (d && d.getAttribute && d.getAttribute('data-fold')) ui.open[d.getAttribute('data-fold')] = d.open; }, true);
  /* Back/forward. Our own entry → pop to its step. Anything else (a hash change: state null; a hub entry) is not ours: the step
     stays and the entry is marked as ours (clean-up M1: it used to send the person to the start screen, and save that). */
  window.addEventListener('popstate', function (e) {
    var h = F.histRead(e.state);
    if (!h.ours) { hist.d += 1; hist.prev = rec.step; histAssert(); return; }
    hist.d = h.d; hist.prev = h.prev; hist.len = history.length;
    send('pop', h.step);
  });
  /* Another tab of this browser changed the saved record: follow it, so two tabs never overwrite each other silently.
     v1.2 (clean-up L5): the history entry follows too, and a page restored from the back-forward cache re-reads the record. */
  function follow() { var r = load(); if (!r) return; rec = r; ui.confirm = null; ui.missing = null; ui.notice = loadInfo.useChanged ? 'useChanged' : null; hist.prev = null; histAssert(); render(); }
  window.addEventListener('storage', function (e) { if (e.key === F.KEY) follow(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) follow(); });

  histAssert();
  render();

  /* AX: read the state without scraping the page; drive it with the same events the buttons send. */
  window.Readiness2 = {
    state: function () {
      var v = L.verdict(rec.Q), c = ctx();
      return { handover: rec.step === 'summary' ? handover().mode : null, notice: ui.notice, history: { d: hist.d, prev: hist.prev }, step: rec.step, Q: Object.assign({}, rec.Q), verdict: v.key, carried: v.carried.map(function (x) { return x.id; }), find: v.find.map(function (x) { return x.id; }),
        cat: rec.cat, dept: rec.dept, use: rec.use, A: Object.assign({}, rec.A), By: Object.assign({}, rec.By), ctx: c, events: F.events(rec.step, c),
        confirm: ui.confirm, missing: ui.missing, copyBox: ui.copy, storage: storage, inHub: host.pong, inFrame: IN_FRAME, canCheck: canCheck(), download: ui.dl, bridge: host.state,
        counts: rec.step === 'summary' ? { needs: L.counts(rec.A, L.NEED_IDS), success: L.counts(rec.A, L.FACTOR_IDS) } : null,
        weakest: rec.step === 'summary' ? L.weakest(rec.A, 3).map(function (x) { return x.id; }) : null };
    },
    record: function () { return JSON.parse(JSON.stringify(rec)); },
    send: send,
    summaryText: summaryText,
    pdfModel: function () { return P.model(rec, CAT, { hotel: hotelName(), today: todayIso() }); },
    pdfName: function () { return P.fileName(hotelName(), todayIso()); },
    catalogue: { uses: CAT.nUses, depts: CAT.nDepts }
  };
})();

</script>
