layout: lead2col
section: "2 Key findings"
title: Back-of-house AI is mostly pilots and promises
lead: Operations and administration hold 48 of the 91 use cases, but few are in wide use. Official data put AI use for back-office purposes in single digits.
lead_source: &cat_src "EHL SBP Group 36 (2026), Hotel AI use-case catalogue (D4, working version)"
lead_base: &cat_base "91 use cases in 15 departments, team market scan, Nov 2026; company claims, not proof of use"
figures:
  - {value: 3, label: "of 21 operational use cases are on sale with named hotel customers or wider", source: *cat_src, base: *cat_base}
  - {value: 11, label: "of 27 administrative use cases are on sale with named hotel customers or wider", source: *cat_src, base: *cat_base}
body:
  - kicker: Housekeeping
    heading: AI plans the cleaning, not the cleaning itself
    text: A panel of 22 managers and academics says algorithmic management can help set housekeeping schedules from occupancy, cleaning needs and staff availability.
    source: Jianu, Ashton & Lugosi (2025), International Journal of Hospitality Management
    base: 22 hotel managers and academics; expert consensus
  - kicker: Kitchen
    heading: Cameras cut food waste more than manual logs
    text: When kitchens moved from manual logging to camera recognition of what is thrown away, waste per cover fell a further 26% at 9 months and about 30% at 12 months.
    source: Nu, Belavina & Girotra (2025), Cornell
    base: 876 sites of 71 food-service operators using Winnow, 2016–2019; 11.1% hotels; synthetic difference-in-differences
  - kicker: Not solved yet
    heading: Where the evidence stops
    text: No credible source shows AI in hotel purchasing in practice, measures invoice automation in a European hotel, or covers AI Act and GDPR compliance work.
chart:
